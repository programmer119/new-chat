<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>SANG SUB</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050706;
      color: #e8e3d6;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: min(100vw, 56.25vh);
      height: 100vh;
      background: #18270f;
      cursor: crosshair;
    }

    #loading {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: #d8d1bf;
      font-size: 13px;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">Loading SANG SUB...</div>

  <script src="qrcode-generator.js"></script>
  <script src="jsQR.js"></script>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const loading = document.getElementById("loading");

    const assetList = {
      player: "gfx/player.png",
      enemy: "gfx/enemy_1/0.png",
      enemy2: "gfx/enemy_1/6.png",
      bullet: "gfx/bullet.png",
      bomb: "gfx/bomb.png",
      grass: "gfx/grass.png",
      gun: "gfx/gun.png",
      flashlight: "gfx/flashlight.png",
      light: "gfx/light.png",
      lightSmall: "gfx/light_small.png",
      shotLight: "gfx/shot_light.png",
      tree: "gfx/tree_base.png",
      rock: "gfx/rock_1.png",
      crate: "gfx/crate.png",
      logo: "gfx/menu/kobuge_logo.png",
      bg: "gfx/menu/bg_art.png",
      healthFull: "gfx/healthbar_full.png",
      healthEmpty: "gfx/healthbar_empty.png",
      staminaFull: "gfx/staminabar_full.png",
      staminaEmpty: "gfx/staminabar_empty.png"
    };

    const assets = {};
    const keys = new Set();
    const mouse = { x: 0, y: 0, down: false, right: false };
    let width = 0;
    let height = 0;
    let scale = 1;
    let state = "intro";
    let last = performance.now();
    let introTimer = 0;
    let introStarted = false;
    let introSoundStarted = false;
    let shootCooldown = 0;
    let bombCooldown = 0;
    let spawnTimer = 0;
    let wave = 1;
    let kills = 0;
    let shake = 0;
    let gameOverTimer = 0;
    let aimRay = null;
    let cameraMode = 2;
    let usingCustomMap = false;
    let idleRaidTimer = 0;
    let idleRaidCooldown = 0;
    let lastIdleX = 0;
    let lastIdleY = 0;
    let specialForcesEnabled = false;
    let idleRaidWarned = false;
    let raidWarningActive = false;
    let raidWarningPulse = 0;
    let voiceRecognition = null;
    let voiceRecognitionStarted = false;
    let voiceCommandStatus = "";
    let voiceCommandStatusTimer = 0;
    let voiceCommandFlash = 0;
    let raidAlarmTimer = 0;
    let coopPanel = null;
    let coopSendTimer = 0;
    let coopScanStream = null;
    let coopScanFrame = 0;
    const coop = {
      pc: null,
      channel: null,
      role: "",
      status: "OFFLINE",
      remote: null,
      connected: false
    };
    window.coop = coop;
    const isMobile = detectMobileDevice();
    const mobileControls = {
      moveId: null,
      aimId: null,
      moveX: 0,
      moveY: 0,
      knobX: 0,
      knobY: 0,
      aimKnobX: 0,
      aimKnobY: 0,
      aimX: 0,
      aimY: 0,
      aimScreenX: 0,
      aimScreenY: 0,
      aimTouchX: 0,
      aimTouchY: 0,
      shoot: false,
      dodge: false,
      weaponTouchId: null,
      weaponTouchX: 0,
      weaponTouchY: 0,
      weaponDragX: 0,
      weaponReady: false
    };
    let audioReady = false;
    let audioCtx = null;
    let noirGain = null;
    let noirPulseTimer = null;
    const audioBuffers = {};
    const noiseBuffers = {};
    const audioSampleSources = {
      playerGun: "audio/samples/gun1.wav",
      enemyGun: "audio/samples/gun2.wav",
      flamer: "audio/samples/bomb.wav",
      death: "audio/samples/enemy_die_1.wav"
    };
    const sfx = {};

    const world = { w: 2200, h: 1600 };
    const camera = { x: 0, y: 0, zoom: 1 };
    const mapTool = {
      tool: "wall",
      grid: 42,
      dragStart: null,
      preview: null,
      status: "Local map editor",
      statusTime: 0
    };
    const player = {
      x: 330,
      y: 500,
      r: 24,
      collisionR: 15,
      hp: 100,
      stamina: 100,
      angle: 0,
      targetAngle: 0,
      moveX: 0,
      moveY: 0,
      isMoving: false,
      invuln: 0,
      dodge: 0
    };
    const bullets = [];
    const bombs = [];
    const tracers = [];
    const enemyTracers = [];
    const flameBursts = [];
    const iceStorms = [];
    const enemies = [];
    const particles = [];
    const dashBursts = [];
    const flashes = [];
    const killLights = [];
    const blastLights = [];
    const fizzles = [];
    const corpses = [];
    const deathTexts = [];
    const speechBubbles = [];
    const pickups = [];
    const props = [];
    const walls = [];
    const doors = [];
    const fixtures = [];
    let fixtureBoost = 0;
    const weaponNames = { rifle: "RIFLE", bomb: "BOMB", flamer: "FLAMER", ice: "ICE", barricade: "BARR" };
    let itemDropMode = true;
    let modeVoiceSelect = false;
    let selectedWeapon = "rifle";
    let rifleAmmo = 60;
    let rifleReload = 0;
    let bombCount = 1;
    let flameAmmo = 0;
    let iceAmmo = 0;
    let barricadeCount = 0;
    let dashCharges = 3;
    let dashRecharge = 0;
    const lightCanvas = document.createElement("canvas");
    const lightCtx = lightCanvas.getContext("2d");

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      const cssWidth = Math.max(1, Math.round(rect.width));
      const cssHeight = Math.max(1, Math.round(rect.height));
      width = Math.floor(cssWidth * dpr);
      height = Math.floor(cssHeight * dpr);
      scale = dpr;
      canvas.width = width;
      canvas.height = height;
      lightCanvas.width = width;
      lightCanvas.height = height;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      width = cssWidth;
      height = cssHeight;
    }

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", (event) => {
      keys.add(event.code);
      startVoiceCommands();
      if (["Space", "KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowLeft", "ArrowDown", "ArrowRight"].includes(event.code)) {
        event.preventDefault();
      }
      if (state === "maptool") {
        handleMapToolKey(event);
        return;
      }
      if (state === "intro" && (event.code === "Enter" || event.code === "Space")) {
        event.preventDefault();
        startIntroSequence();
        return;
      }
      if (event.code === "Enter" && state === "menu") startGame();
      if (event.code === "Escape" && state === "play") goMainMenu();
      if (event.code === "KeyE" && state === "play") cycleWeapon();
      if (event.code === "Digit1") cameraMode = 1;
      if (event.code === "Digit2") cameraMode = 2;
    });
    window.addEventListener("keyup", (event) => keys.delete(event.code));
    window.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = event.clientX - rect.left;
      mouse.y = event.clientY - rect.top;
      if (state === "maptool") updateMapToolPreview();
    });
    window.addEventListener("mousedown", (event) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = event.clientX - rect.left;
      mouse.y = event.clientY - rect.top;
      ensureAudio();
      startVoiceCommands();
      if (state === "intro") {
        startIntroSequence();
        return;
      }
      if (state === "menu" && handleMenuClick(mouse.x, mouse.y)) return;
      if (state === "maptool") {
        handleMapToolMouseDown(event);
        return;
      }
      if (state === "play" && handleGameMenuButtonClick(mouse.x, mouse.y)) return;
      if (state === "play" && handleSpecialForcesToggleClick(mouse.x, mouse.y)) return;
      if (state === "play" && handleCoopButtonClick(mouse.x, mouse.y)) return;
      if (handleCameraButtonClick(mouse.x, mouse.y)) return;
      if (event.button === 2) mouse.right = true;
      else mouse.down = true;
      if (state === "menu" || state === "dead") startGame();
    });
    window.addEventListener("mouseup", (event) => {
      if (state === "maptool") {
        handleMapToolMouseUp(event);
        return;
      }
      if (event.button === 2) mouse.right = false;
      else mouse.down = false;
    });
    window.addEventListener("contextmenu", (event) => event.preventDefault());
    window.addEventListener("touchstart", handleTouchStart, { passive: false });
    window.addEventListener("touchmove", handleTouchMove, { passive: false });
    window.addEventListener("touchend", handleTouchEnd, { passive: false });
    window.addEventListener("touchcancel", handleTouchEnd, { passive: false });

    function loadImage(src) {
      return new Promise((resolve) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => {
          console.warn("Failed to load", src);
          resolve(null);
        };
        image.src = src;
      });
    }

    async function loadAssets() {
      const entries = Object.entries(assetList);
      let done = 0;
      for (const [name, src] of entries) {
        assets[name] = await loadImage(src);
        done++;
        loading.textContent = "Loading SANG SUB... " + done + "/" + entries.length;
      }
      loading.style.display = "none";
    }

    function ensureAudio() {
      if (audioReady) {
        if (!noirGain) startNoirBgm();
        unlockAudio();
        return;
      }
      audioReady = true;
      try {
        sfx.playerGun = makeAudio(audioSampleSources.playerGun, 0.28);
        sfx.enemyGun = makeAudio(audioSampleSources.enemyGun, 0.2);
        sfx.flamer = makeAudio(audioSampleSources.flamer, 0.08);
        sfx.death = makeAudio(audioSampleSources.death, 0.18);
      } catch (error) {
        console.warn("Audio init failed", error);
      }
      startNoirBgm();
      loadAudioBuffers();
      unlockAudio();
    }

    function startVoiceCommands() {
      if (voiceRecognitionStarted) return;
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        voiceCommandStatus = "VOICE COMMANDS UNSUPPORTED";
        voiceCommandStatusTimer = 2.2;
        voiceRecognitionStarted = true;
        return;
      }
      voiceRecognitionStarted = true;
      try {
        voiceRecognition = new SpeechRecognition();
        voiceRecognition.lang = "ko-KR";
        voiceRecognition.continuous = true;
        voiceRecognition.interimResults = true;
        voiceRecognition.onresult = (event) => {
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const result = event.results[i];
            if (!result || !result[0]) continue;
            const transcript = result[0].transcript || "";
            if (!handleVoiceCommand(transcript) && transcript.trim() && state === "play") {
              voiceCommandStatus = "HEARD " + transcript.trim().slice(0, 14);
              voiceCommandStatusTimer = 1.5;
            }
          }
        };
        voiceRecognition.onerror = () => {
          voiceCommandStatus = "VOICE COMMAND PAUSED";
          voiceCommandStatusTimer = 1.6;
          voiceRecognitionStarted = false;
        };
        voiceRecognition.onend = () => {
          voiceRecognitionStarted = false;
        };
        voiceRecognition.start();
        voiceCommandStatus = "VOICE COMMAND READY";
        voiceCommandStatusTimer = 2.2;
      } catch (error) {
        voiceCommandStatus = "VOICE COMMAND BLOCKED";
        voiceCommandStatusTimer = 2.2;
        voiceRecognitionStarted = false;
      }
    }

    function handleVoiceCommand(rawText) {
      if (state !== "play") {
        if (rawText && String(rawText).trim()) {
          voiceCommandStatus = "VOICE WAITING";
          voiceCommandStatusTimer = 1.2;
        }
        return false;
      }
      const command = String(rawText || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[.,!?~]/g, "");
      if (!command) return false;
      if (command.includes("\ubaa8\ub4dc") || command.includes("mode")) {
        modeVoiceSelect = true;
        voiceCommandStatus = "MODE: ITEM / NORMAL";
        voiceCommandStatusTimer = 3.2;
        acknowledgeVoiceCommand();
        return true;
      }
      if (modeVoiceSelect && (command.includes("\uc544\uc774\ud15c") || command.includes("item"))) {
        itemDropMode = true;
        modeVoiceSelect = false;
        voiceCommandStatus = "ITEM MODE";
        voiceCommandStatusTimer = 2.4;
        acknowledgeVoiceCommand();
        return true;
      }
      if (modeVoiceSelect && (command.includes("\ub178\uba40") || command.includes("normal"))) {
        itemDropMode = false;
        modeVoiceSelect = false;
        voiceCommandStatus = "NORMAL MODE";
        voiceCommandStatusTimer = 2.4;
        acknowledgeVoiceCommand();
        return true;
      }
      const specialOn = "\uc2a4\ud398\uc15c\uc628";
      const specialOnAlt = "\uc2a4\ud328\uc15c\uc628";
      const specialOne = "\uc2a4\ud398\uc15c\uc6d0";
      const specialUn = "\uc2a4\ud398\uc15c\uc5b8";
      const specialTurnOn = "\uc2a4\ud398\uc15c\ucf1c";
      const specialOff = "\uc2a4\ud398\uc15c\uc624\ud504";
      const specialOffAlt = "\uc2a4\ud328\uc15c\uc624\ud504";
      const specialOf = "\uc2a4\ud398\uc15c\uc624\ube0c";
      const specialTurnOff = "\uc2a4\ud398\uc15c\uaebc";
      const saysSpecial = command.includes("\uc2a4\ud398\uc15c") || command.includes("\uc2a4\ud328\uc15c") || command.includes("special");
      const saysOn = command.includes("\uc628") || command.includes("\uc6d0") || command.includes("\uc5b8") || command.includes("\ucf1c") || command.includes("on") || command.includes("one");
      const saysOff = command.includes("\uc624\ud504") || command.includes("\uc624\ube0c") || command.includes("\uaebc") || command.includes("off");
      if (command.includes(specialOn) || command.includes(specialOnAlt) || command.includes(specialOne) || command.includes(specialUn) || command.includes(specialTurnOn) || command.includes("specialon") || (saysSpecial && saysOn && !saysOff)) {
        setSpecialForcesEnabled(true, "SPECIAL ON", true);
        return true;
      }
      if (command.includes(specialOff) || command.includes(specialOffAlt) || command.includes(specialOf) || command.includes(specialTurnOff) || command.includes("specialoff") || (saysSpecial && saysOff)) {
        setSpecialForcesEnabled(false, "SPECIAL OFF", true);
        return true;
      }
      return false;
    }

    function setSpecialForcesEnabled(enabled, statusText = "", fromVoice = false) {
      specialForcesEnabled = enabled;
      idleRaidTimer = 0;
      idleRaidWarned = false;
      raidWarningActive = false;
      lastIdleX = player.x;
      lastIdleY = player.y;
      if (statusText) {
        voiceCommandStatus = statusText;
        voiceCommandStatusTimer = 2.4;
      }
      if (fromVoice) acknowledgeVoiceCommand();
    }

    function acknowledgeVoiceCommand() {
      voiceCommandFlash = 0.42;
      playRogerThatSound();
    }

    function playRogerThatSound() {
      ensureAudio();
      if (!audioCtx) return;
      if (audioCtx.state === "suspended" && audioCtx.resume) {
        audioCtx.resume().then(playRogerThatSound).catch(() => {});
        return;
      }
      try {
        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.24, now + 0.035);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 0.66);
        master.connect(audioCtx.destination);

        const syllables = [
          { t: 0.00, f: 118, e: 82, d: 0.18 },
          { t: 0.19, f: 132, e: 74, d: 0.16 },
          { t: 0.37, f: 104, e: 58, d: 0.22 }
        ];
        for (const s of syllables) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const filter = audioCtx.createBiquadFilter();
          osc.type = "sawtooth";
          filter.type = "lowpass";
          filter.frequency.setValueAtTime(620, now + s.t);
          filter.Q.setValueAtTime(4.2, now + s.t);
          osc.frequency.setValueAtTime(s.f, now + s.t);
          osc.frequency.linearRampToValueAtTime(s.e, now + s.t + s.d);
          gain.gain.setValueAtTime(0.0001, now + s.t);
          gain.gain.exponentialRampToValueAtTime(0.42, now + s.t + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + s.t + s.d);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(master);
          osc.start(now + s.t);
          osc.stop(now + s.t + s.d + 0.02);
        }
        playNoiseLayer({ duration: 0.08, volume: 0.055, type: "bandpass", frequency: 210, q: 0.8, start: 0.02 });
      } catch (error) {}
    }

    function detectMobileDevice() {
      try {
        const params = new URLSearchParams(window.location.search || "");
        if (params.get("mobile") === "1") return true;
        if (params.get("mobile") === "0") return false;
      } catch (error) {}
      const touchPoints = navigator.maxTouchPoints || navigator.msMaxTouchPoints || 0;
      if (touchPoints <= 0) return false;
      const ua = navigator.userAgent || "";
      const mobileUa = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua);
      const compactTouch = Math.min(window.innerWidth || 9999, window.innerHeight || 9999) <= 820;
      const coarse = !window.matchMedia || window.matchMedia("(hover: none) and (pointer: coarse)").matches;
      return mobileUa && compactTouch && coarse;
    }

    function makeAudio(src, volume) {
      const audio = new Audio(src);
      audio.preload = "auto";
      audio.volume = volume;
      return audio;
    }

    function playSfx(name, rate = 1) {
      unlockAudio();
      if (isMobile && playProceduralSfx(name, rate)) return;
      const sound = sfx[name];
      if (playBufferSfx(name, rate)) return;
      if (!sound) return;
      try {
        const clone = sound.cloneNode();
        clone.volume = sound.volume;
        clone.playbackRate = rate;
        clone.play().catch(() => {});
      } catch (error) {
        // Sound is optional; gameplay should never fail because of audio.
      }
    }

    function loadAudioBuffers() {
      if (!audioCtx || !window.fetch) return;
      for (const [name, src] of Object.entries(audioSampleSources)) {
        if (audioBuffers[name] || audioBuffers[name + "Loading"]) continue;
        audioBuffers[name + "Loading"] = true;
        fetch(src)
          .then((response) => response.arrayBuffer())
          .then((data) => audioCtx.decodeAudioData(data))
          .then((buffer) => {
            audioBuffers[name] = buffer;
          })
          .catch(() => {
            audioBuffers[name + "Failed"] = true;
          });
      }
    }

    function playBufferSfx(name, rate = 1) {
      try {
        const buffer = audioBuffers[name];
        if (!audioCtx || !buffer || audioCtx.state === "suspended") return false;
        const source = audioCtx.createBufferSource();
        const gain = audioCtx.createGain();
        source.buffer = buffer;
        source.playbackRate.value = rate;
        const volume = name === "playerGun" ? 0.32 : name === "enemyGun" ? 0.24 : name === "death" ? 0.22 : 0.14;
        gain.gain.setValueAtTime(volume, audioCtx.currentTime);
        source.connect(gain);
        gain.connect(audioCtx.destination);
        source.start(audioCtx.currentTime);
        return true;
      } catch (error) {
        return false;
      }
    }

    function getNoiseBuffer(duration = 0.25) {
      if (!audioCtx) return null;
      const key = Math.round(duration * 1000);
      if (noiseBuffers[key]) return noiseBuffers[key];
      const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
      const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let last = 0;
      for (let i = 0; i < length; i++) {
        const white = Math.random() * 2 - 1;
        last = last * 0.72 + white * 0.28;
        data[i] = last;
      }
      noiseBuffers[key] = buffer;
      return buffer;
    }

    function playNoiseLayer({ duration, volume, type = "bandpass", frequency = 900, q = 1.4, start = 0, end = 0.0001 }) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const source = audioCtx.createBufferSource();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      source.buffer = getNoiseBuffer(duration);
      filter.type = type;
      filter.frequency.setValueAtTime(frequency, now);
      filter.Q.setValueAtTime(q, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, end), now + duration);
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(now + start);
      source.stop(now + start + duration);
    }

    function playToneLayer({ type = "sine", startFreq, endFreq, duration, volume, delay = 0 }) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + duration);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playProceduralSfx(name, rate = 1) {
      try {
        if (!audioCtx) return false;
        if (audioCtx.state === "suspended" && audioCtx.resume) {
          audioCtx.resume().then(() => playProceduralSfx(name, rate)).catch(() => {});
          return true;
        }
        if (name === "playerGun") {
          playNoiseLayer({ duration: 0.075, volume: 0.24, type: "bandpass", frequency: 1750 * rate, q: 0.9 });
          playNoiseLayer({ duration: 0.045, volume: 0.12, type: "highpass", frequency: 3200 * rate, q: 0.8 });
          playToneLayer({ type: "square", startFreq: 140 * rate, endFreq: 58 * rate, duration: 0.105, volume: 0.12 });
          return true;
        }
        if (name === "enemyGun") {
          playNoiseLayer({ duration: 0.09, volume: 0.18, type: "bandpass", frequency: 1250 * rate, q: 1 });
          playToneLayer({ type: "square", startFreq: 110 * rate, endFreq: 44 * rate, duration: 0.11, volume: 0.09 });
          return true;
        }
        if (name === "flamer") {
          playNoiseLayer({ duration: 0.34, volume: 0.2, type: "lowpass", frequency: 520, q: 0.7 });
          playToneLayer({ type: "sawtooth", startFreq: 92 * rate, endFreq: 35, duration: 0.28, volume: 0.09 });
          return true;
        }
        if (name === "death") {
          playNoiseLayer({ duration: 0.22, volume: 0.1, type: "bandpass", frequency: 520, q: 1.5 });
          playToneLayer({ type: "triangle", startFreq: 230 * rate, endFreq: 65, duration: 0.36, volume: 0.12 });
          return true;
        }
        return false;
      } catch (error) {
        return false;
      }
    }

    function afterAudioResume(callback) {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === "suspended" && audioCtx.resume) {
          const resumed = audioCtx.resume();
          if (resumed && resumed.then) {
            resumed.then(callback).catch(() => {});
            return;
          }
        }
        callback();
      } catch (error) {}
    }

    function playSynthSfx(name, rate = 1) {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === "suspended" && audioCtx.resume) {
          audioCtx.resume().then(() => playSynthSfx(name, rate)).catch(() => {});
          return;
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        let type = "square";
        let start = 420;
        let end = 110;
        let volume = 0.055;
        let duration = 0.1;
        if (name === "playerGun") {
          type = "sawtooth";
          start = 620;
          end = 165;
          volume = 0.055;
          duration = 0.085;
        } else if (name === "enemyGun") {
          start = 370;
          end = 125;
          volume = 0.048;
          duration = 0.11;
        } else if (name === "flamer") {
          type = "sawtooth";
          start = 115;
          end = 36;
          volume = 0.105;
          duration = 0.24;
        } else if (name === "death") {
          type = "triangle";
          start = 210;
          end = 62;
          volume = 0.085;
          duration = 0.28;
        }
        osc.type = type;
        osc.frequency.setValueAtTime(start * rate, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, end * rate), now + duration);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.02);
      } catch (error) {}
    }

    function unlockAudio() {
      try {
        if (audioCtx && audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
        if (audioCtx) {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.03);
        }
        for (const sound of Object.values(sfx)) {
          if (!sound || sound.__unlocked) continue;
          sound.__unlocked = true;
          const oldMuted = sound.muted;
          sound.muted = true;
          sound.currentTime = 0;
          const played = sound.play();
          if (played && played.then) {
            played.then(() => {
              sound.pause();
              sound.currentTime = 0;
              sound.muted = oldMuted;
            }).catch(() => {
              sound.muted = oldMuted;
              sound.__unlocked = false;
            });
          } else {
            sound.pause();
            sound.currentTime = 0;
            sound.muted = oldMuted;
          }
        }
      } catch (error) {}
    }

    function playRaidAlarm() {
      ensureAudio();
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(720, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(420, audioCtx.currentTime + 0.22);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.055, audioCtx.currentTime + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.24);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.26);
    }

    function playParkLogoSound() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && Ctx) {
        audioCtx = new Ctx();
      }
      if (!audioCtx) return;
      if (audioCtx.state === "suspended" && audioCtx.resume) {
        audioCtx.resume().then(() => playParkLogoSound()).catch(() => {});
        return;
      }
      const now = audioCtx.currentTime;
      playSynthSfx("flamer", 1.85);
      const impacts = [0.52, 1.08, 1.64, 2.2];
      for (const [i, offset] of impacts.entries()) {
        const osc = audioCtx.createOscillator();
        const grind = audioCtx.createOscillator();
        const servo = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const grindGain = audioCtx.createGain();
        const servoGain = audioCtx.createGain();
        osc.type = "sawtooth";
        grind.type = "square";
        servo.type = "triangle";
        osc.frequency.setValueAtTime(78 - i * 5, now + offset);
        osc.frequency.exponentialRampToValueAtTime(24, now + offset + 0.36);
        grind.frequency.setValueAtTime(360 + i * 42, now + offset);
        grind.frequency.exponentialRampToValueAtTime(74, now + offset + 0.2);
        servo.frequency.setValueAtTime(760 - i * 60, now + offset - 0.07);
        servo.frequency.exponentialRampToValueAtTime(190, now + offset + 0.1);
        gain.gain.setValueAtTime(0.0001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.26, now + offset + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.42);
        grindGain.gain.setValueAtTime(0.0001, now + offset);
        grindGain.gain.exponentialRampToValueAtTime(0.12, now + offset + 0.008);
        grindGain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.24);
        servoGain.gain.setValueAtTime(0.0001, now + offset - 0.07);
        servoGain.gain.exponentialRampToValueAtTime(0.065, now + offset - 0.02);
        servoGain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.14);
        osc.connect(gain);
        grind.connect(grindGain);
        servo.connect(servoGain);
        gain.connect(audioCtx.destination);
        grindGain.connect(audioCtx.destination);
        servoGain.connect(audioCtx.destination);
        osc.start(now + offset);
        grind.start(now + offset);
        servo.start(now + offset - 0.07);
        osc.stop(now + offset + 0.44);
        grind.stop(now + offset + 0.26);
        servo.stop(now + offset + 0.15);
      }
      playParkVoiceCue(now + 2.65);
    }

    function playParkVoiceCue(when) {
      try {
        if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
          const utterance = new SpeechSynthesisUtterance("박가");
          utterance.lang = "ko-KR";
          utterance.rate = 0.82;
          utterance.pitch = 0.45;
          utterance.volume = 0.9;
          setTimeout(() => window.speechSynthesis.speak(utterance), Math.max(0, (when - audioCtx.currentTime) * 1000));
        }
      } catch (error) {}
      try {
        if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
          setTimeout(() => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance("\ubc15\uac00");
            utterance.lang = "ko-KR";
            utterance.rate = 0.82;
            utterance.pitch = 0.45;
            utterance.volume = 1;
            window.speechSynthesis.speak(utterance);
          }, Math.max(0, (when - audioCtx.currentTime) * 1000));
        }
      } catch (error) {}
      const syllables = [0, 0.28];
      for (const [i, offset] of syllables.entries()) {
        const osc = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const modGain = audioCtx.createGain();
        osc.type = "sawtooth";
        mod.type = "triangle";
        osc.frequency.setValueAtTime(i === 0 ? 142 : 118, when + offset);
        osc.frequency.exponentialRampToValueAtTime(i === 0 ? 82 : 74, when + offset + 0.18);
        mod.frequency.setValueAtTime(i === 0 ? 58 : 46, when + offset);
        gain.gain.setValueAtTime(0.0001, when + offset);
        gain.gain.exponentialRampToValueAtTime(0.11, when + offset + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + offset + 0.22);
        modGain.gain.value = 0.028;
        mod.connect(modGain);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        modGain.connect(audioCtx.destination);
        osc.start(when + offset);
        mod.start(when + offset);
        osc.stop(when + offset + 0.24);
        mod.stop(when + offset + 0.24);
      }
    }

    function startNoirBgm() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        audioCtx = new Ctx();
      }
      if (audioCtx.state === "suspended" && audioCtx.resume) {
        audioCtx.resume().then(() => startNoirBgm()).catch(() => {});
        return;
      }
      if (noirGain) {
        if (!noirPulseTimer) startNoirPulse();
        return;
      }
      noirGain = audioCtx.createGain();
      noirGain.gain.setValueAtTime(0.07, audioCtx.currentTime);
      noirGain.connect(audioCtx.destination);
      const notes = [55, 82.41, 110];
      for (const [i, freq] of notes.entries()) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = i === 0 ? "sine" : "triangle";
        osc.frequency.value = freq;
        gain.gain.value = i === 0 ? 0.56 : 0.18;
        osc.connect(gain);
        gain.connect(noirGain);
        osc.start();
      }
      startNoirPulse();
    }

    function startNoirPulse() {
      if (noirPulseTimer || !audioCtx) return;
      const pulse = () => {
        if (!audioCtx || audioCtx.state === "suspended") return;
        if (isMobile) {
          playNoiseLayer({ duration: 0.42, volume: 0.018, type: "lowpass", frequency: 360, q: 0.5 });
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(146.83, now);
        osc.frequency.exponentialRampToValueAtTime(98, now + 0.42);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.045, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.58);
      };
      pulse();
      noirPulseTimer = setInterval(pulse, 4200);
    }

    function loadSavedMap() {
      try {
        const raw = localStorage.getItem("sangsub.map.v1");
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.walls) || !Array.isArray(data.doors)) return null;
        return data;
      } catch (error) {
        console.warn("Failed to load saved map", error);
        return null;
      }
    }

    function saveCurrentMap() {
      const data = serializeMapData();

        localStorage.setItem("sangsub.map.v1", JSON.stringify(data));
        mapTool.status = "Map saved.";

        return true;

        mapTool.status = "Save failed: browser storage unavailable.";

        localStorage.removeItem("sangsub.map.v1");

        buildFacilityMap();
      } finally {

    function serializeMapData() {
      return {
        version: 1,
        world: { w: world.w, h: world.h },
        walls: walls.map(({ x, y, w, h }) => ({ x, y, w, h })),
        doors: doors.map(({ x, y, w, h, axis }) => ({ x, y, w, h, axis })),
        fixtures: fixtures.map(({ x, y, w, h, angle, radius, energy }) => ({ x, y, w, h, angle, radius, energy })),
        props: props.filter((prop) => prop.type !== "barricade").map(({ x, y, type, s, a, hp, maxHp }) => ({ x, y, type, s, a, hp, maxHp }))
      };
    }

    function applyMapData(data) {
      walls.length = 0;
      doors.length = 0;
      fixtures.length = 0;
      props.length = 0;
      for (const wall of data.walls || []) {
        if (validRect(wall)) walls.push({ x: wall.x, y: wall.y, w: wall.w, h: wall.h });
      }
      for (const door of data.doors || []) {
        if (validRect(door) && (door.axis === "h" || door.axis === "v")) {
        doors.push({ x: door.x, y: door.y, w: door.w, h: door.h, axis: door.axis, open: 0, target: 0, range: 34 });
        }
      }
      for (const fixture of data.fixtures || []) {
        if (validRect(fixture)) {
          fixtures.push({
            x: fixture.x,
            y: fixture.y,
            w: fixture.w,
            h: fixture.h,
            angle: Number.isFinite(fixture.angle) ? fixture.angle : 0,
            radius: Number.isFinite(fixture.radius) ? fixture.radius : 180,
            energy: Number.isFinite(fixture.energy) ? fixture.energy : 1
          });
        }
      }
      for (const prop of data.props || []) {
        if (Number.isFinite(prop.x) && Number.isFinite(prop.y)) {
          props.push({
            x: prop.x,
            y: prop.y,
            type: prop.type === "rock" ? "rock" : "crate",
            s: Number.isFinite(prop.s) ? prop.s : 1,
            a: Number.isFinite(prop.a) ? prop.a : 0,
            hp: Number.isFinite(prop.hp) ? prop.hp : undefined,
            maxHp: Number.isFinite(prop.maxHp) ? prop.maxHp : undefined
          });
          ensurePropHealth(props[props.length - 1]);
        }
      }
    }

    function validRect(rect) {
      return Number.isFinite(rect.x) && Number.isFinite(rect.y) && Number.isFinite(rect.w) && Number.isFinite(rect.h) && rect.w > 0 && rect.h > 0;
    }

    function addWall(x, y, w, h) {
      walls.push({ x, y, w, h });
    }

    function addDoor(x, y, w, h, axis) {
      const door = { x, y, w, h, axis, open: 0, target: 0, range: 34 };
      if (doorTouchesBlockedCorner(door)) return;
      doors.push(door);
    }

    function doorTouchesBlockedCorner(door) {
      for (const wall of walls) {
        if (door.axis === "v" && wall.w > wall.h && rectOverlap(door, wall)) return true;
        if (door.axis === "h" && wall.h > wall.w && rectOverlap(door, wall)) return true;
      }
      return false;
    }

    function downloadMapJson() {
      const json = JSON.stringify(serializeMapData(), null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "sang-sub-map.json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      return json;
    }

    function addFixture(x, y, w, h, angle, radius, energy) {
      fixtures.push({ x, y, w, h, angle, radius, energy });
    }

    function addRandomProp() {
      for (let tries = 0; tries < 80; tries++) {
        const prop = {
          x: 140 + Math.random() * (world.w - 280),
          y: 140 + Math.random() * (world.h - 280),
          type: Math.random() < 0.72 ? "crate" : "rock",
          s: 0.55 + Math.random() * 0.55,
          a: Math.random() * Math.PI * 2
        };
        ensurePropHealth(prop);
        if (canPlaceProp(prop)) {
          props.push(prop);
          return;
        }
      }
    }

    function canPlaceProp(prop) {
      const rect = propCollisionRect(prop);
      if (circleRect(player.x, player.y, player.r + 80, rect)) return false;
      for (const wall of walls) {
        if (rectOverlap(rect, wall)) return false;
      }
      for (const door of doors) {
        if (rectOverlap(rect, { x: door.x - 28, y: door.y - 28, w: door.w + 56, h: door.h + 56 })) return false;
      }
      for (const existing of props) {
        if (rectOverlap(rect, propCollisionRect(existing))) return false;
      }
      return true;
    }

    function chooseEnemyKind(nearPlayer) {
      const roll = Math.random();
      if (nearPlayer) {
        if (roll < 0.48) return "melee";
        if (roll < 0.78) return "shooter";
        return "flamer";
      }
      if (roll < 0.42) return "melee";
      if (roll < 0.72) return "shooter";
      return "flamer";
    }

    function enemyMaxHp(kind, fast) {
      if (kind === "melee") return fast ? 42 : 66 + wave * 4;
      if (kind === "flamer") return fast ? 36 : 62 + wave * 3;
      return fast ? 30 : 54 + wave * 3;
    }

    function enemySpeed(kind, fast) {
      if (kind === "melee") return fast ? 178 + wave * 5 : 126 + wave * 4;
      if (kind === "flamer") return fast ? 116 + wave * 3 : 78 + wave * 2;
      return fast ? 128 + wave * 3 : 72 + wave * 2;
    }

    function spawnEnemy() {
      const rooms = [
        [90, 90, 520, 520],
        [820, 240, 520, 360],
        [1460, 140, 560, 470],
        [260, 780, 520, 420],
        [880, 840, 450, 420],
        [1480, 820, 520, 450]
      ];
      const fast = Math.random() < Math.min(0.35, wave * 0.035);
      const kind = chooseEnemyKind(false);
      const r = fast ? 18 : 24;
      const maxHp = enemyMaxHp(kind, fast);
      const pos = findFreeSpawn(rooms, r);
      if (!pos) return;
      enemies.push({
        x: pos.x,
        y: pos.y,
        r,
        collisionR: fast ? 14 : 18,
        hp: maxHp,
        maxHp,
        speed: enemySpeed(kind, fast),
        bite: 0,
        shoot: 0.55 + Math.random() * 1.15,
        kind,
        fast,
        alert: 0,
        lastSeenX: pos.x,
        lastSeenY: pos.y,
        wanderAngle: Math.random() * Math.PI * 2,
        wanderTimer: 0.4 + Math.random() * 1.2,
        wobble: Math.random() * 10
      });
    }

    function spawnEnemyNearPlayer() {
      const fast = Math.random() < 0.25;
      const kind = chooseEnemyKind(true);
      const r = fast ? 18 : 24;
      const maxHp = enemyMaxHp(kind, fast);
      let pos = null;
      for (let tries = 0; tries < 80; tries++) {
        const a = Math.random() * Math.PI * 2;
        const d = 280 + Math.random() * 260;
        const x = clamp(player.x + Math.cos(a) * d, 80, world.w - 80);
        const y = clamp(player.y + Math.sin(a) * d, 80, world.h - 80);
        if (isSpawnFree(x, y, r)) {
          pos = { x, y };
          break;
        }
      }
      if (!pos) {
        spawnEnemy();
        return;
      }
      enemies.push({
        x: pos.x,
        y: pos.y,
        r,
        collisionR: fast ? 14 : 18,
        hp: maxHp,
        maxHp,
        speed: enemySpeed(kind, fast),
        bite: 0,
        shoot: 0.55 + Math.random() * 1.15,
        kind,
        fast,
        alert: 0,
        lastSeenX: pos.x,
        lastSeenY: pos.y,
        wanderAngle: Math.random() * Math.PI * 2,
        wanderTimer: 0.4 + Math.random() * 1.2,
        wobble: Math.random() * 10
      });
    }

    function findFreeSpawn(rooms, r) {
      for (let tries = 0; tries < 120; tries++) {
        const room = rooms[Math.floor(Math.random() * rooms.length)];
        const x = room[0] + 40 + Math.random() * Math.max(1, room[2] - 80);
        const y = room[1] + 40 + Math.random() * Math.max(1, room[3] - 80);
        if (isSpawnFree(x, y, r)) return { x, y };
      }
      return null;
    }

    function isSpawnFree(x, y, r) {
      const cr = Math.max(12, r - 6);
      if (hitsSolid(x, y, cr + 8)) return false;
      if (dist2(x, y, player.x, player.y) < 150 * 150) return false;
      for (const e of enemies) {
        if (dist2(x, y, e.x, e.y) < (cr + collisionRadius(e) + 28) * (cr + collisionRadius(e) + 28)) return false;
      }
      return true;
    }

    function availableWeapons() {
      const list = ["rifle"];
      if (bombCount > 0) list.push("bomb");
      if (flameAmmo > 0) list.push("flamer");
      if (iceAmmo > 0) list.push("ice");
      if (barricadeCount > 0) list.push("barricade");
      return list;
    }

    function normalizeSelectedWeapon() {
      if (selectedWeapon === "bomb" && bombCount <= 0) selectedWeapon = "rifle";
      if (selectedWeapon === "flamer" && flameAmmo <= 0) selectedWeapon = "rifle";
      if (selectedWeapon === "ice" && iceAmmo <= 0) selectedWeapon = "rifle";
      if (selectedWeapon === "barricade" && barricadeCount <= 0) selectedWeapon = "rifle";
    }

    function cycleWeapon() {
      normalizeSelectedWeapon();
      const list = availableWeapons();
      const index = list.indexOf(selectedWeapon);
      selectedWeapon = list[(index + 1 + list.length) % list.length];
      voiceCommandStatus = "WEAPON " + weaponNames[selectedWeapon];
      voiceCommandStatusTimer = 1.2;
    }

    function nextWeapon() {
      normalizeSelectedWeapon();
      const list = availableWeapons();
      const index = list.indexOf(selectedWeapon);
      return list[(index + 1 + list.length) % list.length];
    }

    function weaponAmmoText(weapon = selectedWeapon) {
      if (weapon === "rifle") return rifleReload > 0 ? "REL " + Math.ceil(rifleReload) : rifleAmmo + "/60";
      if (weapon === "bomb") return "x" + bombCount;
      if (weapon === "flamer") return flameAmmo + "";
      if (weapon === "ice") return "x" + iceAmmo;
      if (weapon === "barricade") return "x" + barricadeCount;
      return "";
    }

    function barricadePlacement() {
      const target = isMobile ? mobileAimWorldTarget() : screenToWorld(mouse.x, mouse.y);
      const dx = target.x - player.x;
      const dy = target.y - player.y;
      const d = Math.hypot(dx, dy) || 1;
      const dist = clamp(d, 70, 190);
      const x = clamp(player.x + dx / d * dist, 70, world.w - 70);
      const y = clamp(player.y + dy / d * dist, 70, world.h - 70);
      const angle = Math.atan2(dy, dx) + Math.PI / 2;
      const prop = { x, y, type: "barricade", s: 1, a: angle, w: 88, h: 24, hp: 10, maxHp: 10, buildTime: 3 };
      return { prop, valid: canPlaceBarricade(prop) };
    }

    function canPlaceBarricade(prop) {
      if (barricadeCount <= 0) return false;
      const rect = propCollisionRect(prop);
      if (circleRect(player.x, player.y, player.r + 10, rect)) return false;
      for (const wall of walls) if (rectOverlap(rect, wall)) return false;
      for (const door of doors) {
        if (door.open < 0.72) {
          for (const part of doorCollisionRects(door)) if (rectOverlap(rect, part)) return false;
        }
      }
      for (const prop2 of props) if (propBlocksMovement(prop2) && rectOverlap(rect, propCollisionRect(prop2))) return false;
      for (const enemy of enemies) if (circleRect(enemy.x, enemy.y, collisionRadius(enemy) + 4, rect)) return false;
      return true;
    }

    function placeBarricadeFromAim() {
      if (barricadeCount <= 0) return false;
      const placement = barricadePlacement();
      if (!placement.valid) {
        voiceCommandStatus = "CANNOT PLACE";
        voiceCommandStatusTimer = 1.1;
        return false;
      }
      props.push(placement.prop);
      barricadeCount--;
      if (selectedWeapon === "barricade" && barricadeCount <= 0) selectedWeapon = "rifle";
      voiceCommandStatus = "BARRICADE";
      voiceCommandStatusTimer = 1.1;
      burst(placement.prop.x, placement.prop.y, "#dce8ee", 8);
      return true;
    }

    function fire() {
      normalizeSelectedWeapon();
      if (selectedWeapon === "bomb") return;
      if (selectedWeapon === "flamer") {
        firePlayerFlamer();
        return;
      }
      if (selectedWeapon === "ice") {
        fireIceStorm();
        return;
      }
      if (selectedWeapon === "barricade") return;
      fireRifle();
    }

    function fireRifle() {
      if (shootCooldown > 0) return;
      if (rifleReload > 0) return;
      if (rifleAmmo <= 0) {
        rifleReload = 3;
        voiceCommandStatus = "RELOADING";
        voiceCommandStatusTimer = 1;
        return;
      }
      shootCooldown = 0.11;
      rifleAmmo--;
      if (rifleAmmo <= 0) rifleReload = 3;
      playSfx("playerGun", 0.94 + Math.random() * 0.08);
      const dx = Math.cos(player.angle);
      const dy = Math.sin(player.angle);
      const sx = player.x + dx * 34;
      const sy = player.y + dy * 34;
      const hit = raycastShot(sx, sy, dx, dy, 980);
      tracers.push({
        x1: sx,
        y1: sy,
        x2: hit.x,
        y2: hit.y,
        life: 0.09,
        maxLife: 0.09
      });
      if (hit.enemy) {
        hit.enemy.hp -= 44;
        burst(hit.x, hit.y, "#9f2a24", 5);
      } else if (hit.prop && hit.prop.type === "crate") {
        damageProp(hit.prop, 1, hit.x, hit.y);
      } else if (hit.solid) {
        burst(hit.x, hit.y, "#f4efe8", 5);
      }
      flashes.push({
        x: sx + Math.cos(player.angle) * 18,
        y: sy + Math.sin(player.angle) * 18,
        angle: player.angle,
        life: 0.075,
        maxLife: 0.075
      });
      for (let i = 0; i < 4; i++) {
        particles.push({
          x: sx,
          y: sy,
          vx: Math.cos(player.angle + (Math.random() - 0.5) * 0.7) * (80 + Math.random() * 180),
          vy: Math.sin(player.angle + (Math.random() - 0.5) * 0.7) * (80 + Math.random() * 180),
          life: 0.14 + Math.random() * 0.12,
          color: "#ffd776",
          r: 2 + Math.random() * 3
        });
      }
      shake = Math.max(shake, 4);
    }

    function damageProp(prop, amount, x = prop.x, y = prop.y) {
      if (!prop || prop.type !== "crate") return;
      ensurePropHealth(prop);
      prop.hp -= amount;
      prop.hitFlash = 0.18;
      burst(x, y, "#d0b58a", 5);
      if (prop.hp <= 0) destroyProp(prop);
    }

    function addDashBurst(x, y, angle) {
      dashBursts.push({ x, y, angle, life: 0.28, maxLife: 0.28 });
      for (let i = 0; i < 12; i++) {
        const a = angle + Math.PI + (Math.random() - 0.5) * 1.4;
        particles.push({
          x,
          y,
          vx: Math.cos(a) * (120 + Math.random() * 180),
          vy: Math.sin(a) * (120 + Math.random() * 180),
          life: 0.18 + Math.random() * 0.12,
          color: "#d9f1ff",
          r: 2 + Math.random() * 3
        });
      }
    }

    function damageBarricade(prop, amount, x = prop.x, y = prop.y) {
      if (!prop || prop.type !== "barricade") return;
      ensurePropHealth(prop);
      prop.hp -= amount;
      prop.hitFlash = 0.16;
      burst(x, y, "#c9d7dd", 4);
      if (prop.hp <= 0) destroyProp(prop);
    }

    function findTouchedBarricade(entity, dx = 0, dy = 0) {
      let best = null;
      let bestD = Infinity;
      const r = collisionRadius(entity) + 13;
      const px = entity.x + dx * 8;
      const py = entity.y + dy * 8;
      for (const prop of props) {
        if (prop.type !== "barricade") continue;
        const rect = propCollisionRect(prop);
        if (!circleRect(px, py, r, rect)) continue;
        const cx = clamp(px, rect.x, rect.x + rect.w);
        const cy = clamp(py, rect.y, rect.y + rect.h);
        const d = dist2(px, py, cx, cy);
        if (d < bestD) {
          bestD = d;
          best = { prop, x: cx, y: cy };
        }
      }
      return best;
    }

    function damageBarricadesInCone(sx, sy, dx, dy, reach, baseWidth, growth, amount) {
      let damaged = 0;
      for (const prop of props) {
        if (prop.type !== "barricade") continue;
        const rect = propCollisionRect(prop);
        const corners = [
          { x: rect.x, y: rect.y },
          { x: rect.x + rect.w, y: rect.y },
          { x: rect.x, y: rect.y + rect.h },
          { x: rect.x + rect.w, y: rect.y + rect.h },
          { x: prop.x, y: prop.y }
        ];
        for (const point of corners) {
          const px = point.x - sx;
          const py = point.y - sy;
          const forward = px * dx + py * dy;
          if (forward <= 0 || forward > reach + 8) continue;
          const side = Math.abs(px * dy - py * dx);
          if (side > baseWidth + forward * growth) continue;
          if (!hasLineOfSight(sx, sy, point.x, point.y, Math.hypot(px, py), { ignoreBarricades: true })) continue;
          damageBarricade(prop, amount, point.x, point.y);
          damaged++;
          break;
        }
      }
      return damaged;
    }

    function destroyProp(prop) {
      const index = props.indexOf(prop);
      if (index < 0) return;
      if (prop.type === "crate") {
        const pieces = prop.s >= 0.9 ? 4 : 2;
        for (let i = 0; i < pieces; i++) {
          const a = (i / pieces) * Math.PI * 2 + 0.25;
          addPickup(prop.x + Math.cos(a) * (18 + i * 4), prop.y + Math.sin(a) * (18 + i * 4), "barricade");
        }
        voiceCommandStatus = "BARR ITEM x" + pieces;
        voiceCommandStatusTimer = 1.3;
      }
      burst(prop.x, prop.y, prop.type === "barricade" ? "#dce8ee" : "#c9aa78", 18);
      props.splice(index, 1);
      normalizeSelectedWeapon();
    }

    function firePlayerFlamer() {
      if (shootCooldown > 0) return;
      if (flameAmmo <= 0) {
        flameAmmo = 0;
        selectedWeapon = "rifle";
        return;
      }
      shootCooldown = 0.08;
      flameAmmo--;
      if (flameAmmo <= 0) selectedWeapon = "rifle";
      playSfx("flamer", 1.25);
      const dx = Math.cos(player.angle);
      const dy = Math.sin(player.angle);
      const sx = player.x + dx * 38;
      const sy = player.y + dy * 38;
      const reach = rayBlockDistance(sx, sy, dx, dy, 245);
      flameBursts.push({
        x: sx,
        y: sy,
        angle: player.angle,
        life: 0.16,
        maxLife: 0.16,
        length: reach,
        spread: 0.34,
        hostile: false
      });
      for (const enemy of enemies) {
        const ex = enemy.x - sx;
        const ey = enemy.y - sy;
        const forward = ex * dx + ey * dy;
        const side = Math.abs(ex * dy - ey * dx);
        if (forward > 0 && forward < reach && side < 36 + forward * 0.16 && hasLineOfSight(sx, sy, enemy.x, enemy.y, Math.hypot(ex, ey))) {
          enemy.hp -= 17;
          burst(enemy.x, enemy.y, "#e46a32", 3);
        }
      }
      damageBarricadesInCone(sx, sy, dx, dy, reach, 32, 0.16, 1);
      shake = Math.max(shake, 2.5);
    }

    function fireIceStorm() {
      if (shootCooldown > 0) return;
      if (iceAmmo <= 0) {
        iceAmmo = 0;
        selectedWeapon = "rifle";
        return;
      }
      shootCooldown = 0.52;
      iceAmmo--;
      if (iceAmmo <= 0) selectedWeapon = "rifle";
      playSfx("flamer", 1.9);
      const dx = Math.cos(player.angle);
      const dy = Math.sin(player.angle);
      const sx = player.x + dx * 36;
      const sy = player.y + dy * 36;
      const maxRange = 42 * 5;
      const reach = rayBlockDistance(sx, sy, dx, dy, maxRange);
      iceStorms.push({
        x: sx,
        y: sy,
        angle: player.angle,
        life: 0.46,
        maxLife: 0.46,
        length: reach,
        maxLength: maxRange,
        seed: Math.random() * 1000
      });
      for (const enemy of enemies) {
        const ex = enemy.x - sx;
        const ey = enemy.y - sy;
        const forward = ex * dx + ey * dy;
        const side = Math.abs(ex * dy - ey * dx);
        const cone = 18 + Math.max(0, forward) * 0.42;
        if (forward > 0 && forward < reach && side < cone && hasLineOfSight(sx, sy, enemy.x, enemy.y, Math.hypot(ex, ey))) {
          enemy.freeze = 5;
          enemy.freezeMax = 5;
          burst(enemy.x, enemy.y, "#bfefff", 12);
        }
      }
      damageBarricadesInCone(sx, sy, dx, dy, reach, 18, 0.42, 2);
      shake = Math.max(shake, 5);
    }

    function throwBomb(target) {
      if (bombCooldown > 0 || bombCount <= 0) return;
      bombCooldown = 0.72;
      bombCount--;
      if (selectedWeapon === "bomb" && bombCount <= 0) selectedWeapon = "rifle";
      const dx = target.x - player.x;
      const dy = target.y - player.y;
      const d = Math.hypot(dx, dy) || 1;
      const range = 140;
      const tx = clamp(player.x + dx / d * range, 70, world.w - 70);
      const ty = clamp(player.y + dy / d * range, 70, world.h - 70);
      bombs.push({
        x: player.x + Math.cos(player.angle) * 28,
        y: player.y + Math.sin(player.angle) * 28,
        sx: player.x,
        sy: player.y,
        tx,
        ty,
        life: 0.48,
        maxLife: 0.48,
        r: 13
      });
    }

    function throwEnemyBomb(enemy, target) {
      const dx = target.x - enemy.x;
      const dy = target.y - enemy.y;
      const d = Math.hypot(dx, dy) || 1;
      const range = Math.min(190, d);
      bombs.push({
        x: enemy.x,
        y: enemy.y,
        sx: enemy.x,
        sy: enemy.y,
        tx: clamp(enemy.x + dx / d * range, 70, world.w - 70),
        ty: clamp(enemy.y + dy / d * range, 70, world.h - 70),
        life: 0.52,
        maxLife: 0.52,
        r: 13,
        hostile: true
      });
    }

    function explodeBomb(bomb) {
      const radius = 220;
      if (pointInsideSolid(bomb.x, bomb.y)) {
        addFizzle(bomb.x, bomb.y);
        shake = Math.max(shake, 3);
        return;
      }
      addBlastLight(bomb.x, bomb.y, radius);
      playSfx("flamer", 0.72);
      burstVisible(bomb.x, bomb.y, "#ffe4b0", 34, radius);
      if (bomb.hostile) {
        const pd = Math.hypot(player.x - bomb.x, player.y - bomb.y);
        if (pd <= radius && hasExplosionLineOfSight(bomb.x, bomb.y, player.x, player.y, pd) && player.invuln <= 0) {
          player.hp -= 34 * (1 - pd / radius) + 16;
          player.invuln = 0.22;
          burst(player.x, player.y, "#9a1d18", 12);
          if (player.hp <= 0) {
            player.hp = 0;
            state = "dead";
            gameOverTimer = 0;
          }
        }
        for (const prop of props.slice()) {
          if (prop.type !== "barricade") continue;
          const d = Math.hypot(prop.x - bomb.x, prop.y - bomb.y);
          if (d <= radius && hasExplosionLineOfSight(bomb.x, bomb.y, prop.x, prop.y, d)) {
            damageBarricade(prop, 4, prop.x, prop.y);
          }
        }
        shake = Math.max(shake, 12);
        return;
      }
      for (const enemy of enemies) {
        const d = Math.hypot(enemy.x - bomb.x, enemy.y - bomb.y);
        if (d <= radius && hasExplosionLineOfSight(bomb.x, bomb.y, enemy.x, enemy.y, d)) {
          enemy.hp -= 180 * (1 - d / radius) + 90;
          burst(enemy.x, enemy.y, "#d8e8ff", 6);
        }
      }
      for (const prop of props.slice()) {
        if (prop.type !== "barricade") continue;
        const d = Math.hypot(prop.x - bomb.x, prop.y - bomb.y);
        if (d <= radius && hasExplosionLineOfSight(bomb.x, bomb.y, prop.x, prop.y, d)) {
          damageBarricade(prop, 4, prop.x, prop.y);
        }
      }
      shake = Math.max(shake, 12);
    }

    function addBlastLight(x, y, radius) {
      blastLights.push({
        x,
        y,
        life: 0.34,
        maxLife: 0.34,
        radius
      });
    }

    function addFizzle(x, y) {
      fizzles.push({
        x,
        y,
        life: 0.2,
        maxLife: 0.2,
        angle: Math.random() * Math.PI * 2
      });
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 55 + Math.random() * 105;
        particles.push({
          x,
          y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 0.08 + Math.random() * 0.12,
          color: Math.random() < 0.5 ? "#b9b2a6" : "#ffbf72",
          r: 1.6 + Math.random() * 2.6,
          solidStop: true
        });
      }
    }

    function hasExplosionLineOfSight(x1, y1, x2, y2, distance) {
      return hasLineOfSight(x1, y1, x2, y2, distance);
    }

    function hasLineOfSight(x1, y1, x2, y2, distance, options = {}) {
      const dx = (x2 - x1) / (distance || 1);
      const dy = (y2 - y1) / (distance || 1);
      for (const rect of explosionBlockers(options)) {
        const t = rayRect(x1, y1, dx, dy, rect);
        if (t !== null && t > 3 && t < distance - 8) return false;
      }
      return true;
    }

    function explosionBlockers(options = {}) {
      const blockers = walls.slice();
      for (const door of doors) {
        if (door.open >= 0.72) continue;
        for (const rect of doorCollisionRects(door)) blockers.push(rect);
      }
      for (const prop of props) {
        if (options.ignoreBarricades && prop.type === "barricade") continue;
        if (propBlocksMovement(prop)) blockers.push(propCollisionRect(prop));
      }
      return blockers;
    }

    function pointInsideSolid(x, y) {
      for (const rect of explosionBlockers()) {
        if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) return true;
      }
      return false;
    }

    function rayBlockDistance(x, y, dx, dy, maxDist) {
      let best = maxDist;
      for (const rect of explosionBlockers()) {
        const t = rayRect(x, y, dx, dy, rect);
        if (t !== null && t > 2 && t < best) best = Math.max(0, t - 2);
      }
      return best;
    }

    function visibilityPoints(x, y, radius, steps) {
      const points = [];
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2;
        const d = rayBlockDistance(x, y, Math.cos(a), Math.sin(a), radius);
        points.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d });
      }
      return points;
    }

    function updateIdleRaid(dt, playerMoved, acted) {
      if (!specialForcesEnabled) {
        idleRaidTimer = 0;
        idleRaidWarned = false;
        raidWarningActive = false;
        return;
      }
      idleRaidCooldown = Math.max(0, idleRaidCooldown - dt);
      const drift = Math.hypot(player.x - lastIdleX, player.y - lastIdleY);
      if (playerMoved < 1.2 && drift < 10 && !acted) {
        idleRaidTimer += dt;
      } else {
        idleRaidTimer = 0;
        idleRaidWarned = false;
        raidWarningActive = false;
        lastIdleX = player.x;
        lastIdleY = player.y;
      }
      if (idleRaidTimer >= 5 && !idleRaidWarned && idleRaidCooldown <= 0) {
        idleRaidWarned = true;
        raidWarningActive = true;
        raidAlarmTimer = 0;
        addScreenWarning("SPECIAL FORCES INBOUND - MOVE");
      }
      if (idleRaidTimer >= 10 && idleRaidCooldown <= 0) {
        if (spawnIdleRaid()) {
          idleRaidTimer = 0;
          idleRaidWarned = false;
          raidWarningActive = false;
          idleRaidCooldown = 22;
          lastIdleX = player.x;
          lastIdleY = player.y;
        }
      }
    }

    function updateRaidWarningEffects(dt) {
      if (!raidWarningActive) return;
      raidWarningPulse += dt * 8.5;
      raidAlarmTimer -= dt;
      if (raidAlarmTimer <= 0) {
        raidAlarmTimer = 0.58;
        playRaidAlarm();
      }
    }

    function spawnIdleRaid() {
      const spots = findRaidSpawnSpots();
      if (spots.length < 4) return false;
      const squad = [
        { kind: "shooter", leader: true, hold: 1.75, text: "MOVE", delay: 0 },
        { kind: "melee", hold: 0.55, text: "ROGER 1", delay: 0.52 },
        { kind: "shooter", hold: 0.95, text: "ROGER 2", delay: 0.92 },
        { kind: "flamer", hold: 1.35, text: "ROGER 3", delay: 1.32 }
      ];
      for (let i = 0; i < squad.length; i++) {
        const spec = squad[i];
        const fast = false;
        const r = spec.leader ? 27 : 24;
        const maxHp = spec.leader ? 105 + wave * 5 : enemyMaxHp(spec.kind, fast);
        const enemy = {
          x: spots[i].x,
          y: spots[i].y,
          r,
          collisionR: spec.leader ? 20 : 18,
          hp: maxHp,
          maxHp,
          speed: spec.leader ? 82 + wave * 2 : enemySpeed(spec.kind, fast) + 16,
          bite: 0,
          shoot: 0.35 + i * 0.15,
          kind: spec.kind,
          fast,
          alert: 8,
          lastSeenX: player.x,
          lastSeenY: player.y,
          wanderAngle: Math.random() * Math.PI * 2,
          wanderTimer: 0.4 + Math.random() * 0.8,
          wobble: Math.random() * 10,
          raidHold: spec.hold + 1.15,
          raidLeader: !!spec.leader,
          raidAggressive: true,
          raidBombThrown: false,
          dropTime: 1.15 + i * 0.08,
          dropMax: 1.15 + i * 0.08,
          dropHeight: 210 + i * 18
        };
        enemies.push(enemy);
        addSpeechBubble(enemy, spec.text, spec.delay + enemy.dropMax);
      }
      return true;
    }

    function findRaidSpawnSpots() {
      const spots = [];
      const baseAngles = [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
      for (const base of baseAngles) {
        const spot = findRaidSpotNearAngle(base, spots);
        if (spot) spots.push(spot);
      }
      if (spots.length >= 4) return spots;
      for (let i = 0; i < 40 && spots.length < 4; i++) {
        const spot = findRaidSpotNearAngle(Math.random() * Math.PI * 2, spots);
        if (spot) spots.push(spot);
      }
      return spots;
    }

    function findRaidSpotNearAngle(angle, existing) {
      for (let offset = 0; offset < 9; offset++) {
        const a = angle + (offset - 4) * 0.18;
        for (const radius of [230, 290, 360, 440, 520]) {
          const x = clamp(player.x + Math.cos(a) * radius, 80, world.w - 80);
          const y = clamp(player.y + Math.sin(a) * radius, 80, world.h - 80);
          const d = Math.hypot(x - player.x, y - player.y);
          if (d < 180) continue;
          if (hasLineOfSight(player.x, player.y, x, y, d)) continue;
          if (!isSpawnFree(x, y, 24)) continue;
          if (existing.some((spot) => dist2(spot.x, spot.y, x, y) < 90 * 90)) continue;
          return { x, y };
        }
      }
      return null;
    }

    function update(dt) {
      voiceCommandStatusTimer = Math.max(0, voiceCommandStatusTimer - dt);
      voiceCommandFlash = Math.max(0, voiceCommandFlash - dt);
      if (state === "intro") {
        if (!introStarted) return;
        introTimer += dt;
        if (!introSoundStarted) {
          introSoundStarted = true;
          playParkLogoSound();
        }
        if (introTimer >= 5) {
          state = "menu";
          gameOverTimer = 0;
        }
        return;
      }
      if (state === "maptool") {
        mapTool.statusTime = Math.max(0, mapTool.statusTime - dt);
        return;
      }
      if (state !== "play") {
        gameOverTimer += dt;
        return;
      }

      updateCoop(dt);
      shootCooldown -= dt;
      bombCooldown -= dt;
      if (rifleReload > 0) {
        rifleReload = Math.max(0, rifleReload - dt);
        if (rifleReload <= 0) rifleAmmo = 60;
      }
      spawnTimer -= dt;
      player.invuln -= dt;
      player.dodge -= dt;
      if (dashCharges <= 0 && dashRecharge > 0) {
        dashRecharge = Math.max(0, dashRecharge - dt);
        if (dashRecharge <= 0) dashCharges = 3;
      }
      updateRaidWarningEffects(dt);
      if (spawnTimer <= 0) {
        spawnTimer = Math.max(0.35, 1.25 - wave * 0.045);
        if (enemies.length < 18 + wave * 2) spawnEnemy();
      }
      wave = 1 + Math.floor(kills / 12);

      let mx = 0;
      let my = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) my--;
      if (keys.has("KeyS") || keys.has("ArrowDown")) my++;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) mx--;
      if (keys.has("KeyD") || keys.has("ArrowRight")) mx++;
      if (isMobile) {
        mx += mobileControls.moveX;
        my += mobileControls.moveY;
      }
      const mag = Math.hypot(mx, my) || 1;
      mx /= mag;
      my /= mag;

      const sprint = keys.has("ShiftLeft") || keys.has("ShiftRight");
      let speed = sprint && player.stamina > 0 ? 285 : 190;
      if (sprint && (mx || my)) player.stamina = Math.max(0, player.stamina - dt * 35);
      else player.stamina = Math.min(100, player.stamina + dt * 22);
      const wantsDash = keys.has("Space") || (isMobile && mobileControls.dodge);
      if (wantsDash && dashCharges > 0 && player.dodge <= 0 && (mx || my)) {
        player.dodge = 0.22;
        player.invuln = 0.28;
        addDashBurst(player.x, player.y, Math.atan2(my, mx));
        dashCharges = Math.max(0, dashCharges - 1);
        if (dashCharges <= 0) dashRecharge = 5;
      }
      if (isMobile && mobileControls.dodge) mobileControls.dodge = false;
      if (player.dodge > 0) speed = 520;

      const beforePlayerX = player.x;
      const beforePlayerY = player.y;
      moveCircle(player, mx * speed * dt, my * speed * dt);
      player.moveX = mx;
      player.moveY = my;
      player.isMoving = Math.hypot(player.x - beforePlayerX, player.y - beforePlayerY) > 0.35;
      updateDoors(dt);
      updateIdleRaid(dt, Math.hypot(player.x - beforePlayerX, player.y - beforePlayerY), mouse.down || mouse.right || keys.has("KeyQ"));

      const worldMouse = screenToWorld(mouse.x, mouse.y);
      let aimTarget = currentAimTarget(worldMouse);
      player.angle = Math.atan2(aimTarget.y - player.y, aimTarget.x - player.x);
      updateCamera(dt, isMobile ? aimTarget : worldMouse);
      if (isMobile) {
        aimTarget = mobileAimWorldTarget();
        player.angle = Math.atan2(aimTarget.y - player.y, aimTarget.x - player.x);
      }
      updateAimRay(aimTarget);
      if (mouse.down || (isMobile && mobileControls.shoot && selectedWeapon !== "ice")) fire();
      if (mouse.right || keys.has("KeyQ")) throwBomb(aimTarget);

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        if (b.life <= 0 || b.x < 0 || b.x > world.w || b.y < 0 || b.y > world.h) bullets.splice(i, 1);
      }
      for (let i = bombs.length - 1; i >= 0; i--) {
        const b = bombs[i];
        b.life -= dt;
        const t = 1 - Math.max(0, b.life / b.maxLife);
        const ease = 1 - Math.pow(1 - t, 2);
        b.x = b.sx + (b.tx - b.sx) * ease;
        b.y = b.sy + (b.ty - b.sy) * ease;
        if (b.life <= 0) {
          explodeBomb(b);
          bombs.splice(i, 1);
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.wobble += dt * 8;
        if (e.dropTime > 0) {
          e.dropTime -= dt;
          continue;
        }
        if (e.hp <= 0) {
          killEnemy(e, i);
          continue;
        }
        if (e.raidHold > 0) {
          e.raidHold -= dt;
          continue;
        }
        if (e.freeze > 0) {
          const beforeFreeze = e.freeze;
          e.freeze = Math.max(0, e.freeze - dt);
          if (beforeFreeze > 0 && e.freeze <= 0) burst(e.x, e.y, "#d8f6ff", 18);
          e.shoot = Math.max(e.shoot, 0.25);
          e.bite = Math.max(e.bite, 0.25);
          continue;
        }
        e.barricadeHit = Math.max(0, (e.barricadeHit || 0) - dt);
        if (e.raidLeader && !e.raidBombThrown) {
          throwEnemyBomb(e, { x: player.x, y: player.y });
          e.raidBombThrown = true;
        }
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.hypot(dx, dy) || 1;
        const seesPlayer = e.raidAggressive || (d < 720 && hasLineOfSight(e.x, e.y, player.x, player.y, d));
        if (seesPlayer) {
          e.alert = 5.5;
          e.lastSeenX = player.x;
          e.lastSeenY = player.y;
        } else {
          e.alert = Math.max(0, (e.alert || 0) - dt);
        }
        if (!e.raidAggressive && !seesPlayer && e.alert <= 0) {
          updateEnemyPatrol(e, dt);
          continue;
        }
        const contact = e.r + player.r + 8;
        const orbitDamping = clamp((d - contact) / 160, 0, 1);
        const sway = Math.sin(e.wobble) * 0.16 * orbitDamping;
        const preferred = e.kind === "shooter" ? 300 : (e.kind === "flamer" ? 230 : contact);
        const keepsRange = e.kind === "shooter" || e.kind === "flamer";
        const targetX = seesPlayer ? player.x : e.lastSeenX;
        const targetY = seesPlayer ? player.y : e.lastSeenY;
        const raidPathTarget = e.raidAggressive && !hasLineOfSight(e.x, e.y, player.x, player.y, d) ? raidMoveTarget(e) : null;
        const actualTargetX = raidPathTarget ? raidPathTarget.x : targetX;
        const actualTargetY = raidPathTarget ? raidPathTarget.y : targetY;
        const tdx = actualTargetX - e.x;
        const tdy = actualTargetY - e.y;
        const td = Math.hypot(tdx, tdy) || 1;
        const advance = seesPlayer && keepsRange && d < preferred ? -0.55 : (td > preferred || !seesPlayer ? 1 : 0.18);
        const desiredX = tdx / td * advance + -tdy / td * sway;
        const desiredY = tdy / td * advance + tdx / td * sway;
        moveEnemySmart(e, desiredX, desiredY, tdx / td, tdy / td, td, dt);
        if (!seesPlayer && td < 42) e.alert = Math.min(e.alert, 0.7);
        e.bite -= dt;
        e.shoot -= dt;
        const hasShotLine = d < 720 && hasLineOfSight(e.x, e.y, player.x, player.y, d, { ignoreBarricades: true });
        if (e.kind === "shooter" && e.shoot <= 0 && d < 620 && hasShotLine) {
          enemyFire(e, dx / d, dy / d);
          e.shoot = e.fast ? 1.25 + Math.random() * 0.8 : 1.65 + Math.random() * 1.1;
        } else if (e.kind === "flamer" && e.shoot <= 0 && d > 72 && d < 285 && hasShotLine) {
          enemyFlame(e, dx / d, dy / d);
          e.shoot = e.fast ? 0.85 + Math.random() * 0.35 : 1.05 + Math.random() * 0.5;
        }

        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (dist2(e.x, e.y, b.x, b.y) < (e.r + b.r) * (e.r + b.r)) {
            e.hp -= 34;
            bullets.splice(j, 1);
            burst(b.x, b.y, "#c8e7a0", 8);
            break;
          }
        }

        if (e.kind === "melee" && e.barricadeHit <= 0) {
          const barricadeHit = findTouchedBarricade(e, dx / d, dy / d);
          if (barricadeHit) {
            e.barricadeHit = e.fast ? 0.28 : 0.36;
            e.bite = Math.max(e.bite, 0.14);
            damageBarricade(barricadeHit.prop, e.fast ? 1 : 2, barricadeHit.x, barricadeHit.y);
            continue;
          }
        }

        if (d < collisionRadius(e) + collisionRadius(player) + 12 && e.bite <= 0 && player.invuln <= 0) {
          e.bite = 0.55;
          player.hp -= e.fast ? 9 : 14;
          player.invuln = 0.18;
          burst(player.x, player.y, "#9a1d18", 10);
          shake = Math.max(shake, 10);
          if (player.hp <= 0) {
            player.hp = 0;
            state = "dead";
            gameOverTimer = 0;
          }
        }

        if (e.hp <= 0) killEnemy(e, i);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.vx *= Math.pow(0.04, dt);
        p.vy *= Math.pow(0.04, dt);
        if (p.solidStop && pointInsideSolid(p.x, p.y)) p.life = 0;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = dashBursts.length - 1; i >= 0; i--) {
        dashBursts[i].life -= dt;
        if (dashBursts[i].life <= 0) dashBursts.splice(i, 1);
      }
      for (const prop of props) {
        if (prop.hitFlash > 0) prop.hitFlash = Math.max(0, prop.hitFlash - dt);
        if (prop.type === "barricade" && prop.buildTime > 0) prop.buildTime = Math.max(0, prop.buildTime - dt);
      }
      updatePickups(dt);
      updateSpeechBubbles(dt);
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].life -= dt;
        if (flashes[i].life <= 0) flashes.splice(i, 1);
      }
      for (let i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        if (tracers[i].life <= 0) tracers.splice(i, 1);
      }
      for (let i = enemyTracers.length - 1; i >= 0; i--) {
        enemyTracers[i].life -= dt;
        if (enemyTracers[i].life <= 0) enemyTracers.splice(i, 1);
      }
      for (let i = flameBursts.length - 1; i >= 0; i--) {
        flameBursts[i].life -= dt;
        if (flameBursts[i].life <= 0) flameBursts.splice(i, 1);
      }
      for (let i = iceStorms.length - 1; i >= 0; i--) {
        iceStorms[i].life -= dt;
        if (iceStorms[i].life <= 0) iceStorms.splice(i, 1);
      }
      for (let i = killLights.length - 1; i >= 0; i--) {
        killLights[i].life -= dt;
        if (killLights[i].life <= 0) killLights.splice(i, 1);
      }
      for (let i = blastLights.length - 1; i >= 0; i--) {
        blastLights[i].life -= dt;
        if (blastLights[i].life <= 0) blastLights.splice(i, 1);
      }
      for (let i = fizzles.length - 1; i >= 0; i--) {
        fizzles[i].life -= dt;
        if (fizzles[i].life <= 0) fizzles.splice(i, 1);
      }
      for (let i = deathTexts.length - 1; i >= 0; i--) {
        deathTexts[i].life -= dt;
        if (deathTexts[i].life <= 0) deathTexts.splice(i, 1);
      }
      fixtureBoost = Math.max(0, fixtureBoost - dt * 2.2);
      shake = Math.max(0, shake - dt * 30);
    }

    function enemyFire(enemy, dx, dy) {
      playSfx("enemyGun", enemy.fast ? 1.08 : 0.86);
      const sx = enemy.x + dx * (enemy.r + 16);
      const sy = enemy.y + dy * (enemy.r + 16);
      const target = raycastEnemyShot(sx, sy, dx, dy, Math.hypot(player.x - sx, player.y - sy));
      const px = target.x;
      const py = target.y;
      enemyTracers.push({
        x1: sx,
        y1: sy,
        x2: px,
        y2: py,
        life: 0.12,
        maxLife: 0.12
      });
      if (target.prop && target.prop.type === "barricade") {
        damageBarricade(target.prop, 1, target.x, target.y);
        return;
      }
      if (player.invuln <= 0) {
        player.hp -= enemy.fast ? 5 : 8;
        player.invuln = 0.08;
        burst(player.x, player.y, "#8f201d", 4);
        if (player.hp <= 0) {
          player.hp = 0;
          state = "dead";
          gameOverTimer = 0;
        }
      }
    }

    function startIntroSequence() {
      if (introStarted) return;
      introStarted = true;
      introTimer = 0;
      introSoundStarted = false;
      playParkLogoSound();
      introSoundStarted = true;
    }

    function enemyFlame(enemy, dx, dy) {
      playSfx("flamer", 1.45);
      const sx = enemy.x + dx * (enemy.r + 17);
      const sy = enemy.y + dy * (enemy.r + 17);
      flameBursts.push({
        x: sx,
        y: sy,
        angle: Math.atan2(dy, dx),
        length: enemy.fast ? 188 : 210,
        spread: enemy.fast ? 0.36 : 0.42,
        life: 0.24,
        maxLife: 0.24
      });
      flashes.push({
        x: sx + dx * 18,
        y: sy + dy * 18,
        angle: Math.atan2(dy, dx),
        life: 0.08,
        maxLife: 0.08
      });
      damageBarricadesInCone(sx, sy, dx, dy, enemy.fast ? 188 : 210, enemy.fast ? 34 : 40, 0.18, enemy.fast ? 1 : 2);
      const barrierHit = raycastEnemyShot(sx, sy, dx, dy, Math.hypot(player.x - sx, player.y - sy));
      if (barrierHit.prop && barrierHit.prop.type === "barricade") {
        return;
      }
      if (player.invuln <= 0) {
        player.hp -= enemy.fast ? 8 : 12;
        player.invuln = 0.14;
        burst(player.x, player.y, "#e46a32", 7);
        shake = Math.max(shake, 5);
        if (player.hp <= 0) {
          player.hp = 0;
          state = "dead";
          gameOverTimer = 0;
        }
      }
    }

    function killEnemy(enemy, index) {
      burst(enemy.x, enemy.y, "#75a64b", 16);
      addCorpse(enemy);
      maybeDropLoot(enemy);
      addKillLight(enemy.x, enemy.y);
      enemies.splice(index, 1);
      kills++;
    }

    function maybeDropLoot(enemy) {
      if (!itemDropMode) return;
      const candidates = [{ type: "heal", weight: 0.28, x: enemy.x, y: enemy.y }];
      candidates.push({ type: "bomb", weight: 0.22, x: enemy.x, y: enemy.y });
      if (enemy.kind === "flamer") candidates.push({ type: "flamer", weight: 0.36, x: enemy.x + 16, y: enemy.y });
      if (enemy.kind === "melee") candidates.push({ type: "ice", weight: 0.34, x: enemy.x - 16, y: enemy.y });
      const total = candidates.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random();
      if (roll > total) return;
      for (const item of candidates) {
        roll -= item.weight;
        if (roll <= 0) {
          addPickup(item.x, item.y, item.type);
          return;
