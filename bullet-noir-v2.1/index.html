        const energy = f.energy * (1 + boost * 2.4);
        const radius = f.radius * (1 + boost * 0.42) * z;
        if (x < -radius || y < -radius || x > width + radius || y > height + radius) continue;
        drawRadialLight(target, x, y, 12 * z, radius, energy);
        drawSoftRectLight(target, x, y, f.angle, f.w * 1.35 * z, radius * 0.7, energy * 0.48);
      }
    }

    function drawKillLights(target) {
      for (const k of killLights) {
        const age = 1 - k.life / k.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = k.radius * (0.62 + age * 0.55);
        const energy = 1.75 * pulse;
        drawRadialLight(target, screenX(k.x), screenY(k.y), 18 * camera.zoom, radius * camera.zoom, energy);
        drawRadialLight(target, screenX(k.x), screenY(k.y), 4 * camera.zoom, radius * 0.42 * camera.zoom, energy * 1.15);
      }
    }

    function drawBlastLights(target) {
      for (const b of blastLights) {
        const age = 1 - b.life / b.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = b.radius * (0.72 + age * 0.35);
        const energy = 1.8 * pulse;
        drawOccludedRadialLight(target, b.x, b.y, radius, energy);
      }
    }

    function drawOccludedRadialLight(target, x, y, radius, energy) {
      const points = visibilityPoints(x, y, radius, 96);
      if (!points.length) return;
      target.save();
      target.beginPath();
      target.moveTo(screenX(points[0].x), screenY(points[0].y));
      for (let i = 1; i < points.length; i++) {
        target.lineTo(screenX(points[i].x), screenY(points[i].y));
      }
      target.closePath();
      target.clip();
      drawRadialLight(target, screenX(x), screenY(y), 10 * camera.zoom, radius * camera.zoom, energy);
      drawRadialLight(target, screenX(x), screenY(y), 3 * camera.zoom, radius * 0.38 * camera.zoom, energy * 1.1);
      target.restore();
    }

    function drawVisibleKillBloom() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const k of killLights) {
        const age = 1 - k.life / k.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const x = screenX(k.x);
        const y = screenY(k.y);
        const radius = k.radius * (0.45 + age * 0.55) * camera.zoom;
        const gradient = ctx.createRadialGradient(x, y, 6, x, y, radius);
        gradient.addColorStop(0, "rgba(255,255,255," + (0.72 * pulse) + ")");
        gradient.addColorStop(0.18, "rgba(255,232,215," + (0.42 * pulse) + ")");
        gradient.addColorStop(0.55, "rgba(255,180,145," + (0.16 * pulse) + ")");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawVisibleBlastBloom() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const b of blastLights) {
        const age = 1 - b.life / b.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = b.radius * (0.58 + age * 0.28);
        const points = visibilityPoints(b.x, b.y, radius, 80);
        if (!points.length) continue;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(screenX(points[0].x), screenY(points[0].y));
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(screenX(points[i].x), screenY(points[i].y));
        }
        ctx.closePath();
        ctx.clip();
        const x = screenX(b.x);
        const y = screenY(b.y);
        const sr = radius * camera.zoom;
        const gradient = ctx.createRadialGradient(x, y, 5 * camera.zoom, x, y, sr);
        gradient.addColorStop(0, "rgba(255,250,230," + (0.78 * pulse) + ")");
        gradient.addColorStop(0.24, "rgba(255,194,130," + (0.34 * pulse) + ")");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, sr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawVisibleFizzles() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const f of fizzles) {
        const remain = Math.max(0, f.life / f.maxLife);
        const age = 1 - remain;
        const x = screenX(f.x);
        const y = screenY(f.y);
        const z = camera.zoom;

        const flash = Math.max(0, 1 - age * 9);
        const smoke = Math.sin(Math.min(1, age) * Math.PI) * remain;
        const flashGradient = ctx.createRadialGradient(x, y, 2 * z, x, y, 30 * z);
        flashGradient.addColorStop(0, "rgba(255,235,185," + (0.72 * flash) + ")");
        flashGradient.addColorStop(0.22, "rgba(255,150,80," + (0.34 * flash) + ")");
        flashGradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = flashGradient;
        ctx.beginPath();
        ctx.arc(x, y, 30 * z, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = "rgba(180, 178, 170," + (0.36 * smoke) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, (8 + age * 14) * z, f.angle, f.angle + Math.PI * 1.25);
        ctx.stroke();
        ctx.strokeStyle = "rgba(40, 38, 36," + (0.22 * smoke) + ")";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, (12 + age * 18) * z, f.angle + 1.4, f.angle + Math.PI * 1.9);
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(255,205,120," + (0.8 * remain) + ")";
        ctx.lineWidth = 1.6;
        for (let i = 0; i < 6; i++) {
          const a = f.angle + i * 0.72 + age * 5;
          const inner = (7 + age * 8) * z;
          const outer = (16 + i * 1.2 + age * 8) * z;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * inner, y + Math.sin(a) * inner);
          ctx.lineTo(x + Math.cos(a) * outer, y + Math.sin(a) * outer);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawSoftRectLight(target, x, y, angle, widthSize, length, energy) {
      target.save();
      target.translate(x, y);
      target.rotate(angle);
      const gradient = target.createRadialGradient(0, 0, 8, 0, 0, length);
      gradient.addColorStop(0, "rgba(0,0,0," + (0.56 * energy) + ")");
      gradient.addColorStop(0.28, "rgba(0,0,0," + (0.32 * energy) + ")");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      target.fillStyle = gradient;
      target.beginPath();
      target.ellipse(0, 0, widthSize, length * 0.62, 0, 0, Math.PI * 2);
      target.fill();
      target.restore();
    }

    function drawSoftConeLight(target, x, y, angle, length, halfAngle, energy) {
      for (let i = 0; i < 7; i++) {
        const t = i / 6;
        const spread = halfAngle * (0.35 + t * 0.95);
        const alpha = energy * (0.34 - t * 0.036);
        const len = length * (0.82 + t * 0.2);
        const end = { x: x + Math.cos(angle) * len, y: y + Math.sin(angle) * len };
        const left = { x: x + Math.cos(angle - spread) * len, y: y + Math.sin(angle - spread) * len };
        const right = { x: x + Math.cos(angle + spread) * len, y: y + Math.sin(angle + spread) * len };
        const gradient = target.createLinearGradient(x, y, end.x, end.y);
        gradient.addColorStop(0, "rgba(0,0,0," + alpha + ")");
        gradient.addColorStop(0.28, "rgba(0,0,0," + (alpha * 0.82) + ")");
        gradient.addColorStop(0.72, "rgba(0,0,0," + (alpha * 0.32) + ")");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        target.fillStyle = gradient;
        target.beginPath();
        target.moveTo(x, y);
        target.lineTo(left.x, left.y);
        target.quadraticCurveTo(end.x + Math.cos(angle) * 28, end.y + Math.sin(angle) * 28, right.x, right.y);
        target.closePath();
        target.fill();
      }
    }

    function drawRadialLight(target, x, y, inner, outer, energy) {
      const gradient = target.createRadialGradient(x, y, inner, x, y, outer);
      gradient.addColorStop(0, "rgba(0,0,0," + (0.92 * energy) + ")");
      gradient.addColorStop(0.24, "rgba(0,0,0," + (0.62 * energy) + ")");
      gradient.addColorStop(0.58, "rgba(0,0,0," + (0.22 * energy) + ")");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      target.fillStyle = gradient;
      target.beginPath();
      target.arc(x, y, outer, 0, Math.PI * 2);
      target.fill();
    }

    function drawVisibleFlashlightGlow(px, py, x, y, angle, energy) {
      const z = camera.zoom;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const body = ctx.createRadialGradient(px, py, 12 * z, px, py, 130 * z);
      body.addColorStop(0, "rgba(255,240,225," + (0.16 * energy) + ")");
      body.addColorStop(0.35, "rgba(205,220,235," + (0.07 * energy) + ")");
      body.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(px, py, 130 * z, 0, Math.PI * 2);
      ctx.fill();
      if (!assets.flashlight) {
        ctx.restore();
        return;
      }
      ctx.globalAlpha = 0.055 * energy;
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI / 2);
      const w = 1024 * 0.3 * z;
      ctx.drawImage(assets.flashlight, -w / 2, -w / 2, w, w);
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    function drawLightTexture(target, img, x, y, angle, w, h, alpha) {
      if (!img || alpha <= 0) return;
      target.save();
      target.globalAlpha = Math.max(0, Math.min(1, alpha));
      target.translate(x, y);
      target.rotate(angle);
      target.drawImage(img, -w / 2, -h / 2, w, h);
      target.restore();
      target.globalAlpha = 1;
    }

    async function coopSetLocalDescriptionSignal(description) {

    async function coopPackSignal(description) {
      const json = JSON.stringify(description);
      if (window.CompressionStream) {
        try {
          const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
          const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
          return "BN1." + coopBase64UrlEncode(bytes);
        } catch (err) {
          console.warn("Signal compression failed", err);
        }
      }
      return "BNR." + coopBase64UrlEncode(new TextEncoder().encode(json));
    }

    async function coopUnpackSignal(text) {
      const code = (text || "").trim();
      if (!code) throw new Error("Empty code");
      if (code.startsWith("{")) return JSON.parse(code);
      if (code.startsWith("BN1.")) {
        if (!window.DecompressionStream) throw new Error("Compressed code unsupported");
        const bytes = coopBase64UrlDecode(code.slice(4));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
      }
      if (code.startsWith("BNR.")) {
        return JSON.parse(new TextDecoder().decode(coopBase64UrlDecode(code.slice(4))));
      }
      throw new Error("Unknown code");
    }

    function coopBase64UrlEncode(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function coopBase64UrlDecode(text) {
      const normalized = text.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function coopCopyLocalSignal() {
      try {
        await navigator.clipboard.writeText(coopGetLocalSignal());
        setCoopStatus("COPIED");
      } catch {
        if (coopCopyTextFallback(coopGetLocalSignal())) setCoopStatus("COPIED");
        else setCoopStatus("COPY FAIL");
      }
    }

    function coopCopyTextFallback(text) {
      try {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "readonly");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        area.style.top = "0";
        document.body.appendChild(area);
        area.focus();
        area.select();
        const ok = document.execCommand && document.execCommand("copy");
        document.body.removeChild(area);
        return !!ok;
      } catch {
        return false;
      }
    }

    function coopToggleQr() {

    function updateCoopQr() {
      const canvasNode = document.getElementById("coop-qr-canvas");
      const note = document.getElementById("coop-qr-note");
      if (!canvasNode || !note) return;
      const signal = coopGetLocalSignal();
      if (!signal) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "먼저 offer/answer 생성";
        return;
      }
      if (signal.length > 2950) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "신호가 너무 길어 QR 대신 COPY 사용";
        return;
      }
      try {
        const qr = qrcode(0, "L");
        qr.addData(signal);
        qr.make();
        drawCoopQrCanvas(canvasNode, qr);
        note.textContent = "REAL QR READY - SCAN QR";
        return;
      } catch (err) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "QR FAIL - COPY SIGNAL";
        console.error(err);
        return;
      }
      note.textContent = "상대 폰으로 스캔 후 붙여넣기";
    }

    function clearCoopQrCanvas(canvasNode) {
      const qrCtx = canvasNode.getContext("2d");
      qrCtx.fillStyle = "#ffffff";
      qrCtx.fillRect(0, 0, canvasNode.width, canvasNode.height);
    }

    function drawCoopQrCanvas(canvasNode, qr) {
      const moduleCount = qr.getModuleCount();
      const quiet = 4;
      const total = moduleCount + quiet * 2;
      const size = Math.min(300, Math.max(240, Math.floor(window.innerWidth - 72)));
      const cell = Math.max(1, Math.floor(size / total));
      const drawn = cell * total;
      canvasNode.width = drawn;
      canvasNode.height = drawn;
      const qrCtx = canvasNode.getContext("2d");
      qrCtx.imageSmoothingEnabled = false;
      qrCtx.fillStyle = "#ffffff";
      qrCtx.fillRect(0, 0, drawn, drawn);
      qrCtx.fillStyle = "#000000";
      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          if (qr.isDark(row, col)) {
            qrCtx.fillRect((col + quiet) * cell, (row + quiet) * cell, cell, cell);
          }
        }
      }
    }

    function coopQrCanvasDataUrl() {
      const canvasNode = document.getElementById("coop-qr-canvas");
      return canvasNode ? canvasNode.toDataURL("image/png") : "";
    }

    async function coopCopyQrImage() {
      try {
        updateCoopQr();
        const dataUrl = coopQrCanvasDataUrl();
        if (!dataUrl) throw new Error("QR missing");
        const blob = await (await fetch(dataUrl)).blob();
        if (!navigator.clipboard || !window.ClipboardItem) throw new Error("Image clipboard unsupported");
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        setCoopStatus("QR COPIED");
      } catch (err) {
        const dataUrl = coopQrCanvasDataUrl();
        if (dataUrl && coopCopyTextFallback(dataUrl)) {
          setCoopStatus("QR DATA COPIED");
          return;
        }
        try {
          await navigator.clipboard.writeText(coopGetLocalSignal());
          setCoopStatus("QR COPY FAIL - SIGNAL COPIED");
        } catch {
          if (coopCopyTextFallback(coopGetLocalSignal())) setCoopStatus("QR COPY FAIL - SIGNAL COPIED");
          else setCoopStatus("QR COPY FAIL");
        }
      }
    }

    async function coopStartQrScan() {
      try {
        ensureCoopPanel();
        if (!window.isSecureContext && location.protocol !== "file:") {
          setCoopStatus("SCAN NEEDS HTTPS");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR !== "function") {
          setCoopStatus("SCAN UNSUPPORTED");
          return;
        }
        coopStopQrScan(false);
        const box = document.getElementById("coop-scan-box");
        const video = document.getElementById("coop-scan-video");
        box.style.display = "block";
        coopScanStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = coopScanStream;
        await video.play();
        setCoopStatus("SCANNING QR");
        coopScanFrame = requestAnimationFrame(coopScanTick);
      } catch (err) {
        setCoopStatus("SCAN FAIL");
        console.error(err);
        coopStopQrScan(false);
      }
    }

    function coopStopQrScan(updateStatus = true) {
      if (coopScanFrame) cancelAnimationFrame(coopScanFrame);
      coopScanFrame = 0;
      if (coopScanStream) {
        for (const track of coopScanStream.getTracks()) track.stop();
      }
      coopScanStream = null;
      const box = document.getElementById("coop-scan-box");
      const video = document.getElementById("coop-scan-video");
      if (video) video.srcObject = null;
      if (box) box.style.display = "none";
      if (updateStatus) setCoopStatus("SCAN STOPPED");
    }

    async function coopScanTick() {
      const video = document.getElementById("coop-scan-video");
      const canvasNode = document.getElementById("coop-scan-canvas");
      if (!video || !canvasNode || !coopScanStream) return;
      if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
        canvasNode.width = video.videoWidth;
        canvasNode.height = video.videoHeight;
        const scanCtx = canvasNode.getContext("2d", { willReadFrequently: true });
        scanCtx.drawImage(video, 0, 0, canvasNode.width, canvasNode.height);
        const image = scanCtx.getImageData(0, 0, canvasNode.width, canvasNode.height);
        const code = jsQR(image.data, image.width, image.height, { inversionAttempts: "dontInvert" });
        if (code && code.data) {
          await coopHandleScannedSignal(code.data);
          return;
        }
      }
      coopScanFrame = requestAnimationFrame(coopScanTick);
    }

    async function coopHandleScannedSignal(text) {
      coopStopQrScan(false);
      coopApplyRemoteSignal(text);
      try {
        const signal = await coopUnpackSignal(text);
        if (signal.type === "offer") {
          setCoopStatus("QR OFFER FOUND");
          await coopStartJoiner(text);
        } else if (signal.type === "answer") {
          setCoopStatus("QR ANSWER FOUND");
          await coopAcceptAnswer(text);
        } else {
          setCoopStatus("QR PASTED");
        }
      } catch (err) {
        setCoopStatus("QR INVALID");
        console.error(err);
      }
    }

    async function coopUseRemoteCode(text) {
      try {
        ensureCoopPanel();
        const code = (text || coopGetRemoteSignal()).trim();
        const signal = await coopUnpackSignal(code);
        coopApplyRemoteSignal(code);
        if (signal.type === "offer") {
          setCoopStatus("OFFER FOUND");
          await coopStartJoiner(code);
        } else if (signal.type === "answer") {
          setCoopStatus("ANSWER FOUND");
          await coopAcceptAnswer(code);
        } else {
          setCoopStatus("BAD CODE");
        }
      } catch (err) {
        setCoopStatus("BAD CODE");
        console.error(err);
      }
    }

    function coopCreatePeer() {
      if (!window.RTCPeerConnection) throw new Error("WebRTC unsupported");
      coopDisconnect(false);
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });
      coop.pc = pc;
      pc.onconnectionstatechange = () => {
        coop.connected = pc.connectionState === "connected";
        setCoopStatus(coop.connected ? "CONNECTED" : pc.connectionState.toUpperCase());
      };
      pc.ondatachannel = (event) => coopAttachChannel(event.channel);
      return pc;
    }

    function coopAttachChannel(channel) {
      coop.channel = channel;
      channel.onopen = () => {
        coop.connected = true;
        setCoopStatus("CONNECTED");
        coopSendNow();
      };
      channel.onclose = () => {
        coop.connected = false;
        setCoopStatus("CLOSED");
      };
      channel.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.t === "state") {
            coop.remote = {
              x: Number(data.x) || 0,
              y: Number(data.y) || 0,
              angle: Number(data.angle) || 0,
              hp: Math.max(0, Math.min(100, Number(data.hp) || 0)),
              weapon: data.weapon || "rifle",
              moving: !!data.moving,
              last: performance.now()
            };
          }
        } catch (err) {
          console.warn("Bad coop message", err);
        }
      };
    }

    async function coopWaitIce(pc) {
      if (pc.iceGatheringState === "complete") return;
      await new Promise((resolve) => {
        let settled = false;
        const done = () => {
          if (!settled && pc.iceGatheringState === "complete") {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            resolve();
          }
        };
        const candidateDone = (event) => {
          if (!settled && !event.candidate) {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            resolve();
          }
        };
        pc.addEventListener("icegatheringstatechange", done);
        pc.addEventListener("icecandidate", candidateDone);
        setTimeout(() => {
          if (!settled) {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            resolve();
          }
        }, 8000);
      });
    }

    async function coopStartHost() {
      try {
        ensureCoopPanel();
        setCoopStatus("HOSTING");
        const pc = coopCreatePeer();
        coop.role = "host";
        coopAttachChannel(pc.createDataChannel("sang-sub-coop"));
        await pc.setLocalDescription(await pc.createOffer());
        await coopWaitIce(pc);
        await coopSetLocalDescriptionSignal(pc.localDescription);
        setCoopStatus("SHARE HOST CODE");
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    async function coopStartJoiner(offerText) {
      try {
        ensureCoopPanel();
        setCoopStatus("JOINING");
        const pc = coopCreatePeer();
        coop.role = "guest";
        await pc.setRemoteDescription(await coopUnpackSignal(offerText || coopGetRemoteSignal()));
        await pc.setLocalDescription(await pc.createAnswer());
        await coopWaitIce(pc);
        await coopSetLocalDescriptionSignal(pc.localDescription);
        setCoopStatus("SEND GUEST CODE");
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    async function coopAcceptAnswer(answerText) {
      try {
        if (!coop.pc) throw new Error("Host peer missing");
        await coop.pc.setRemoteDescription(await coopUnpackSignal(answerText || coopGetRemoteSignal()));
        setCoopStatus("CONNECTING");
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    function coopDisconnect(updateStatus = true) {
      coopStopQrScan(false);
      if (coop.channel) coop.channel.close();
      if (coop.pc) coop.pc.close();
      coop.pc = null;
      coop.channel = null;
      coop.role = "";
      coop.remote = null;
      coop.connected = false;
      if (updateStatus) setCoopStatus("OFFLINE");
    }

    function coopSendNow() {
      if (!coop.channel || coop.channel.readyState !== "open") return false;
      coop.channel.send(JSON.stringify({
        t: "state",
        x: player.x,
        y: player.y,
        angle: player.angle,
        hp: player.hp,
        weapon: selectedWeapon,
        moving: player.isMoving
      }));
      return true;
    }

    function updateCoop(dt) {
      coopSendTimer -= dt;
      if (coopSendTimer <= 0) {
        coopSendTimer = 1 / 12;
        coopSendNow();
      }
      if (coop.remote && performance.now() - coop.remote.last > 3200) {
        coop.remote = null;
      }
    }

    function handleTouchStart(event) {
      if (!isMobile) return;
      event.preventDefault();
      ensureAudio();
      startVoiceCommands();
      updateTouchPositions(event);
      for (const touch of event.changedTouches) {
        const p = touchPoint(touch);
        if (state === "intro") {
          startIntroSequence();
          return;
        }
        if (state === "menu") {
          if (handleMenuClick(p.x, p.y)) return;
          startGame();
          return;
        }
        if (state === "dead") {
          startGame();
          return;
        }
        if (state === "maptool") {
          handleMapToolTouchStart(p);
          return;
        }
      if (state !== "play") continue;
      if (handleGameMenuButtonClick(p.x, p.y)) return;
      if (handleSpecialForcesToggleClick(p.x, p.y)) return;
      if (handleCoopButtonClick(p.x, p.y)) return;
      const action = mobileActionAt(p.x, p.y);
        if (action === "weapon") {
          mobileControls.weaponTouchId = touch.identifier;
          mobileControls.weaponTouchX = p.x;
          mobileControls.weaponTouchY = p.y;
          mobileControls.weaponDragX = 0;
          mobileControls.weaponReady = false;
        } else if (action === "dodge") {
          mobileControls.dodge = true;
        } else if (p.x < width * 0.46 && mobileControls.moveId === null) {
          mobileControls.moveId = touch.identifier;
          updateMobileStick(p.x, p.y);
        } else if (p.x > width * 0.54 && mobileControls.aimId === null) {
          mobileControls.aimId = touch.identifier;
          mobileControls.shoot = true;
          updateMobileAttackStick(p.x, p.y, true);
        }
      }
    }

    function handleTouchMove(event) {
      if (!isMobile) return;
      event.preventDefault();
      if (state === "maptool") {
        for (const touch of event.changedTouches) handleMapToolTouchMove(touchPoint(touch));
        return;
      }
      updateTouchPositions(event);
    }

    function handleTouchEnd(event) {
      if (!isMobile) return;
      event.preventDefault();
      if (state === "maptool") {
        for (const touch of event.changedTouches) handleMapToolTouchEnd(touchPoint(touch));
        return;
      }
      for (const touch of event.changedTouches) {
        if (touch.identifier === mobileControls.moveId) {
          mobileControls.moveId = null;
          mobileControls.moveX = 0;
          mobileControls.moveY = 0;
          mobileControls.knobX = 0;
          mobileControls.knobY = 0;
        }
        if (touch.identifier === mobileControls.aimId) {
          if (selectedWeapon === "bomb") throwBomb(mobileAimWorldTarget());
          if (selectedWeapon === "ice") fireIceStorm();
          if (selectedWeapon === "barricade") placeBarricadeFromAim();
          mobileControls.aimId = null;
        }
        if (touch.identifier === mobileControls.weaponTouchId) {
          const p = touchPoint(touch);
          mobileControls.weaponDragX = p.x - mobileControls.weaponTouchX;
          mobileControls.weaponReady = availableWeapons().length > 1 && mobileControls.weaponDragX <= -46;
          if (mobileControls.weaponReady) cycleWeapon();
          mobileControls.weaponTouchId = null;
          mobileControls.weaponTouchX = 0;
          mobileControls.weaponTouchY = 0;
          mobileControls.weaponDragX = 0;
          mobileControls.weaponReady = false;
        }
      }
      if (mobileControls.aimId === null) {
        mobileControls.shoot = false;
        mobileControls.aimKnobX = 0;
        mobileControls.aimKnobY = 0;
        mobileControls.aimTouchX = 0;
        mobileControls.aimTouchY = 0;
      }
    }

    function handleMapToolTouchStart(p) {
      mouse.x = p.x;
      mouse.y = p.y;
      updateMapToolPreview();
      handleMapToolMouseDown({ button: 0 });
    }

    function handleMapToolTouchMove(p) {
      mouse.x = p.x;
      mouse.y = p.y;

    function handleMapToolTouchEnd(p) {

      mouse.y = p.y;
      updateMapToolPreview();

    function updateTouchPositions(event) {
      for (const touch of event.touches) {
        const p = touchPoint(touch);
        if (touch.identifier === mobileControls.moveId) {
          updateMobileStick(p.x, p.y);
        } else if (touch.identifier === mobileControls.aimId) {
          updateMobileAttackStick(p.x, p.y, false);
        } else if (touch.identifier === mobileControls.weaponTouchId) {
          mobileControls.weaponDragX = p.x - mobileControls.weaponTouchX;
          mobileControls.weaponReady = availableWeapons().length > 1 && mobileControls.weaponDragX <= -46;
        }
      }
    }

    function touchPoint(touch) {
      const rect = canvas.getBoundingClientRect();
      return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
    }

    function updateMobileStick(x, y) {
      const stick = mobileButtonRects().stick;
      const dx = x - stick.x;
      const dy = y - stick.y;
      const d = Math.hypot(dx, dy) || 1;
      const limit = stick.r * 0.72;
      const amount = Math.min(1, d / limit);
      mobileControls.moveX = (dx / d) * amount;
      mobileControls.moveY = (dy / d) * amount;
      mobileControls.knobX = (dx / d) * Math.min(limit, d);
      mobileControls.knobY = (dy / d) * Math.min(limit, d);
    }

    function updateMobileAttackStick(x, y, force) {
      const hadTouch = mobileControls.aimTouchX || mobileControls.aimTouchY;
      const lastX = hadTouch ? mobileControls.aimTouchX : x;
      const lastY = hadTouch ? mobileControls.aimTouchY : y;
      const dragX = x - lastX;
      const dragY = y - lastY;
      if (!force && Math.hypot(dragX, dragY) < 2.5) return;
      const stick = mobileButtonRects().attack;
      const dx = x - stick.x;
      const dy = y - stick.y;
      const d = Math.hypot(dx, dy) || 1;
      const limit = stick.r * 0.72;
      const amount = Math.min(limit, d);
      const ax = (dx / d) * amount;
      const ay = (dy / d) * amount;
      mobileControls.aimKnobX = ax;
      mobileControls.aimKnobY = ay;
      const dirX = Math.abs(dx) + Math.abs(dy) < 8 ? Math.cos(player.angle || 0) : dx / d;
      const dirY = Math.abs(dx) + Math.abs(dy) < 8 ? Math.sin(player.angle || 0) : dy / d;
      const distance = Math.min(width, height) * 0.36;
      const px = screenX(player.x);
      const py = screenY(player.y);
      mobileControls.aimScreenX = clamp(px + dirX * distance, 18, width - 18);
      mobileControls.aimScreenY = clamp(py + dirY * distance, 18, height - 18);
      syncMobileAimWorld();
      mobileControls.aimTouchX = x;
      mobileControls.aimTouchY = y;
    }

    function mobileActionAt(x, y) {
      const rects = mobileButtonRects();
      for (const key of ["weapon", "dodge"]) {
        const rect = rects[key];
        if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) return key;
      }
      return null;
    }

    function updateMobileAim(mx, my) {
      if (mobileControls.aimId !== null) return;
      let nearest = null;
      let best = Infinity;
      for (const enemy of enemies) {
        const d = dist2(player.x, player.y, enemy.x, enemy.y);
        if (d < best && d < 560 * 560 && hasLineOfSight(player.x, player.y, enemy.x, enemy.y, Math.sqrt(d))) {
          best = d;
          nearest = enemy;
        }
      }
      if (nearest) {
        mobileControls.aimX = nearest.x;
        mobileControls.aimY = nearest.y;
        return;
      }
      if (Math.hypot(mx, my) > 0.1) {
        mobileControls.aimX = player.x + mx * 260;
        mobileControls.aimY = player.y + my * 260;
      } else {
        mobileControls.aimX = player.x + Math.cos(player.angle || 0) * 260;
        mobileControls.aimY = player.y + Math.sin(player.angle || 0) * 260;
      }
    }

    function fitMapToolCamera() {
      const zoom = Math.min(width / world.w, (height - 92) / world.h) * 0.94;
      camera.zoom = clamp(zoom, 0.18, 0.5);
      camera.x = world.w / 2 - width / camera.zoom / 2;
      camera.y = world.h / 2 - height / camera.zoom / 2 + 120;
    }

    function mapToolButtons() {
      const labels = [
        ["wall", "WALL"],
        ["doorH", "DOOR H"],
        ["doorV", "DOOR V"],
        ["fixture", "LIGHT"],
        ["crate", "BOX"],
        ["rock", "ROCK"],
        ["erase", "ERASE"],
        ["save", "SAVE"],
        // Static GitHub Pages builds cannot send email directly, so keep this disabled.
        // ["email", "EMAIL"],
        ["play", "PLAY"],
        ["reset", "RESET"],
        ["menu", "MENU"]
      ];
      const buttons = [];
      let x = 12;
      let y = 12;
      for (const [id, label] of labels) {
        const w = id === "fixture" || id === "doorH" || id === "doorV" ? 66 : 56;
        if (x + w > width - 12) {
          x = 12;
          y += 40;
        }
        buttons.push({ id, label, x, y, w, h: 32 });
        x += w + 8;
      }
      return buttons;
    }

    function drawMapTool() {
      fitMapToolCamera();
      ctx.save();
      ctx.fillStyle = "#111419";
      ctx.fillRect(0, 0, width, height);
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);
      drawGround();
      drawEditorGrid();
      drawFacility();
      drawProps();
      drawFixtureBodies();
      drawMapToolPreview();
      ctx.restore();
      drawMapToolUi();
    }

    function drawEditorGrid() {
      ctx.save();
      ctx.strokeStyle = "rgba(255,255,255,0.045)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= world.w; x += mapTool.grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, world.h);
        ctx.stroke();
      }
      for (let y = 0; y <= world.h; y += mapTool.grid) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(world.w, y);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawMapToolUi() {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.62)";
      ctx.fillRect(0, 0, width, 90);
      for (const button of mapToolButtons()) {
        const active = mapTool.tool === button.id;
        drawMenuButton(button, button.label, active);
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.font = "700 12px Arial";
      ctx.fillStyle = "#d7dddf";
      const saved = loadSavedMap() ? "CUSTOM MAP ACTIVE" : "DEFAULT MAP";
      ctx.fillText(saved + "  |  " + mapTool.status, 14, 74);
      ctx.restore();
    }

    function drawMapToolPreview() {
      const preview = mapTool.preview;
      if (!preview) return;
      ctx.save();
      ctx.globalAlpha = 0.62;
      ctx.fillStyle = preview.type === "fixture" ? "#fff0bd" : (preview.type === "door" ? "#86d7ff" : "#dbe2ea");
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      if (preview.type === "prop") {
        ctx.translate(preview.x, preview.y);
        ctx.rotate(preview.a || 0);
        drawCrateFallback(48 * preview.s);
      } else {
        ctx.fillRect(preview.x, preview.y, preview.w, preview.h);
        ctx.strokeRect(preview.x, preview.y, preview.w, preview.h);
      }
      ctx.restore();
    }

    function handleMapToolKey(event) {
      if (event.code === "Escape") {
        state = "menu";
        return;
      }
      if (event.code === "Enter") {
        saveCurrentMap();
        startGame();
        return;
      }
      const map = {
        Digit1: "wall",
        Digit2: "doorH",
        Digit3: "doorV",
        Digit4: "fixture",
        Digit5: "crate",
        Digit6: "rock",
        Backspace: "erase",
        Delete: "erase"
      };
      if (map[event.code]) mapTool.tool = map[event.code];
    }

    function handleMapToolMouseDown(event) {
      if (handleMapToolButtonClick(mouse.x, mouse.y)) return;
      const worldPoint = screenToWorld(mouse.x, mouse.y);
      const p = mapTool.tool === "doorH" || mapTool.tool === "doorV" ? worldPoint : snapPoint(worldPoint);
      if (event.button === 2 || mapTool.tool === "erase") {
        eraseMapItemAt(snapPoint(worldPoint));
        return;
      }
      if (mapTool.tool === "wall") {
        mapTool.dragStart = p;
        mapTool.preview = rectFromPoints(p, p);
        return;
      }
      placeMapToolItem(p);
    }

    function handleMapToolMouseUp() {
      if (mapTool.tool === "wall" && mapTool.dragStart && mapTool.preview) {
        const rect = normalizeEditorRect(mapTool.preview);
        if (rect.w >= mapTool.grid && rect.h >= mapTool.grid) {
          walls.push(rect);
          mapTool.status = "Wall placed.";
          mapTool.statusTime = 1.4;
        }
      }
      mapTool.dragStart = null;
      mapTool.preview = null;
    }

    function updateMapToolPreview() {
      if (state !== "maptool") return;
      const worldPoint = screenToWorld(mouse.x, mouse.y);
      const p = mapTool.tool === "doorH" || mapTool.tool === "doorV" ? worldPoint : snapPoint(worldPoint);
      if (mapTool.tool === "wall" && mapTool.dragStart) {
        mapTool.preview = rectFromPoints(mapTool.dragStart, p);
        return;
      }
      mapTool.preview = previewForTool(p);
    }

    function handleMapToolButtonClick(x, y) {
      for (const button of mapToolButtons()) {
        if (x < button.x || x > button.x + button.w || y < button.y || y > button.y + button.h) continue;
        if (button.id === "save") {
          if (saveCurrentMap()) state = "menu";
        } else if (button.id === "play") {
          saveCurrentMap();
          startGame();
        } else if (button.id === "reset") {
          clearSavedMap();
        } else if (button.id === "menu") {
          state = "menu";
        } else {
          mapTool.tool = button.id;
          mapTool.status = button.label + " selected.";
          mapTool.statusTime = 1.2;
        }
        return true;
      }
      return false;
    }

    function placeMapToolItem(p) {
      const item = previewForTool(p);
      if (!item) return;
      if (item.type === "door") {
        if (item.wallIndex === undefined) {
          mapTool.status = "Place doors directly on a matching wall.";
          mapTool.statusTime = 2;
          return;
        }
        if (doorTouchesBlockedCorner(item)) {
          mapTool.status = "Door rejected: blocked corner.";
          mapTool.statusTime = 2;
          return;
        }
        carveWallForDoor(item);
        doors.push({ x: item.x, y: item.y, w: item.w, h: item.h, axis: item.axis, open: 0, target: 0, range: 34 });
      } else if (item.type === "fixture") {
        fixtures.push(item);
      } else if (item.type === "prop") {
        const prop = { x: item.x, y: item.y, type: item.propType, s: item.s, a: item.a };
        ensurePropHealth(prop);
        props.push(prop);
      }
      mapTool.status = "Item placed.";
      mapTool.statusTime = 1.4;
    }

    function previewForTool(p) {
      const g = mapTool.grid;
      if (mapTool.tool === "doorH") return doorPlacementFromWall(p, "h");
      if (mapTool.tool === "doorV") return doorPlacementFromWall(p, "v");
      if (mapTool.tool === "fixture") return { type: "fixture", x: p.x, y: p.y, w: 72, h: 12, angle: 0, radius: 180, energy: 1 };
      if (mapTool.tool === "crate") return { type: "prop", propType: "crate", x: p.x, y: p.y, s: 1, a: 0 };
      if (mapTool.tool === "rock") return { type: "prop", propType: "rock", x: p.x, y: p.y, s: 1, a: Math.PI * 0.15 };
      return null;
    }

    function doorPlacementFromWall(p, axis) {
      const horizontal = axis === "h";
      let best = null;
      let bestScore = Infinity;
      for (let i = 0; i < walls.length; i++) {
        const wall = walls[i];
        const wallHorizontal = wall.w >= wall.h;
        if (horizontal !== wallHorizontal) continue;
        const nearCross = horizontal
          ? p.y >= wall.y - 28 && p.y <= wall.y + wall.h + 28
          : p.x >= wall.x - 28 && p.x <= wall.x + wall.w + 28;
        const nearSpan = horizontal
          ? p.x >= wall.x - 24 && p.x <= wall.x + wall.w + 24
          : p.y >= wall.y - 24 && p.y <= wall.y + wall.h + 24;
        if (!nearCross || !nearSpan) continue;
        const score = horizontal ? Math.abs(p.y - (wall.y + wall.h / 2)) : Math.abs(p.x - (wall.x + wall.w / 2));
        if (score < bestScore) {
          bestScore = score;
          best = { wall, wallIndex: i };
        }
      }
      if (!best) {
        const g = mapTool.grid;
        return horizontal
          ? { type: "door", x: snap(p.x - g), y: snap(p.y - g / 2), w: g * 3, h: g, axis }
          : { type: "door", x: snap(p.x - g / 2), y: snap(p.y - g), w: g, h: g * 3, axis };
      }
      const wall = best.wall;
      if (horizontal) {
        const doorW = Math.min(150, Math.max(84, wall.w - 84));
        const x = clamp(p.x - doorW / 2, wall.x + 42, wall.x + wall.w - doorW - 42);
        return { type: "door", x: Math.round(x), y: wall.y, w: Math.round(doorW), h: wall.h, axis, wallIndex: best.wallIndex };
      }
      const doorH = Math.min(180, Math.max(84, wall.h - 84));
      const y = clamp(p.y - doorH / 2, wall.y + 42, wall.y + wall.h - doorH - 42);
      return { type: "door", x: wall.x, y: Math.round(y), w: wall.w, h: Math.round(doorH), axis, wallIndex: best.wallIndex };
    }

    function carveWallForDoor(door) {
      const wall = walls[door.wallIndex];
      if (!wall) return;
      const pieces = [];
      if (door.axis === "h") {
        const leftW = door.x - wall.x;
        const rightX = door.x + door.w;
        const rightW = wall.x + wall.w - rightX;
        if (leftW >= 24) pieces.push({ x: wall.x, y: wall.y, w: leftW, h: wall.h });
        if (rightW >= 24) pieces.push({ x: rightX, y: wall.y, w: rightW, h: wall.h });
      } else {
        const topH = door.y - wall.y;
        const bottomY = door.y + door.h;
        const bottomH = wall.y + wall.h - bottomY;
        if (topH >= 24) pieces.push({ x: wall.x, y: wall.y, w: wall.w, h: topH });
        if (bottomH >= 24) pieces.push({ x: wall.x, y: bottomY, w: wall.w, h: bottomH });
      }
      walls.splice(door.wallIndex, 1, ...pieces);
    }

    function snap(value) {
      return Math.round(value / mapTool.grid) * mapTool.grid;
    }

    function eraseMapItemAt(p) {
      const hitFixture = fixtures.findIndex((f) => Math.abs(f.x - p.x) < 40 && Math.abs(f.y - p.y) < 40);
      if (hitFixture >= 0) {
        fixtures.splice(hitFixture, 1);
        mapTool.status = "Light erased.";
        mapTool.statusTime = 1.4;
        return;
      }
      const hitProp = props.findIndex((prop) => Math.hypot(prop.x - p.x, prop.y - p.y) < 38);
      if (hitProp >= 0) {
        props.splice(hitProp, 1);
        mapTool.status = "Object erased.";
        mapTool.statusTime = 1.4;
        return;
      }
      const hitDoor = doors.findIndex((door) => p.x >= door.x - 8 && p.x <= door.x + door.w + 8 && p.y >= door.y - 8 && p.y <= door.y + door.h + 8);
      if (hitDoor >= 0) {
        doors.splice(hitDoor, 1);
        mapTool.status = "Door erased.";
        mapTool.statusTime = 1.4;
        return;
      }
      const hitWall = walls.findIndex((wall) => p.x >= wall.x - 8 && p.x <= wall.x + wall.w + 8 && p.y >= wall.y - 8 && p.y <= wall.y + wall.h + 8);
      if (hitWall >= 0) {
        walls.splice(hitWall, 1);
        mapTool.status = "Wall erased.";
        mapTool.statusTime = 1.4;
      }
    }

    function snapPoint(p) {
      const g = mapTool.grid;
      return {
        x: clamp(Math.round(p.x / g) * g, 0, world.w),
        y: clamp(Math.round(p.y / g) * g, 0, world.h)
      };
    }

    function rectFromPoints(a, b) {
      return { type: "wall", x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x) + mapTool.grid, h: Math.abs(a.y - b.y) + mapTool.grid };
    }

    function normalizeEditorRect(rect) {
      return { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
    }

    function roundRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    function bar(x, y, w, h, value, fill, back) {
      ctx.fillStyle = back;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = fill;
      ctx.fillRect(x, y, w * clamp(value, 0, 1), h);
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    }

    function drawImageCentered(img, x, y, w, h) {
      if (img) {
        const ratio = img.width / img.height;
        let dw = w;
        let dh = h;
        if (dw / dh > ratio) dw = dh * ratio;
        else dh = dw / ratio;
        ctx.drawImage(img, x - dw / 2, y - dh / 2, dw, dh);
      } else {
        ctx.fillStyle = "rgba(5, 6, 7, 0.96)";
        ctx.strokeStyle = "rgba(255,255,255,0.12)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.ellipse(x, y, Math.max(4, w * 0.34), Math.max(4, h * 0.42), 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }

    function drawImageStretched(img, x, y, w, h) {
      if (img) ctx.drawImage(img, x - w / 2, y - h / 2, w, h);
      else drawImageCentered(img, x, y, w, h);
    }

    function drawCover(img, x, y, w, h) {
      const s = Math.max(w / img.width, h / img.height);
      const iw = img.width * s;
      const ih = img.height * s;
      ctx.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
    }

    function screenToWorld(x, y) {
      return { x: x / camera.zoom + camera.x, y: y / camera.zoom + camera.y };
    }

    function screenX(x) {
      return (x - camera.x) * camera.zoom;
    }

    function screenY(y) {
      return (y - camera.y) * camera.zoom;
    }

    function screenSize(value) {
      return value * camera.zoom;
    }

    function smoothAngle(current, target, dt, speed) {
      const delta = Math.atan2(Math.sin(target - current), Math.cos(target - current));
      return current + delta * Math.min(1, dt * speed);
    }

    function dist2(ax, ay, bx, by) {
      const dx = ax - bx;
      const dy = ay - by;
      return dx * dx + dy * dy;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function runSelfTests() {

        explodeBomb({ x: 510, y: 610 });
        const bombOnWallFizzles = fizzles.length === 1 && blastLights.length === blastCountBeforeFizzle;
        const doorCountBeforeCorner = doors.length;
        addWall(700, 700, 220, 42);
        addDoor(760, 660, 42, 130, "v");
        const blockedCornerDoorRejected = doors.length === doorCountBeforeCorner;
        const spawnRejectsSolid = !isSpawnFree(510, 610, 24);
        const defaultCameraIsCam2 = cameraMode === 2;
        const closeDoorSensor = !isInDoorApproach({ x: 330, y: 830 }, doors[0]) && isInDoorApproach({ x: 414, y: 830 }, doors[0]);
        const losOpen = hasLineOfSight(300, 610, 450, 610, 150);
        const losBlocked = !hasLineOfSight(450, 610, 640, 610, 190);
        const meleeHasNoGun = true;
        const shooterHasGun = true;
        const flamerKindCanSpawn = ["melee", "shooter", "flamer"].includes(chooseEnemyKind(false));
        walls.push({ x: 84, y: 84, w: 42, h: 84 });
        doors.push({ x: 126, y: 84, w: 126, h: 42, axis: "h", open: 0, target: 0, range: 82 });
        fixtures.push({ x: 210, y: 210, w: 72, h: 12, angle: 0, radius: 180, energy: 1 });
        props.push({ x: 252, y: 252, type: "crate", s: 1, a: 0 });
        const mapData = serializeMapData();
        const mapToolSerializes = mapData.walls.length > 0 && mapData.doors.some((door) => door.axis === "h") && mapData.props.some((prop) => prop.type === "crate");
        walls.length = 0;
        doors.length = 0;
        fixtures.length = 0;
        props.length = 0;
        applyMapData(mapData);
        const mapToolApplies = walls.length === mapData.walls.length && doors.length === mapData.doors.length && fixtures.length === mapData.fixtures.length && props.length === mapData.props.length;
        walls.length = 0;
        doors.length = 0;
        walls.push({ x: 100, y: 300, w: 420, h: 42 });
        const placedDoor = doorPlacementFromWall({ x: 290, y: 316 }, "h");
        const doorSnapsToWall = placedDoor.y === 300 && placedDoor.h === 42 && placedDoor.wallIndex === 0;
        carveWallForDoor(placedDoor);
        const doorCarvesWall = walls.length === 2 && walls.every((wall) => !rectOverlap(wall, placedDoor));
        const smoothTurnMovesPartway = smoothAngle(0, Math.PI, 0.016, 18) > 0 && smoothAngle(0, Math.PI, 0.016, 18) < Math.PI;
        const savedPlayer = { x: player.x, y: player.y, collisionR: player.collisionR, hp: player.hp, invuln: player.invuln, state };
        walls.length = 0;
        doors.length = 0;
        props.length = 0;
        player.x = 500;
        player.y = 500;
        player.hp = 100;
        player.invuln = 0;
        state = "play";
        enemyFlame({ x: 360, y: 500, r: 24, fast: false }, 1, 0);
        const flamerDamagesVisiblePlayer = player.hp < 100 && flameBursts.length === 1;
        flameBursts.length = 0;
        player.hp = 60;
        pickups.push({ x: player.x, y: player.y, r: 17, type: "heal", life: 18, pulse: 0 });
        updatePickups(0.016);
        const potionHealsTwenty = player.hp === 80 && pickups.length === 0;
        walls.length = 0;
        doors.length = 0;
        props.length = 0;
        enemies.length = 0;
        player.x = 240;
        player.y = 100;
        const smartEnemy = { x: 60, y: 100, r: 24, collisionR: 18, speed: 100 };
        addWall(130, 40, 42, 150);
        moveEnemySmart(smartEnemy, 1, 0, 1, 0, 180, 0.2);
        const enemySteersAroundBlockedPath = Math.abs(smartEnemy.y - 100) > 4;
        const patrolEnemy = { x: 80, y: 80, r: 24, collisionR: 18, speed: 100, wanderAngle: 0, wanderTimer: 1, alert: 0 };
        const patrolBeforeDist = Math.hypot(patrolEnemy.x - player.x, patrolEnemy.y - player.y);
        updateEnemyPatrol(patrolEnemy, 0.2);
        const patrolDoesNotBeelinePlayer = Math.hypot(patrolEnemy.x - player.x, patrolEnemy.y - player.y) >= patrolBeforeDist - 8;
        walls.length = 0;
        enemies.length = 0;
        speechBubbles.length = 0;
        player.x = 500;
        player.y = 500;
        addWall(360, 0, 42, 1000);
        addWall(640, 0, 42, 1000);
        addWall(0, 360, 1000, 42);
        addWall(0, 640, 1000, 42);
        const raidSpawned = spawnIdleRaid();
        const raidHasLeaderAndThreeOrders = raidSpawned &&
          enemies.length === 4 &&
          enemies.some((enemy) => enemy.raidLeader) &&
          speechBubbles.map((bubble) => bubble.text).join("|") === "MOVE|ROGER 1|ROGER 2|ROGER 3" &&
          enemies.filter((enemy) => enemy.raidHold > 0).length === 4;
        const raidDropsByParachute = enemies.every((enemy) => enemy.dropTime > 0 && enemy.dropHeight > 0);
        const raidLeader = enemies.find((enemy) => enemy.raidLeader);
        bombs.length = 0;
        raidLeader.dropTime = 0;
        raidLeader.raidHold = 0;
        raidLeader.raidBombThrown = false;
        const leaderBombsBefore = bombs.length;
        throwEnemyBomb(raidLeader, { x: player.x, y: player.y });
        const raidLeaderThrowsHostileBomb = bombs.length === leaderBombsBefore + 1 && bombs[bombs.length - 1].hostile === true;
        const raidAggressivePrioritizesPlayer = enemies.filter((enemy) => enemy.raidAggressive).length === 4;
        speechBubbles.length = 0;
        specialForcesEnabled = false;
        idleRaidTimer = 9.9;
        idleRaidCooldown = 0;
        updateIdleRaid(0.2, 0, false);
        const specialForcesDefaultOff = enemies.length === 4 && speechBubbles.length === 0;
        specialForcesEnabled = true;
        idleRaidTimer = 4.9;
        idleRaidCooldown = 0;
        idleRaidWarned = false;
        lastIdleX = player.x;
        lastIdleY = player.y;
        updateIdleRaid(0.2, 0, false);
        const specialForcesWarnsBeforeRaid = speechBubbles.some((bubble) => bubble.screen && bubble.text.includes("SPECIAL FORCES"));
        const warningActivatesDangerOverlay = raidWarningActive === true;
        specialForcesEnabled = false;
        idleRaidTimer = 0;
        idleRaidWarned = false;
        raidWarningActive = false;
        walls.length = 0;
        enemies.length = 0;
        speechBubbles.length = 0;
        doors.length = 0;
        player.x = 420;
        player.y = 100;
        addWall(250, 0, 42, 250);
        addDoor(250, 250, 42, 120, "v");
        const doorRaidEnemy = { x: 90, y: 100, r: 24, collisionR: 18 };
        const doorWaypoint = raidMoveTarget(doorRaidEnemy);
        const raidFindsDoorWaypoint = doorWaypoint && doorWaypoint.x > doorRaidEnemy.x && doorWaypoint.x < player.x;
        walls.length = 0;
        doors.length = 0;
        props.length = 0;
        player.x = 760;
        player.y = 210;
        addWall(330, 0, 42, 360);
        addWall(330, 500, 42, 360);
        addDoor(330, 360, 42, 140, "v");
        addWall(560, 140, 42, 500);
        addDoor(560, 640, 42, 120, "v");
        props.push({ x: 260, y: 210, type: "crate", s: 1, a: 0 });
        const mazeRaidEnemy = { x: 130, y: 210, r: 24, collisionR: 18 };
        const mazeWaypoint = raidMoveTarget(mazeRaidEnemy);
        const raidPathfinderFindsReachableRoute = mazeWaypoint && !raidPathPassable(260, 210, 18) && mazeWaypoint.x !== 260;
        walls.length = 0;
        doors.length = 0;
        props.length = 0;
        addWall(100, 0, 42, 260);
        addWall(210, 150, 90, 42);
        player.x = 176;
        player.y = 130;
        moveCircle(player, 0, 46);
        const narrowCornerFloorPasses = player.y > 160;
        const mobileRects = mobileButtonRects();
        const mobileActionsClearAttackStick =
          !circleRect(mobileRects.attack.x, mobileRects.attack.y, mobileRects.attack.r + 8, mobileRects.weapon) &&
          !circleRect(mobileRects.attack.x, mobileRects.attack.y, mobileRects.attack.r + 8, mobileRects.dodge);
        selectedWeapon = "rifle";
        rifleAmmo = 1;
        rifleReload = 0;
        shootCooldown = 0;
        enemies.length = 0;
        fire();
        fire();
        const rifleReloadsAfterSixtyLikeEmpty = rifleReload > 0 && rifleAmmo === 0;
        bombCount = 1;
        selectedWeapon = "bomb";
        bombs.length = 0;
        bombCooldown = 0;
        throwBomb({ x: player.x + 140, y: player.y });
        const bombConsumesInventory = bombCount === 0 && selectedWeapon === "rifle" && bombs.length === 1;
        flameAmmo = 0;
        applyPickup("flamer", player.x, player.y);
        const flamerPickupAddsAmmo = selectedWeapon === "rifle" && flameAmmo === 120;
        iceAmmo = 0;
        applyPickup("ice", player.x, player.y);
        const icePickupAddsCharges = selectedWeapon === "rifle" && iceAmmo === 6;
        pickups.length = 0;
        const savedRandom = Math.random;
        Math.random = () => 0.01;
        maybeDropLoot({ x: player.x, y: player.y, kind: "flamer" });
        Math.random = savedRandom;
        const enemyDropsAtMostOneItem = pickups.length <= 1;
        walls.length = 0;
        doors.length = 0;
        props.length = 0;
        enemies.length = 0;
        enemies.push({ x: player.x + 120, y: player.y, r: 24, hp: 100, maxHp: 100, fast: false, kind: "melee", freeze: 0 });
        player.angle = 0;
        selectedWeapon = "ice";
        shootCooldown = 0;
        fireIceStorm();
        const iceStormFreezesEnemy = enemies[0].freeze > 4.5 && iceStorms.length === 1;
        selectedWeapon = "rifle";
        bombCount = 1;
        flameAmmo = 120;
        const weaponBeforeDrag = selectedWeapon;
        mobileControls.weaponTouchX = 300;
        mobileControls.weaponDragX = -30;
        mobileControls.weaponReady = availableWeapons().length > 1 && mobileControls.weaponDragX <= -46;
        const shortWeaponDragDoesNotSwitch = !mobileControls.weaponReady && selectedWeapon === weaponBeforeDrag;
        mobileControls.weaponDragX = -54;
        mobileControls.weaponReady = availableWeapons().length > 1 && mobileControls.weaponDragX <= -46;
        if (mobileControls.weaponReady) cycleWeapon();
        const longWeaponDragSwitchesOnRelease = selectedWeapon !== weaponBeforeDrag;
        state = "play";
        keys.add("Space");
        keys.add("KeyD");
        dashCharges = 3;
        dashRecharge = 0;
        player.dodge = 0;
        update(0.02);
        player.dodge = 0;
        update(0.24);
        player.dodge = 0;
        update(0.24);
        keys.delete("Space");
        keys.delete("KeyD");
        const dashThreeUsesStartsCooldown = dashCharges === 0 && dashRecharge > 0;
        update(5.1);
        const dashCooldownRefillsCharges = dashCharges === 3 && dashRecharge === 0;
        specialForcesEnabled = false;
        const mobileSpecialToggleWorks = handleSpecialForcesToggleClick(
          specialForcesToggleRect().x + 18,
          specialForcesToggleRect().y + 16
        ) && specialForcesEnabled === true;
        specialForcesEnabled = false;
        camera.zoom = 1;
        camera.x = 100;
        camera.y = 200;
        mobileControls.aimScreenX = 320;
        mobileControls.aimScreenY = 240;
        const mobileAimBeforeCameraMove = mobileAimWorldTarget();
        camera.x += 55;
        const mobileAimAfterCameraMove = mobileAimWorldTarget();
        const mobileAimCursorActsLikeMouse =
          Math.abs((mobileAimAfterCameraMove.x - mobileAimBeforeCameraMove.x) - 55) < 0.01 &&

        mobileControls.aimTouchY = 0;
        player.x = 500;
        player.y = 500;
        camera.x = 100;
        camera.y = 100;
        updateMobileAttackStick(1040, 570, true);
        const lockedAimX = mobileControls.aimScreenX;
        const lockedAimY = mobileControls.aimScreenY;
        player.x += 90;
        camera.x += 90;
        updateMobileAttackStick(1040, 570, false);
        const mobileAimUnaffectedByMoveStick =
          Math.abs(mobileControls.aimScreenX - lockedAimX) < 0.01 &&
          Math.abs(mobileControls.aimScreenY - lockedAimY) < 0.01;
        const attackStickForInstantAim = mobileButtonRects().attack;
        updateMobileAttackStick(attackStickForInstantAim.x, attackStickForInstantAim.y - attackStickForInstantAim.r, true);
        const topAimY = mobileControls.aimScreenY;
        updateMobileAttackStick(attackStickForInstantAim.x, attackStickForInstantAim.y + attackStickForInstantAim.r, false);
        const mobileAimJoystickRetargetsInstantly =
          mobileControls.aimScreenY > topAimY + Math.min(width, height) * 0.55;
        const draggedAimX = mobileControls.aimScreenX;
        const draggedAimY = mobileControls.aimScreenY;
        updateMobileStick(180, height - 150);
        const mobileMoveStickDoesNotMoveCursor =
          Math.abs(mobileControls.aimScreenX - draggedAimX) < 0.01 &&
          Math.abs(mobileControls.aimScreenY - draggedAimY) < 0.01;
        camera.x = 40;
        camera.y = 60;
        player.x = 620;
        player.y = 520;
        mobileControls.aimScreenX = 520;
        mobileControls.aimScreenY = 330;
        mobileControls.shoot = true;
        updateCamera(0.25, mobileAimWorldTarget());
        const retargetAfterCamera = mobileAimWorldTarget();
        const mobileAimRetargetsAfterCameraMove =
          Math.abs(screenX(retargetAfterCamera.x) - mobileControls.aimScreenX) < 0.01 &&
          Math.abs(screenY(retargetAfterCamera.y) - mobileControls.aimScreenY) < 0.01;
        mobileControls.shoot = false;
        const synthSfxFallbackAvailable = typeof playSynthSfx === "function";
        const logoSoundUsesWebAudio = typeof playParkLogoSound === "function";
        state = "intro";
        introTimer = 4.99;
        introStarted = true;
        introSoundStarted = true;
        update(0.02);
        const introCompletesToMenu = state === "menu";
        player.x = savedPlayer.x;
        player.y = savedPlayer.y;
        player.collisionR = savedPlayer.collisionR;
        player.hp = savedPlayer.hp;
        player.invuln = savedPlayer.invuln;
        state = savedPlayer.state;

        return {
          closedDoorBlocks,
          alignedApproachOpens,
          otherRoomDoesNotOpen,
          closedMoveBlocked,
          openMovePasses,
          splitRectsDoNotOverlap,
          holdZoneKeepsOpen,
          fullyOpenLeavesNoCollision,
          rayStopsAtWall,
          clearShotDoesNotFakeWall,
          corpsePersists,
          deathTextAppears,
          propBlocksMovement: crateBlocksMovement,
          blockingPropHasDrawable,
          decorativeRockDoesNotBlock,
          bombDamagesVisibleEnemy,
          bombBlockedByWall,
          bombOnWallFizzles,
          blockedCornerDoorRejected,
          spawnRejectsSolid,
          defaultCameraIsCam2,
          closeDoorSensor,
          losOpen,
          losBlocked,
          meleeHasNoGun,
          shooterHasGun,
          flamerKindCanSpawn,
          flamerDamagesVisiblePlayer,
          potionHealsTwenty,
          enemySteersAroundBlockedPath,
          patrolDoesNotBeelinePlayer,
          raidHasLeaderAndThreeOrders,
          raidDropsByParachute,
          raidLeaderThrowsHostileBomb,
          raidAggressivePrioritizesPlayer,
          specialForcesDefaultOff,
          specialForcesWarnsBeforeRaid,
          warningActivatesDangerOverlay,
          raidFindsDoorWaypoint,
          raidPathfinderFindsReachableRoute,
          mapToolSerializes,
          mapToolApplies,
          doorSnapsToWall,
          doorCarvesWall,
          smoothTurnMovesPartway,
          narrowCornerFloorPasses,
          mobileActionsClearAttackStick,
          rifleReloadsAfterSixtyLikeEmpty,
          bombConsumesInventory,
          flamerPickupAddsAmmo,
          icePickupAddsCharges,
          enemyDropsAtMostOneItem,
          iceStormFreezesEnemy,
          shortWeaponDragDoesNotSwitch,
          longWeaponDragSwitchesOnRelease,
          dashThreeUsesStartsCooldown,
          dashCooldownRefillsCharges,
          mobileSpecialToggleWorks,
          mobileAimCursorActsLikeMouse,
          mobileAimUnaffectedByMoveStick,
          mobileAimJoystickRetargetsInstantly,
          mobileMoveStickDoesNotMoveCursor,
          mobileAimRetargetsAfterCameraMove,
          synthSfxFallbackAvailable,
          logoSoundUsesWebAudio,
          introCompletesToMenu

      } finally {
        walls.length = 0;
        doors.length = 0;
        corpses.length = 0;
        deathTexts.length = 0;
        speechBubbles.length = 0;
        pickups.length = 0;
        props.length = 0;
        enemies.length = 0;
        bombs.length = 0;
        blastLights.length = 0;
        fizzles.length = 0;
        flameBursts.length = 0;
        for (const wall of savedWalls) walls.push(wall);
        for (const door of savedDoors) doors.push(door);
        for (const corpse of savedCorpses) corpses.push(corpse);
        for (const text of savedDeathTexts) deathTexts.push(text);
        for (const bubble of savedSpeechBubbles) speechBubbles.push(bubble);
        for (const pickup of savedPickups) pickups.push(pickup);
        for (const prop of savedProps) props.push(prop);
        for (const enemy of savedEnemies) enemies.push(enemy);
        for (const bomb of savedBombs) bombs.push(bomb);
        for (const light of savedBlastLights) blastLights.push(light);
        for (const fizzle of savedFizzles) fizzles.push(fizzle);
        for (const flame of savedFlameBursts) flameBursts.push(flame);
        for (const storm of savedIceStorms) iceStorms.push(storm);
        for (const dash of savedDashBursts) dashBursts.push(dash);
        state = savedState;
        introTimer = savedIntroTimer;
        introStarted = savedIntroStarted;
        introSoundStarted = savedIntroSoundStarted;
        camera.x = savedCamera.x;
        camera.y = savedCamera.y;
        camera.zoom = savedCamera.zoom;
        selectedWeapon = savedInventory.selectedWeapon;
        rifleAmmo = savedInventory.rifleAmmo;
        rifleReload = savedInventory.rifleReload;
        bombCount = savedInventory.bombCount;
        flameAmmo = savedInventory.flameAmmo;
        iceAmmo = savedInventory.iceAmmo;
        barricadeCount = savedInventory.barricadeCount;
        itemDropMode = savedInventory.itemDropMode;
        dashCharges = savedInventory.dashCharges;
        dashRecharge = savedInventory.dashRecharge;
        mobileControls.weaponTouchId = null;
        mobileControls.weaponDragX = 0;
        mobileControls.weaponReady = false;
        keys.delete("Space");
        keys.delete("KeyD");
      }
    }

    window.__ringedSelfTest = runSelfTests;

    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    resize();
    loadAssets().then(() => {
      if (new URLSearchParams(location.search).get("play") === "1") startGame();
      last = performance.now();
      requestAnimationFrame(loop);
    });
  </script>
