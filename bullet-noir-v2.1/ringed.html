    function updateCoopQr() {
      const canvasNode = document.getElementById("coop-qr-canvas");
      const note = document.getElementById("coop-qr-note");
      if (!canvasNode || !note) return;
      const signal = coopGetLocalSignal();
      if (!signal) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "Create a code first.";
        return;
      }
      if (signal.length > 2950) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "Code is too long for QR. Use copy.";
        return;
      }
      try {
        const qr = qrcode(0, signal.length < 1200 ? "M" : "L");
        qr.addData(signal);
        qr.make();
        drawCoopQrCanvas(canvasNode, qr);
        note.textContent = "REAL QR READY - SCAN QR";
        return;
      } catch (err) {
        clearCoopQrCanvas(canvasNode);
        note.textContent = "QR FAIL - COPY SIGNAL";
        console.error(err);
        return;
      }
      note.textContent = "Paste or scan a friend code.";
    }

    function clearCoopQrCanvas(canvasNode) {
      const qrCtx = canvasNode.getContext("2d");
      qrCtx.fillStyle = "#ffffff";
      qrCtx.fillRect(0, 0, canvasNode.width, canvasNode.height);
    }

    function drawCoopQrCanvas(canvasNode, qr) {
      const moduleCount = qr.getModuleCount();
      const quiet = 8;
      const total = moduleCount + quiet * 2;
      const size = Math.min(900, Math.max(640, Math.floor(window.innerWidth - 80)));
      const cell = Math.max(1, Math.floor(size / total));
      const drawn = cell * total;
      canvasNode.width = drawn;
      canvasNode.height = drawn;
      const qrCtx = canvasNode.getContext("2d");
      qrCtx.imageSmoothingEnabled = false;
      qrCtx.fillStyle = "#ffffff";
      qrCtx.fillRect(0, 0, drawn, drawn);
      qrCtx.fillStyle = "#000000";
      for (let row = 0; row < moduleCount; row++) {
        for (let col = 0; col < moduleCount; col++) {
          if (qr.isDark(row, col)) {
            qrCtx.fillRect((col + quiet) * cell, (row + quiet) * cell, cell, cell);
          }
        }
      }
    }

    function coopQrCanvasDataUrl() {
      const canvasNode = document.getElementById("coop-qr-canvas");
      return canvasNode ? canvasNode.toDataURL("image/png") : "";
    }

    async function coopCopyQrImage() {
      try {
        updateCoopQr();
        const dataUrl = coopQrCanvasDataUrl();
        if (!dataUrl) throw new Error("QR missing");
        const blob = await (await fetch(dataUrl)).blob();
        if (!navigator.clipboard || !window.ClipboardItem) throw new Error("Image clipboard unsupported");
        await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
        setCoopStatus("QR COPIED");
        coopToast("QR COPIED");
      } catch (err) {
        const dataUrl = coopQrCanvasDataUrl();
        if (dataUrl && coopCopyTextFallback(dataUrl)) {
          setCoopStatus("QR DATA COPIED");
          coopToast("QR DATA COPIED");
          return;
        }
        try {
          await navigator.clipboard.writeText(coopGetLocalSignal());
          setCoopStatus("QR COPY FAIL - SIGNAL COPIED");
          coopToast("QR FAILED - CODE COPIED");
        } catch {
          if (coopCopyTextFallback(coopGetLocalSignal())) {
            setCoopStatus("QR COPY FAIL - SIGNAL COPIED");
            coopToast("QR FAILED - CODE COPIED");
          } else {
            setCoopStatus("QR COPY FAIL");
            coopToast("QR COPY FAILED", false);
          }
        }
      }
    }

    async function coopStartQrScan() {
      try {
        ensureCoopPanel();
        if (!window.isSecureContext && location.protocol !== "file:") {
          setCoopStatus("SCAN NEEDS HTTPS");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof jsQR !== "function") {
          setCoopStatus("SCAN UNSUPPORTED");
          return;
        }
        coopStopQrScan(false);
        const box = document.getElementById("coop-scan-box");
        const video = document.getElementById("coop-scan-video");
        box.style.display = "block";
        coopScanStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        const track = coopScanStream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          try {
            const caps = track.getCapabilities ? track.getCapabilities() : {};
            const advanced = {};
            if (caps.focusMode && caps.focusMode.includes("continuous")) advanced.focusMode = "continuous";
            if (caps.exposureMode && caps.exposureMode.includes("continuous")) advanced.exposureMode = "continuous";
            if (caps.zoom) advanced.zoom = Math.min(caps.zoom.max, Math.max(caps.zoom.min, 1.6));
            if (Object.keys(advanced).length) await track.applyConstraints({ advanced: [advanced] });
          } catch (err) {
            console.warn("QR camera tuning skipped", err);
          }
        }
        video.srcObject = coopScanStream;
        await video.play();
        coopBarcodeDetector = null;
        if ("BarcodeDetector" in window) {
          try {
            const formats = await BarcodeDetector.getSupportedFormats();
            if (formats.includes("qr_code")) coopBarcodeDetector = new BarcodeDetector({ formats: ["qr_code"] });
          } catch (err) {
            console.warn("Native QR detector unavailable", err);
          }
        }
        setCoopStatus("SCANNING QR");
        coopScanFrame = requestAnimationFrame(coopScanTick);
      } catch (err) {
        setCoopStatus("SCAN FAIL");
        console.error(err);
        coopStopQrScan(false);
      }
    }

    function coopStopQrScan(updateStatus = true) {
      if (coopScanFrame) cancelAnimationFrame(coopScanFrame);
      coopScanFrame = 0;
      coopBarcodeDetector = null;
      if (coopScanStream) {
        for (const track of coopScanStream.getTracks()) track.stop();
      }
      coopScanStream = null;
      const box = document.getElementById("coop-scan-box");
      const video = document.getElementById("coop-scan-video");
      if (video) video.srcObject = null;
      if (box) box.style.display = "none";
      if (updateStatus) setCoopStatus("SCAN STOPPED");
    }

    function coopTryDecodeQr(scanCtx, sourceWidth, sourceHeight, crop) {
      const target = Math.min(900, Math.max(360, Math.floor(Math.max(crop.w, crop.h))));
      const scale = target / Math.max(crop.w, crop.h);
      const w = Math.max(1, Math.round(crop.w * scale));
      const h = Math.max(1, Math.round(crop.h * scale));
      scanCtx.canvas.width = w;
      scanCtx.canvas.height = h;
      scanCtx.imageSmoothingEnabled = true;
      scanCtx.drawImage(
        document.getElementById("coop-scan-video"),
        crop.x, crop.y, crop.w, crop.h,
        0, 0, w, h
      );
      const image = scanCtx.getImageData(0, 0, w, h);
      return jsQR(image.data, image.width, image.height, { inversionAttempts: "attemptBoth" });
    }

    async function coopScanTick() {
      const video = document.getElementById("coop-scan-video");
      const canvasNode = document.getElementById("coop-scan-canvas");
      if (!video || !canvasNode || !coopScanStream) return;
      if (video.readyState >= 2 && video.videoWidth && video.videoHeight) {
        if (coopBarcodeDetector) {
          try {
            const codes = await coopBarcodeDetector.detect(video);
            const qr = codes && codes.find((item) => item.rawValue);
            if (qr && qr.rawValue) {
              await coopHandleScannedSignal(qr.rawValue);
              return;
            }
          } catch (err) {}
        }
        const scanCtx = canvasNode.getContext("2d", { willReadFrequently: true });
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const side = Math.min(vw, vh);
        const crops = [
          { x: 0, y: 0, w: vw, h: vh },
          { x: (vw - side) / 2, y: (vh - side) / 2, w: side, h: side },
          { x: vw * 0.15, y: vh * 0.15, w: vw * 0.7, h: vh * 0.7 },
          { x: vw * 0.25, y: vh * 0.25, w: vw * 0.5, h: vh * 0.5 }
        ];
        let code = null;
        for (const crop of crops) {
          code = coopTryDecodeQr(scanCtx, vw, vh, crop);
          if (code && code.data) break;
        }
        if (code && code.data) {
          await coopHandleScannedSignal(code.data);
          return;
        }
      }
      coopScanFrame = requestAnimationFrame(coopScanTick);
    }

    async function coopHandleScannedSignal(text) {
      coopStopQrScan(false);
      coopApplyRemoteSignal(text);
      try {
        const signal = await coopUnpackSignal(text);
        coopSetCandidateInfo("remote", signal);
        if (signal.type === "offer") {
          coop.scannedOfferReady = true;
          setCoopStatus("HOST QR SCANNED");
        } else if (signal.type === "answer") {
          setCoopStatus("GUEST CODE READY");
        } else {
          setCoopStatus("QR PASTED");
        }
      } catch (err) {
        setCoopStatus("QR INVALID");
        console.error(err);
      }
    }

    async function coopUseRemoteCode(text) {
      try {
        ensureCoopPanel();
        if (coop.role === "host" && coop.codeView === "local" && !coopGetRemoteSignal()) {
          coopShowRemoteCode();
          setCoopStatus("PASTE GUEST CODE");
          return;
        }
        const code = (text || coopGetRemoteSignal()).trim();
      const signal = await coopUnpackSignal(code);
      coopSetCandidateInfo("remote", signal);
      coopApplyRemoteSignal(code);
        if (signal.type === "offer") {
          setCoopStatus("OFFER FOUND");
          await coopStartJoiner(code);
        } else if (signal.type === "answer") {
          setCoopStatus("ANSWER FOUND");
          await coopAcceptAnswer(code);
        } else {
          setCoopStatus("BAD CODE");
        }
      } catch (err) {
        setCoopStatus("BAD CODE");
        console.error(err);
      }
    }

        { urls: "stun:stun2.l.google.com:19302" },

    async function coopLoadIceServers() {
      if (!meteredIceServersPromise) {
        meteredIceServersPromise = fetch(METERED_TURN_API_URL, { cache: "no-store" })
          .then((response) => {
            if (!response.ok) throw new Error("TURN API " + response.status);
            return response.json();
          })
          .then((servers) => {
            if (!Array.isArray(servers) || !servers.length) throw new Error("TURN API returned no ICE servers");
            return servers;
          })
          .catch((err) => {
            console.warn("Metered TURN fetch failed, using fallback ICE servers", err);
            return fallbackIceServers();
          });
      }
      return meteredIceServersPromise;
    }

    async function coopCreatePeer(reset = true, holder = coop) {
      if (!window.RTCPeerConnection) throw new Error("WebRTC unsupported");
      if (reset) coopDisconnect(false);
      const iceServers = coop.relayMode ? await coopLoadIceServers() : directIceServers();
      const pc = new RTCPeerConnection({
        iceServers,
        iceCandidatePoolSize: 8,
        iceTransportPolicy: coop.relayMode ? "relay" : "all",
        bundlePolicy: "max-bundle",
        rtcpMuxPolicy: "require"
      });
      holder.pc = pc;
      if (holder === coop) coop.pc = pc;
      coop.pcState = pc.connectionState || "new";
      coop.iceState = pc.iceConnectionState || "new";
      coop.iceGathering = pc.iceGatheringState || "new";
      pc.onconnectionstatechange = () => {
        coop.pcState = pc.connectionState || "unknown";
        coop.lastError = "";
        holder.connected = pc.connectionState === "connected";
        coop.connected = coopHostAnyConnected() || holder.connected;
        if (holder.connected) {
          coop.exchanging = false;
          coop.lastError = "";
          coopUpdateSelectedPath(pc);
          setCoopStatus(coopHostSlotsReady() ? "CONNECTED" : "WAITING GUESTS " + coopConnectedHostSlots() + "/" + Math.max(1, coop.guestSlotCount || 1));
          return;
        }
        if (coop.exchanging && (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
          coop.lastError = pc.connectionState === "failed" ? "PC_FAILED" : "PC_DISCONNECTED";
          setCoopStatus(pc.connectionState === "failed" ? "FAILED - NETWORK" : "DISCONNECTED");
          return;
        }
        if (pc.connectionState === "failed") coop.lastError = "PC_FAILED";
        setCoopStatus(pc.connectionState === "failed" ? "FAILED - NETWORK" : pc.connectionState.toUpperCase());
      };
      pc.oniceconnectionstatechange = () => {
        coop.iceState = pc.iceConnectionState || "unknown";
        if (pc.iceConnectionState === "failed") {
          coop.lastError = "ICE_FAILED";
          setCoopStatus("FAILED - NETWORK");
        }
        else if (pc.iceConnectionState === "disconnected") {
          coop.lastError = "ICE_DISCONNECTED";
          coopRefreshPanel();
        }
        else coopRefreshPanel();
      };
      pc.onicegatheringstatechange = () => {
        coop.iceGathering = pc.iceGatheringState || "unknown";
        coopRefreshPanel();
      };
      pc.onicecandidate = () => {
        coopSetCandidateInfo("local", pc.localDescription);
        coopRefreshPanel();
      };
      pc.ondatachannel = (event) => coopAttachChannel(event.channel, holder);
      return pc;
    }

    async function coopUpdateSelectedPath(pc) {
      try {
        if (!pc || typeof pc.getStats !== "function") return;
        const stats = await pc.getStats();
        let selectedPair = null;
        stats.forEach((report) => {
          if (selectedPair) return;
          if (report.type === "transport" && report.selectedCandidatePairId) {
            selectedPair = stats.get(report.selectedCandidatePairId) || null;
          }
        });
        if (!selectedPair) {
          stats.forEach((report) => {
            if (selectedPair) return;
            if (report.type === "candidate-pair" && report.state === "succeeded" && report.nominated) selectedPair = report;
          });
        }
        if (!selectedPair) return;
        const local = stats.get(selectedPair.localCandidateId);
        const remote = stats.get(selectedPair.remoteCandidateId);
        const localType = local && local.candidateType ? local.candidateType : "-";
        const remoteType = remote && remote.candidateType ? remote.candidateType : "-";
        const pathType = localType === "relay" || remoteType === "relay" ? "relay" : (localType === "srflx" || remoteType === "srflx" ? "srflx" : "host");
        coop.selectedPathType = pathType;
        coop.selectedPathDetail = localType + ">" + remoteType;
        coopRefreshPanel();
      } catch (err) {
        console.warn("Selected path stats failed", err);
      }
    }

    function coopAttachChannel(channel, holder = coop) {
      holder.channel = channel;
      if (holder === coop) coop.channel = channel;
      channel.onopen = () => {
        holder.connected = true;
        coop.connected = true;
        coopSendTimer = 0;
        coopWorldTimer = 0;
        coopMapTimer = 0;
        coopStartNetworkPump();
        setCoopStatus("CONNECTED");
        if (coop.role === "host" && !coopHostSlotsReady()) {
          setCoopStatus("WAITING GUESTS " + coopConnectedHostSlots() + "/" + Math.max(1, coop.guestSlotCount || 1));
          coopRefreshPanel();
        } else {
          coopOnConnected();
        }
        if (coop.role === "host") {
          setTimeout(() => {
            coopSendMapToChannel(channel);
            coopSendWorldToChannel(channel);
          }, 0);
        }
      };
      channel.onclose = () => {
        holder.connected = false;
        coop.connected = coopHostAnyConnected();
        coopStopNetworkPump();
        setCoopStatus("CLOSED");
      };
      channel.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.t === "state") {
            coopApplyRemotePeerState(data, holder);
          } else if (data.t === "map" && coop.role === "guest") {
            coopApplyHostMap(data);
          } else if (data.t === "world" && coop.role === "guest") {
            coopApplyHostWorld(data);
          } else if (data.t === "damage" && coop.role === "guest") {
            coopApplyDamage(data);
          } else if (data.t === "pvp-control") {
            applyPvpControl(data, coop.role === "host");
          }
        } catch (err) {
          console.warn("Bad coop message", err);
        }
      };
    }

    function coopOnConnected() {
      coop.connectedAt = performance.now();
      if (coopPanel) coopPanel.style.display = "none";
      coopToast("NETWORK CONNECTED", true);
      if (coop.role === "host" && coop.hostMode === "pvp") beginPvpCountdown();
      if (coop.role === "guest") {
        if (state !== "play") state = "play";
        coopResetGuestTransientEffects();
        if (isMobile) initMobileAimCursor();
        updateCamera(1, mobileAimWorldTarget());
      }
      for (let i = 0; i < 8; i++) {
        setTimeout(() => coopSendNow(), i * 80);
      }
    }

    function coopResetGuestTransientEffects() {
      shake = 0;
      particles.length = 0;
      healPluses.length = 0;
      tracers.length = 0;
      enemyTracers.length = 0;
      flashes.length = 0;
      flameBursts.length = 0;
      iceStorms.length = 0;
      blastLights.length = 0;
      fizzles.length = 0;
      dashBursts.length = 0;
      deathTexts.length = 0;
      speechBubbles.length = 0;
    }

    function coopRemotePeers() {
      const peers = [];
      if (coop.remote) peers.push(coop.remote);
      if (Array.isArray(coop.extraRemotes)) {
        for (const remote of coop.extraRemotes) {
          if (remote && !peers.includes(remote)) peers.push(remote);
        }
      }
      return peers;
    }

    function coopHostAnyConnected() {
      if (coop.channel && coop.channel.readyState === "open") return true;
      if (Array.isArray(coop.hostSlots)) {
        return coop.hostSlots.some((slot) => slot && slot.channel && slot.channel.readyState === "open");
      }
      return false;
    }

    function coopConnectedHostSlots() {
      let count = coop.channel && coop.channel.readyState === "open" ? 1 : 0;
      if (Array.isArray(coop.hostSlots)) {
        for (const slot of coop.hostSlots) if (slot && slot.channel && slot.channel.readyState === "open") count++;
      }
      return count;
    }

    function coopHostSlotsReady() {
      return coopConnectedHostSlots() >= Math.max(1, coop.guestSlotCount || 1);
    }

    async function coopWaitIce(pc) {
      if (pc.iceGatheringState === "complete") {
        coopSetCandidateInfo("local", pc.localDescription);
        coopRefreshPanel();
        return;
      }
      await new Promise((resolve) => {
        let settled = false;
        const done = () => {
          if (!settled && pc.iceGatheringState === "complete") {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            coopSetCandidateInfo("local", pc.localDescription);
            coopRefreshPanel();
            setTimeout(resolve, 250);
          }
        };
        const candidateDone = (event) => {
          if (!settled && !event.candidate) {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            coopSetCandidateInfo("local", pc.localDescription);
            coopRefreshPanel();
            setTimeout(resolve, 250);
          }
        };
        pc.addEventListener("icegatheringstatechange", done);
        pc.addEventListener("icecandidate", candidateDone);
        setTimeout(() => {
          if (!settled) {
            settled = true;
            pc.removeEventListener("icegatheringstatechange", done);
            pc.removeEventListener("icecandidate", candidateDone);
            coopSetCandidateInfo("local", pc.localDescription);
            coopRefreshPanel();
            resolve();
          }
        }, 12000);
      });
    }

    async function coopStartHost() {
      try {
        ensureCoopPanel();
        setCoopStatus("HOSTING");
        const pc = await coopCreatePeer();
        coop.role = "host";
        coop.hostMode = coop.hostMode === "pvp" ? "pvp" : "coop";
        coop.activeHostSlot = 0;
        coop.hostSlots = [];
        coop.extraRemotes = [];
        coop.exchanging = true;
        coopAttachChannel(pc.createDataChannel("sang-sub-coop"));
        await pc.setLocalDescription(await pc.createOffer());
        await coopWaitIce(pc);
        if (!coopCheckRelayCandidate("HOST")) return;
        await coopSetLocalDescriptionSignal(pc.localDescription);
        coopShowLocalCode();
        const qrBox = document.getElementById("coop-qr-box");
        if (qrBox) qrBox.style.display = "block";
        updateCoopQr();
        setCoopStatus("WAITING FOR GUEST CODE");
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    async function coopCreateExtraHostSlot(index) {
      if (coop.role !== "host" || index < 1) return null;
      coop.hostSlots = Array.isArray(coop.hostSlots) ? coop.hostSlots : [];
      let slot = coop.hostSlots[index - 1];
      if (slot && slot.pc && slot.localSignal) return slot;
      slot = {
        index,
        pc: null,
        channel: null,
        remote: null,
        localSignal: "",
        remoteSignal: "",
        connected: false,
        seenRemoteShotDamageSeq: 0,
        seenRemoteShotVisualSeq: 0,
        seenRemoteActionSeq: 0
      };
      coop.hostSlots[index - 1] = slot;
      coop.extraRemotes = coop.hostSlots.map((s) => s && s.remote).filter(Boolean);
      const pc = await coopCreatePeer(false, slot);
      coopAttachChannel(pc.createDataChannel("sang-sub-coop-" + (index + 1)), slot);
      await pc.setLocalDescription(await pc.createOffer());
      await coopWaitIce(pc);
      slot.localSignal = await coopPackSignal(pc.localDescription);
      coop.activeHostSlot = index;
      coopSetVisibleCode(slot.localSignal, true);
      setCoopStatus("GUEST " + (index + 1) + " QR READY");
      updateCoopQr();
      coopRefreshPanel();
      return slot;
    }

    async function coopEnsureHostSlot(index) {
      if (index <= 0) return { index: 0, pc: coop.pc, channel: coop.channel, remote: coop.remote, localSignal: coopGetLocalSignal(), connected: !!(coop.channel && coop.channel.readyState === "open") };
      return coopCreateExtraHostSlot(index);
    }

    function coopSelectHostSlot(index) {
      coop.activeHostSlot = Math.max(0, index | 0);
      if (coop.activeHostSlot === 0) {
        coopShowLocalCode();
        setCoopStatus(coop.connected ? "CONNECTED" : "GUEST 1 QR READY");
      } else {
        const slot = coop.hostSlots && coop.hostSlots[coop.activeHostSlot - 1];
        if (slot && slot.localSignal) {
          coopSetVisibleCode(slot.localSignal, true);
          setCoopStatus("GUEST " + (coop.activeHostSlot + 1) + " QR READY");
        }
      }
      const qrBox = document.getElementById("coop-qr-box");
      if (qrBox) qrBox.style.display = "block";
      updateCoopQr();
      coopRefreshPanel();
    }

    async function coopStartJoiner(offerText) {
      try {
        ensureCoopPanel();
        setCoopStatus("JOINING");
        const offer = await coopUnpackSignal(offerText || coopGetRemoteSignal());
        const pc = await coopCreatePeer();
        coop.role = "guest";
        coop.exchanging = true;
        coopSetCandidateInfo("remote", offer);
        await pc.setRemoteDescription(offer);
        await pc.setLocalDescription(await pc.createAnswer());
        await coopWaitIce(pc);
        if (!coopCheckRelayCandidate("GUEST")) return;
        await coopSetLocalDescriptionSignal(pc.localDescription);
        coop.scannedOfferReady = false;
        coopShowLocalCode();
        const qrBox = document.getElementById("coop-qr-box");
        if (qrBox) qrBox.style.display = "block";
        updateCoopQr();
        setCoopStatus("GUEST CODE READY");
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    async function coopAcceptAnswer(answerText) {
      try {
        const slotIndex = Math.max(0, coop.activeHostSlot || 0);
        const holder = slotIndex > 0 ? coop.hostSlots && coop.hostSlots[slotIndex - 1] : coop;
        if (!holder || !holder.pc) throw new Error("Host peer missing");
        const answer = await coopUnpackSignal(answerText || coopGetRemoteSignal());
        coopSetCandidateInfo("remote", answer);
        if (holder !== coop) holder.remoteSignal = answerText || coopGetRemoteSignal();
        await holder.pc.setRemoteDescription(answer);
        coop.exchanging = !coopHostSlotsReady();
        setCoopStatus("CONNECTING GUEST " + (slotIndex + 1));
      } catch (err) {
        setCoopStatus("ERROR");
        console.error(err);
      }
    }

    function coopDisconnect(updateStatus = true) {
      coopStopQrScan(false);
      if (coop.channel) coop.channel.close();
      if (coop.pc) coop.pc.close();
      if (Array.isArray(coop.hostSlots)) {
        for (const slot of coop.hostSlots) {
          if (slot && slot.channel) slot.channel.close();
          if (slot && slot.pc) slot.pc.close();
        }
      }
      coopStopNetworkPump();
      coop.pc = null;
      coop.channel = null;
      coop.role = "";
      if (updateStatus) {
        coop.hostMode = "";
        coop.guestSlotCount = 1;
      }
      coop.remote = null;
      coop.hostSlots = [];
      coop.extraRemotes = [];
      coop.activeHostSlot = 0;
      coop.connected = false;
      coop.exchanging = false;
      coop.codeView = "remote";
      coop.scannedOfferReady = false;
      coop.pcState = "new";
      coop.iceState = "new";
      coop.iceGathering = "new";
      coop.localCandidates = 0;
      coop.remoteCandidates = 0;
      coop.localCandidateTypes = "";
      coop.remoteCandidateTypes = "";
      coop.selectedPathType = "";
      coop.selectedPathDetail = "";
      coop.lastError = "";
      if (updateStatus) {
        coop.busy = false;
        coop.busyText = "";
      }
      coop.worldSeq = 0;
      coop.mapSeq = 0;
      coop.worldRecvAt = 0;
      coopSendTimer = 0;
      coopWorldTimer = 0;
      coopMapTimer = 0;
      if (updateStatus) coop.relayMode = false;
      if (coopPanel) {
        const local = document.getElementById("coop-local");
        const remote = document.getElementById("coop-remote");
        if (local) local.value = "";
        if (remote) remote.value = "";
        coopSetVisibleCode("", false);
        const qrBox = document.getElementById("coop-qr-box");
        if (qrBox) qrBox.style.display = "none";
        coopRefreshPanel();
      }
      if (updateStatus) setCoopStatus("OFFLINE");
    }

    function coopCheckRelayCandidate(stage) {
      if (!coop.relayMode) return true;
      if (coopHasRelay("local")) return true;
      coop.lastError = "NO_RELAY_" + stage;
      setCoopStatus("TURN RELAY FAIL");
      return false;
    }

    function coopSendNow() {
      if (!coopHostAnyConnected()) return false;
      return coopSendJson({
        t: "state",
        x: player.x,
        y: player.y,
        angle: player.angle,
        hp: player.hp,
        team: coop.role === "guest" ? "red" : "blue",
        weapon: selectedWeapon,
        guestClass: coop.guestClass || "gunner",
        healActive: healerActive,
        healEnergy: healerEnergy,
        healReserve: healerReserve,
        healMode: healerMode,
        healReload: healerReload,
        healTargetX: healerTargetX,
        healTargetY: healerTargetY,
        moving: player.isMoving,
        shotSeq: coopShotSeq,
        shot: coopLastShot,
        actionSeq: coopActionSeq,
        action: coopLastAction
      });
    }

    function updateCoop(dt) {
      coopLerpRemotePeer(dt);
      coopSmoothHostWorld(dt);
      if (coop.remote) coop.remote.invuln = Math.max(0, (coop.remote.invuln || 0) - dt);
      if (coop.remote && performance.now() - coop.remote.last > 3200) {
        coop.remote = null;
      }
    }

    function coopStartNetworkPump() {
      if (coopPumpHandle) return;
      coopPumpLast = performance.now();
      coopPumpHandle = setInterval(() => {
        const now = performance.now();
        const dt = Math.min(0.2, Math.max(0.001, (now - coopPumpLast) / 1000));
        coopPumpLast = now;
        coopNetworkPump(dt);
      }, 33);
    }

    function coopStopNetworkPump() {
      if (coopPumpHandle) clearInterval(coopPumpHandle);
      coopPumpHandle = 0;
    }

    function coopNetworkPump(dt) {
      if (!coop.connected || !coopHostAnyConnected()) return;
      coopSendTimer -= dt;
      if (coopSendTimer <= 0) {
        coopSendTimer = 1 / 30;
        coopSendNow();
      }
      if (coop.role === "host") {
        coopMapTimer -= dt;
        if (coopMapTimer <= 0) {
          coopMapTimer = 2.5;
          coopSendMap();
        }
        coopWorldTimer -= dt;
        if (coopWorldTimer <= 0) {
          coopWorldTimer = 1 / 20;
          coopSendWorld();
        }
      }
    }

    function coopSendJson(payload) {
      let sent = false;
      if (coop.channel && coop.channel.readyState === "open") sent = coopSendToChannel(coop.channel, payload) || sent;
      if (Array.isArray(coop.hostSlots)) {
        for (const slot of coop.hostSlots) {
          if (slot.channel && slot.channel.readyState === "open") sent = coopSendToChannel(slot.channel, payload) || sent;
        }
      }
      return sent;
    }

    function coopSendToChannel(channel, payload) {
      if (!channel || channel.readyState !== "open") return false;
      if (channel.bufferedAmount > 512000 && payload.t === "world") return false;
      try {
        channel.send(JSON.stringify(payload));
        return true;
      } catch (err) {
        console.warn("Coop send failed", err);
        return false;
      }
    }

    function coopApplyRemotePeerState(data, holder = coop) {
      const now = performance.now();
      const x = Number(data.x) || 0;
      const y = Number(data.y) || 0;
      if (!holder.remote) {
        holder.remote = { x, y, sx: x, sy: y, tx: x, ty: y, vx: 0, vy: 0, interp: 1, last: now, packetAt: now, r: 24, collisionR: 15, invuln: 0 };
      } else {
        const remote = holder.remote;
        const packetDt = Math.max(0.016, Math.min(0.22, (now - (remote.packetAt || now)) / 1000));
        const prevNetX = Number.isFinite(remote.netX) ? remote.netX : (Number.isFinite(remote.tx) ? remote.tx : remote.x);
        const prevNetY = Number.isFinite(remote.netY) ? remote.netY : (Number.isFinite(remote.ty) ? remote.ty : remote.y);
        remote.vx = clamp((x - prevNetX) / packetDt, -720, 720);
        remote.vy = clamp((y - prevNetY) / packetDt, -720, 720);
        remote.sx = remote.x;
        remote.sy = remote.y;
        remote.netX = x;
        remote.netY = y;
        remote.tx = x + remote.vx * 0.055;
        remote.ty = y + remote.vy * 0.055;
        remote.interp = 0;
        remote.packetAt = now;
        remote.last = now;
      }
      const remote = holder.remote;
      if (holder !== coop) {
        coop.extraRemotes = Array.isArray(coop.extraRemotes) ? coop.extraRemotes : [];
        if (!coop.extraRemotes.includes(remote)) coop.extraRemotes.push(remote);
      }
      remote.angleTarget = Number(data.angle) || 0;
      remote.angle = Number.isFinite(remote.angle) ? remote.angle : remote.angleTarget;
      remote.hp = Math.max(0, Math.min(100, Number(data.hp) || 0));
      remote.r = 24;
      remote.collisionR = 15;
      remote.weapon = data.weapon || "rifle";
      remote.team = data.team || (coop.role === "host" ? "red" : "blue");
      remote.guestClass = data.guestClass || "gunner";
      remote.healActive = !!data.healActive;
      remote.healEnergy = Number(data.healEnergy) || 0;
      remote.healReserve = Number(data.healReserve) || 0;
      remote.healMode = data.healMode || "none";
      remote.healReload = Number(data.healReload) || 0;
      remote.healTargetX = Number(data.healTargetX) || remote.x;
      remote.healTargetY = Number(data.healTargetY) || remote.y;
      remote.moving = !!data.moving;
      remote._channel = holder.channel || coop.channel || null;
      if (coop.role === "host" && remote.guestClass === "healer" && remote.healActive && remote.healMode === "ally" && player.hp > 0 && player.hp < 100) {
        const healDt = Math.max(0.016, Math.min(0.08, (now - (remote.healAppliedAt || now - 33)) / 1000));
        remote.healAppliedAt = now;
        const targetClose = Math.hypot(remote.healTargetX - player.x, remote.healTargetY - player.y) <= HEAL_TARGET_RADIUS;
        const path = targetClose ? findHealPath(remote.x, remote.y, player.x, player.y, HEAL_PATH_MAX) : null;
        remote.healPath = path;
        if (path) {
          player.hp = Math.min(100, player.hp + healDt * HEAL_RATE);
          voiceCommandStatus = "HEAL LINK";
          voiceCommandStatusTimer = Math.max(voiceCommandStatusTimer, 0.24);
          remote.healPlusTimer = (remote.healPlusTimer || 0) - healDt;
          if (remote.healPlusTimer <= 0) {
            remote.healPlusTimer = 0.28;
            addHealPlus(player.x, player.y);
          }
        } else {
          remote.healActive = false;
          remote.healPath = null;
        }
      } else {
        if (coop.role === "host" && remote.guestClass === "healer" && remote.healActive && remote.healMode === "enemy") {
          let best = null;
          let bestD = Infinity;
          for (const enemy of enemies) {
            if ((enemy.hp || 0) <= 0) continue;
            const d = dist2(remote.healTargetX, remote.healTargetY, enemy.x, enemy.y);
            if (d < bestD) {
              bestD = d;
              best = enemy;
            }
          }
          remote.healPath = best && bestD <= HEAL_TARGET_RADIUS * HEAL_TARGET_RADIUS
            ? findHealPath(remote.x, remote.y, best.x, best.y, HEAL_PATH_MAX)
            : null;
        } else {
          remote.healPath = null;
        }
      }
      coopApplyRemoteShotDamage(data, holder);
      coopApplyRemoteAction(data, holder);
      const shotSeq = Number(data.shotSeq) || 0;
      if (shotSeq > (holder.seenRemoteShotVisualSeq || 0) && data.shot) {
        holder.seenRemoteShotVisualSeq = shotSeq;
        const shot = data.shot;
        const x1 = Number(shot.x1) || x;
        const y1 = Number(shot.y1) || y;
        const x2 = Number(shot.x2) || x;
        const y2 = Number(shot.y2) || y;
        const dxRaw = x2 - x1;
        const dyRaw = y2 - y1;
        const d = Math.hypot(dxRaw, dyRaw) || 1;
        const angle = Number.isFinite(shot.angle) ? Number(shot.angle) : Math.atan2(dyRaw, dxRaw);
        const dx = Math.cos(angle);
        const dy = Math.sin(angle);
        const remoteTeam = coop.role === "host" ? "red" : "blue";
        const hit = raycastShot(x1, y1, dx, dy, clamp(Number(shot.maxDist) || d, 20, 1200), remoteTeam);
        enemyTracers.push({
          x1,
          y1,
          x2: hit.x,
          y2: hit.y,
          life: 0.12,
          maxLife: 0.12
        });
        flashes.push({ x: x1 + dx * 14, y: y1 + dy * 14, angle, life: 0.075, maxLife: 0.075 });
        if (hit.solid || hit.prop || hit.pvpTarget) burst(hit.x, hit.y, hit.pvpTarget ? "#c8e7a0" : "#f4efe8", 5);
      }
    }

    function coopLerpRemotePeer(dt) {
      for (const remote of coopRemotePeers()) coopLerpOneRemote(remote, dt);
    }

    function coopLerpOneRemote(remote, dt) {
      if (!remote) return;
      const step = Math.min(1, dt * 13);
      remote.interp = Math.min(1, (remote.interp || 0) + step);
      const t = 1 - Math.pow(1 - remote.interp, 3);
      const tx = Number.isFinite(remote.tx) ? remote.tx : remote.x;
      const ty = Number.isFinite(remote.ty) ? remote.ty : remote.y;
      if (Math.hypot(tx - remote.x, ty - remote.y) > 260) {
        remote.x = tx;
        remote.y = ty;
      } else {
        remote.x = (remote.sx || remote.x) + (tx - (remote.sx || remote.x)) * t;
        remote.y = (remote.sy || remote.y) + (ty - (remote.sy || remote.y)) * t;
      }
      if (Number.isFinite(remote.angleTarget)) {
        let da = remote.angleTarget - (remote.angle || 0);
        while (da > Math.PI) da -= Math.PI * 2;
        while (da < -Math.PI) da += Math.PI * 2;
        remote.angle = (remote.angle || 0) + da * Math.min(1, dt * 16);
      }
    }

    function coopSendMap() {
      coop.mapSeq++;
      coopSendJson(coopMapPayload());
    }

    function coopMapPayload() {
      return { t: "map", seq: coop.mapSeq, data: serializeMapData() };
    }

    function coopSendMapToChannel(channel) {
      coop.mapSeq++;
      coopSendToChannel(channel, coopMapPayload());
    }

    function coopCloneFields(item, fields) {
      const out = {};
      for (const key of fields) {
        if (item[key] !== undefined) out[key] = item[key];
      }
      return out;
    }

    function coopSerializeSpeechBubble(bubble) {
      return {
        text: bubble.text,
        delay: bubble.delay,
        life: bubble.life,
        maxLife: bubble.maxLife,
        screen: !!bubble.screen,
        enemyIndex: bubble.enemy ? enemies.indexOf(bubble.enemy) : -1
      };
    }

    function coopSendWorld() {
      coop.worldSeq++;
      coopSendJson(coopWorldPayload());
    }

    function coopWorldPayload() {
      return {
        t: "world",
        seq: coop.worldSeq,
        mapMode: currentMapMode,
        pvpCountdown,
        pvpWinner,
        pvpRoundActive,
        kills,
        wave,
        shake: Math.min(10, Math.max(0, shake)),
        fixtureBoost,
        specialForcesEnabled,
        raidWarningActive,
        raidWarningPulse,
        doors: doors.map((d) => coopCloneFields(d, ["open", "target", "axis", "x", "y", "w", "h"])),
        props: props.map((p) => coopCloneFields(p, ["x", "y", "type", "s", "a", "hp", "maxHp", "hitFlash", "buildTime"])),
        pickups: pickups.map((p) => coopCloneFields(p, ["x", "y", "r", "type", "life", "pulse"])),
        enemies: enemies.map((e) => coopCloneFields(e, ["x", "y", "r", "collisionR", "hp", "maxHp", "angle", "kind", "fast", "freeze", "dropTime", "dropMax", "dropHeight", "raidLeader", "raidAggressive", "wobble"])),
        bullets: bullets.map((b) => coopCloneFields(b, ["x", "y", "vx", "vy", "r", "life"])),
        bombs: bombs.filter((b) => !b.localOnly).map((b) => coopCloneFields(b, ["x", "y", "sx", "sy", "tx", "ty", "life", "maxLife", "r", "hostile", "owner", "actionSeq"])),
        corpses: corpses.map((c) => coopCloneFields(c, ["x", "y", "r", "fast", "angle", "pose", "stain"])),
        deathTexts: deathTexts.map((t) => coopCloneFields(t, ["x", "y", "life", "maxLife", "angle"])),
        blastLights: blastLights.map((b) => coopCloneFields(b, ["x", "y", "life", "maxLife", "radius"])),
        fizzles: fizzles.map((f) => coopCloneFields(f, ["x", "y", "life", "maxLife", "angle"])),
        speechBubbles: speechBubbles.map(coopSerializeSpeechBubble),
        tracers: tracers.filter((tr) => !tr.localOnly).map((tr) => coopCloneFields(tr, ["x1", "y1", "x2", "y2", "life", "maxLife"])),
        flashes: flashes.filter((f) => !f.localOnly).map((f) => coopCloneFields(f, ["x", "y", "angle", "life", "maxLife"])),
        particles: particles.filter((p) => !p.localOnly).map((p) => coopCloneFields(p, ["x", "y", "vx", "vy", "life", "color", "r", "solidStop"])),
        enemyTracers: enemyTracers.map((tr) => coopCloneFields(tr, ["x1", "y1", "x2", "y2", "life", "maxLife"])),
        flameBursts: flameBursts.map((f) => coopCloneFields(f, ["x", "y", "angle", "life", "maxLife", "length", "spread", "hostile"])),
        iceStorms: iceStorms.map((s) => coopCloneFields(s, ["x", "y", "angle", "life", "maxLife", "length", "maxLength", "seed"])),
        pvpBases: pvpBases.map((b) => coopCloneFields(b, ["team", "x", "y", "r", "hp", "maxHp"])),
        pvpTowers: pvpTowers.map((t) => coopCloneFields(t, ["team", "lane", "x", "y", "r", "hp", "maxHp", "shoot", "hitFlash"])),
        pvpMinions: pvpMinions.map((m) => coopCloneFields(m, ["team", "lane", "pathIndex", "x", "y", "r", "hp", "maxHp", "shoot", "angle"]))
      };
    }

    function coopSendWorldToChannel(channel) {
      coop.worldSeq++;
      coopSendToChannel(channel, coopWorldPayload());
    }

    function coopApplyHostMap(data) {
      if (!data || data.seq <= coop.mapSeq || !data.data) return;
      coop.mapSeq = data.seq;
      applyMapData(data.data);
    }

    function coopCopyArray(target, source) {
      target.length = 0;
      if (!Array.isArray(source)) return;
      for (const item of source) target.push({ ...item });
    }

    function coopCopyArrayPreserveLocal(target, source) {
      const local = target.filter((item) => item.localOnly && (item.life || 0) > 0);
      coopCopyArray(target, source);
      for (const item of local) target.push(item);
    }

    function coopCopyBombsFromHost(source) {
      const localBombs = bombs.filter((b) => b.localOnly && (b.life || 0) > 0);
      coopCopyArray(bombs, source);
      for (const localBomb of localBombs) {
        const matchedHostBomb = bombs.find((b) => {
          if (b.localOnly || b.owner !== "guest") return false;
          if (localBomb.actionSeq && b.actionSeq && localBomb.actionSeq === b.actionSeq) return true;
          return Math.hypot((b.tx || b.x) - (localBomb.tx || localBomb.x), (b.ty || b.y) - (localBomb.ty || localBomb.y)) < 28;
        });
        if (matchedHostBomb) {
          matchedHostBomb.x = localBomb.x;
          matchedHostBomb.y = localBomb.y;
          matchedHostBomb.life = Math.min(matchedHostBomb.life || localBomb.life, localBomb.life || matchedHostBomb.life);
        } else {
          bombs.push(localBomb);
        }
      }
    }

    function coopApplyHostSpeechBubbles(remoteBubbles) {
      speechBubbles.length = 0;
      if (!Array.isArray(remoteBubbles)) return;
      for (const incoming of remoteBubbles) {
        speechBubbles.push({
          text: incoming.text || "",
          delay: Number(incoming.delay) || 0,
          life: Number(incoming.life) || 0,
          maxLife: Number(incoming.maxLife) || 1,
          screen: !!incoming.screen,
          enemy: Number.isInteger(incoming.enemyIndex) && incoming.enemyIndex >= 0 ? enemies[incoming.enemyIndex] || null : null
        });
      }
    }

    function coopApplyHostWorld(data) {
      try {
        if (!data || data.seq <= coop.worldSeq) return;
        coop.worldSeq = data.seq;
        coop.worldRecvAt = performance.now();
        if (state !== "play" && state !== "dead") state = "play";
        currentMapMode = data.mapMode === "pvp" ? "pvp" : "default";
        pvpCountdown = Number.isFinite(data.pvpCountdown) ? Math.max(0, Number(data.pvpCountdown)) : pvpCountdown;
        pvpWinner = typeof data.pvpWinner === "string" ? data.pvpWinner : "";
        pvpRoundActive = !!data.pvpRoundActive;
        kills = Number.isFinite(data.kills) ? data.kills : kills;
        wave = Number.isFinite(data.wave) ? data.wave : wave;
        fixtureBoost = Number.isFinite(data.fixtureBoost) ? data.fixtureBoost : fixtureBoost;
        specialForcesEnabled = !!data.specialForcesEnabled;
        raidWarningActive = !!data.raidWarningActive;
        raidWarningPulse = Number.isFinite(data.raidWarningPulse) ? data.raidWarningPulse : raidWarningPulse;
        shake = 0;
        if (Array.isArray(data.doors)) {
          while (doors.length > data.doors.length) doors.pop();
          for (let i = 0; i < data.doors.length; i++) {
            const incoming = data.doors[i] || {};
            if (!doors[i]) doors[i] = { x: incoming.x || 0, y: incoming.y || 0, w: incoming.w || 42, h: incoming.h || 42, axis: incoming.axis || "h", open: 0, target: 0, range: 34 };
            doors[i].x = Number(incoming.x) || doors[i].x || 0;
            doors[i].y = Number(incoming.y) || doors[i].y || 0;
            doors[i].w = Number(incoming.w) || doors[i].w || 42;
            doors[i].h = Number(incoming.h) || doors[i].h || 42;
            doors[i].axis = incoming.axis || doors[i].axis || "h";
            doors[i].open = Number(incoming.open) || 0;
            doors[i].target = Number(incoming.target) || 0;
          }
        }
        coopCopyArray(props, data.props);
        coopCopyArray(pickups, data.pickups);
        coopCopyArray(bullets, data.bullets);
        coopCopyBombsFromHost(data.bombs);
        coopCopyArray(corpses, data.corpses);
        coopCopyArray(deathTexts, data.deathTexts);
        coopCopyArray(blastLights, data.blastLights);
        coopCopyArray(fizzles, data.fizzles);
        coopCopyArrayPreserveLocal(tracers, data.tracers);
        coopCopyArrayPreserveLocal(flashes, data.flashes);
        coopCopyArrayPreserveLocal(particles, data.particles);
        coopCopyArray(enemyTracers, data.enemyTracers);
        coopCopyArray(flameBursts, data.flameBursts);
        coopCopyArray(iceStorms, data.iceStorms);
        coopCopyArray(pvpBases, data.pvpBases);
        coopCopyArray(pvpTowers, data.pvpTowers);
        coopCopyArray(pvpMinions, data.pvpMinions);
        coopApplyHostEnemies(data.enemies);
        coopApplyHostSpeechBubbles(data.speechBubbles);
      } catch (err) {
        console.warn("Coop world apply failed", err);
        coopToast("SYNC RECOVERED", false);
      }
    }

    function coopApplyHostEnemies(remoteEnemies) {
      if (!Array.isArray(remoteEnemies)) {
        enemies.length = 0;
        return;
      }
      while (enemies.length > remoteEnemies.length) enemies.pop();
      for (let i = 0; i < remoteEnemies.length; i++) {
        const incoming = remoteEnemies[i];
        const current = enemies[i] || {};
        const tx = Number(incoming.x) || 0;
        const ty = Number(incoming.y) || 0;
        if (!enemies[i]) {
          enemies[i] = { ...incoming, x: tx, y: ty, netX: tx, netY: ty };
        } else {
          const oldX = Number.isFinite(current.x) ? current.x : tx;
          const oldY = Number.isFinite(current.y) ? current.y : ty;
          const snap = Math.hypot(oldX - tx, oldY - ty) > 260 || (current.kind && incoming.kind && current.kind !== incoming.kind);
          Object.assign(current, incoming);
          current.x = snap ? tx : oldX;
          current.y = snap ? ty : oldY;
          current.netX = tx;
          current.netY = ty;
          enemies[i] = current;
        }
      }
    }

    function coopSmoothHostWorld(dt) {
      if (coop.role !== "guest" || !coop.connected) return;
      for (const e of enemies) {
        if (Number.isFinite(e.netX)) e.x += (e.netX - e.x) * Math.min(1, dt * 24);
        if (Number.isFinite(e.netY)) e.y += (e.netY - e.y) * Math.min(1, dt * 24);
      }
      for (const b of bullets) {
        if (Number.isFinite(b.vx)) b.x += b.vx * dt;
        if (Number.isFinite(b.vy)) b.y += b.vy * dt;
        b.life = Math.max(0, (b.life || 0) - dt);
      }
      for (const b of bombs) {
        b.life = Math.max(0, (b.life || 0) - dt);
        if (b.localOnly && b.life <= 0) continue;
        const t = 1 - Math.max(0, b.life / (b.maxLife || 1));
        const ease = 1 - Math.pow(1 - t, 2);
        b.x = b.sx + (b.tx - b.sx) * ease;
        b.y = b.sy + (b.ty - b.sy) * ease;
      }
      for (let i = bombs.length - 1; i >= 0; i--) {
        if (bombs[i].localOnly && (bombs[i].life || 0) <= 0) bombs.splice(i, 1);
      }
    }

    function coopUpdateGuestEffects(dt) {
      shake = 0;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        p.vx *= Math.pow(0.04, dt);
        p.vy *= Math.pow(0.04, dt);
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = healPluses.length - 1; i >= 0; i--) {
        const plus = healPluses[i];
        plus.life -= dt;
        plus.y -= dt * 26;
        if (plus.life <= 0) healPluses.splice(i, 1);
      }
      for (let i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        if (tracers[i].life <= 0) tracers.splice(i, 1);
      }
      for (let i = enemyTracers.length - 1; i >= 0; i--) {
        enemyTracers[i].life -= dt;
        if (enemyTracers[i].life <= 0) enemyTracers.splice(i, 1);
      }
      for (let i = flashes.length - 1; i >= 0; i--) {
        flashes[i].life -= dt;
        if (flashes[i].life <= 0) flashes.splice(i, 1);
      }
      for (let i = blastLights.length - 1; i >= 0; i--) {
        blastLights[i].life -= dt;
        if (blastLights[i].life <= 0) blastLights.splice(i, 1);
      }
      for (let i = fizzles.length - 1; i >= 0; i--) {
        fizzles[i].life -= dt;
        if (fizzles[i].life <= 0) fizzles.splice(i, 1);
      }
      for (let i = deathTexts.length - 1; i >= 0; i--) {
        deathTexts[i].life -= dt;
        if (deathTexts[i].life <= 0) deathTexts.splice(i, 1);
      }
      updateSpeechBubbles(dt);
      updateRaidWarningEffects(dt);
      for (let i = flameBursts.length - 1; i >= 0; i--) flameBursts[i].life = Math.max(0, flameBursts[i].life - dt);
      for (let i = iceStorms.length - 1; i >= 0; i--) iceStorms[i].life = Math.max(0, iceStorms[i].life - dt);
    }

    function coopGuestCollectPickups() {
      for (let i = pickups.length - 1; i >= 0; i--) {
        const p = pickups[i];
        if (dist2(player.x, player.y, p.x, p.y) < (player.r + p.r) * (player.r + p.r)) {
          applyPickup(p.type, p.x, p.y);
          const action = coopRememberAction("pickup", { x: p.x, y: p.y });
          action.pickupType = p.type;
          pickups.splice(i, 1);
          coopSendNow();
        }
      }
    }

    function updateCoopGuestPlayer(dt) {
      shootCooldown -= dt;
      bombCooldown -= dt;
      player.dodge -= dt;
      if (dashCharges <= 0 && dashRecharge > 0) {
        dashRecharge = Math.max(0, dashRecharge - dt);
        if (dashRecharge <= 0) dashCharges = 3;
      }
      if (rifleReload > 0) {
        rifleReload = Math.max(0, rifleReload - dt);
        if (rifleReload <= 0) rifleAmmo = 60;
      }
      player.invuln -= dt;
      let mx = 0;
      let my = 0;
      if (keys.has("KeyW") || keys.has("ArrowUp")) my--;
      if (keys.has("KeyS") || keys.has("ArrowDown")) my++;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) mx--;
      if (keys.has("KeyD") || keys.has("ArrowRight")) mx++;
      if (isMobile) {
        mx += mobileControls.moveX;
        my += mobileControls.moveY;
      }
      const mag = Math.hypot(mx, my) || 1;
      mx /= mag;
      my /= mag;
      const wantsDash = keys.has("Space") || (isMobile && mobileControls.dodge);
      if (wantsDash && dashCharges > 0 && player.dodge <= 0 && (mx || my)) {
        player.dodge = 0.22;
        player.invuln = 0.28;
        addDashBurst(player.x, player.y, Math.atan2(my, mx));
        dashCharges = Math.max(0, dashCharges - 1);
        if (dashCharges <= 0) dashRecharge = 5;
      }
      if (isMobile && mobileControls.dodge) mobileControls.dodge = false;
      const speed = (player.dodge > 0 ? 520 : 190) * PLAYER_SPEED_SCALE;
      const beforeX = player.x;
      const beforeY = player.y;
      moveCircle(player, mx * speed * dt, my * speed * dt);
      player.moveX = mx;
      player.moveY = my;
      player.isMoving = Math.hypot(player.x - beforeX, player.y - beforeY) > 0.35;
      const aimTarget = currentAimTarget(screenToWorld(mouse.x, mouse.y));
      player.angle = Math.atan2(aimTarget.y - player.y, aimTarget.x - player.x);
      updateCamera(dt, isMobile ? mobileAimWorldTarget() : aimTarget);
      updateAimRay(isMobile ? mobileAimWorldTarget() : aimTarget);
      const guestAimTarget = isMobile ? mobileAimWorldTarget() : aimTarget;
      updateHealerGuest(dt, guestAimTarget);
      const guestShooting = mouse.down || (isMobile && mobileControls.shoot && selectedWeapon !== "ice" && selectedWeapon !== "flamer" && selectedWeapon !== "barricade");
      if (guestShooting && coop.guestClass !== "healer") {
        if (selectedWeapon === "rifle") coopGuestFireVisual(guestAimTarget);
        else if (selectedWeapon === "flamer") firePlayerFlamer();
      }
      if (!isMobile && mouse.down && selectedWeapon === "ice") fireIceStorm();
      if (mouse.right || keys.has("KeyQ")) throwBomb(isMobile ? mobileAimWorldTarget() : aimTarget);
      coopGuestCollectPickups();
      coopUpdateGuestEffects(dt);
    }

    function updateHealerGuest(dt, aimTarget) {
      if (coop.guestClass !== "healer") {
        healerActive = false;
        healerMode = "none";
        healerPath = null;
        return;
      }
      if (healerReload > 0) {
        healerReload = Math.max(0, healerReload - dt);
        healerActive = false;
        healerMode = "none";
        healerPath = null;
        if (healerReload <= 0) healerEnergy = 10;
        return;
      }
      const host = coop.remote;
      healerTargetX = aimTarget ? aimTarget.x : player.x;
      healerTargetY = aimTarget ? aimTarget.y : player.y;
      let target = null;
      let mode = "none";
      if (host && (host.hp || 0) > 0 && host.hp < 100 && Math.hypot(healerTargetX - host.x, healerTargetY - host.y) <= HEAL_TARGET_RADIUS) {
        target = host;
        mode = "ally";
      } else {
        let bestEnemy = null;
        let bestD = Infinity;
        for (const enemy of enemies) {
          if ((enemy.hp || 0) <= 0) continue;
          const d = dist2(healerTargetX, healerTargetY, enemy.x, enemy.y);
          if (d < bestD) {
            bestD = d;
            bestEnemy = enemy;
          }
        }
        if (bestEnemy && bestD <= HEAL_TARGET_RADIUS * HEAL_TARGET_RADIUS) {
          target = bestEnemy;
          mode = "enemy";
        }
      }
      const available = healerEnergy > 0 || healerReserve > 0 || mode === "enemy";
      const path = target && available ? findHealPath(player.x, player.y, target.x, target.y, HEAL_PATH_MAX) : null;
      healerPath = path;
      healerMode = path ? mode : "none";
      healerActive = !!path;
      if (healerActive) {
        if (healerMode === "enemy") {
          const amount = HEAL_DRAIN_RATE * dt;
          target.hp = Math.max(0, (Number(target.hp) || 0) - amount);
          target.hitFlash = 0.14;
          if (player.hp < 100) player.hp = Math.min(100, player.hp + amount * 0.78);
          else healerReserve = Math.min(HEAL_RESERVE_MAX, healerReserve + dt * HEAL_RESERVE_GAIN);
          healerActionTimer -= dt;
          if (healerActionTimer <= 0) {
            healerActionTimer = 0.15;
            const action = coopRememberAction("healerDrain", { x: target.x, y: target.y });
            action.amount = HEAL_DRAIN_RATE * 0.15;
            coopSendNow();
          }
          if (target.hp <= 0) {
            const index = enemies.indexOf(target);
            if (index >= 0) killEnemy(target, index);
          }
          voiceCommandStatus = player.hp < 100 ? "DRAIN HP" : "RESERVE +" + healerReserve.toFixed(1) + "s";
        } else {
          const spend = dt;
          if (healerEnergy > 0) healerEnergy = Math.max(0, healerEnergy - spend);
          else healerReserve = Math.max(0, healerReserve - spend);
          voiceCommandStatus = "HEAL " + Math.ceil(healerEnergy + healerReserve) + "s";
          if (healerEnergy <= 0 && healerReserve <= 0) {
            healerReload = 3.5;
            healerActive = false;
            healerMode = "none";
            healerPath = null;
            voiceCommandStatus = "HEAL RELOAD";
            voiceCommandStatusTimer = 1.1;
          }
        }
        voiceCommandStatusTimer = 0.25;
        healerPlusTimer -= dt;
        if (healerPlusTimer <= 0) {
          healerPlusTimer = 0.28;
          addHealPlus(target.x, target.y, healerMode !== "enemy");
        }
      } else {
        healerMode = "none";
        healerPlusTimer = Math.min(healerPlusTimer, 0.1);
      }
    }

    function coopIsHostWorldClient() {
      return coop.connected && coop.role === "guest";
    }

    function drawRemoteCoopPeer() {
      const peers = coopRemotePeers();
      if (!peers.length) return;
      for (let i = 0; i < peers.length; i++) {
        const remote = peers[i];
        ctx.save();
        ctx.globalAlpha = 0.86;
        ctx.translate(remote.x, remote.y);
        ctx.rotate(remote.angle);
        ctx.shadowColor = "rgba(80,180,255,0.65)";
        ctx.shadowBlur = 16;
        drawTacticalHuman(23, false, remote.weapon !== "bomb", remote.guestClass === "healer" ? "healer" : (remote.weapon === "flamer" ? "flamer" : "shooter"));
        ctx.restore();
        ctx.save();
        ctx.strokeStyle = "rgba(100,200,255,0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(remote.x, remote.y, 31, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = "#9ed8ff";
        ctx.font = "800 11px Arial";
        ctx.textAlign = "center";
        ctx.fillText(remote.guestClass === "healer" ? "HEALER" : (i === 0 ? "ALLY" : ("ALLY " + (i + 1))), remote.x, remote.y - 36);
        bar(remote.x - 24, remote.y - 31, 48, 5, remote.hp / 100, "#56b7ff", "#123044");
        ctx.restore();
      }
    }

    function drawCoopHealLinks() {
      if (coop.role === "host") {
        for (const remote of coopRemotePeers()) {
          if (remote.guestClass === "healer" && remote.healActive && (remote.hp || 0) > 0 && remote.healPath) {
            drawHealBeam(remote.healPath);
          }
        }
      } else if (localHealerLinkVisible()) {
        if (healerMode === "enemy" && healerPath) drawHealBeam(healerPath);
        else if (coop.remote && (coop.remote.hp || 0) > 0) drawHealBeam(healerPath || [player, coop.remote]);
      }
    }

    function localHealerLinkVisible() {
      if (coop.role !== "guest" || coop.guestClass !== "healer" || !healerActive) return false;
      if (healerMode === "enemy") return !!healerPath;
      return !!coop.remote && (coop.remote.hp || 0) > 0;

    function drawHealBeam(pathOrX1, y1, x2, y2) {
      const path = Array.isArray(pathOrX1) ? pathOrX1 : [{ x: pathOrX1, y: y1 }, { x: x2, y: y2 }];
      if (!path || path.length < 2) return;
      const t = performance.now() * 0.006;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round";
      for (let pass = 0; pass < 3; pass++) {
        ctx.beginPath();
        let first = true;
        for (let seg = 1; seg < path.length; seg++) {
          const a = path[seg - 1];
          const b = path[seg];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const d = Math.hypot(dx, dy) || 1;
          const nx = -dy / d;
          const ny = dx / d;
          for (let i = 0; i <= 10; i++) {
            const p = i / 10;
            const globalP = (seg - 1 + p) / Math.max(1, path.length - 1);
            const wave = Math.sin(globalP * Math.PI * 7 + t + pass * 1.7) * (5 + pass * 2);
            const bow = Math.sin(p * Math.PI) * (pass + 1) * 2.6;
            const x = a.x + dx * p + nx * (wave + bow);
            const y = a.y + dy * p + ny * (wave + bow);
            if (first) {
              ctx.moveTo(x, y);
              first = false;
            } else ctx.lineTo(x, y);
          }
        }
        ctx.strokeStyle = pass === 0 ? "rgba(105,255,190,0.32)" : pass === 1 ? "rgba(170,235,255,0.42)" : "rgba(255,255,255,0.62)";
        ctx.lineWidth = pass === 0 ? 9 : pass === 1 ? 5 : 2;
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(150,255,205,0.32)";
      const total = Math.max(1, healPathLength(path));
      for (let i = 0; i < 5; i++) {
        let travel = ((t * 0.18 + i * 0.2) % 1) * total;
        let point = path[path.length - 1];
        let normal = { x: 0, y: 1 };
        for (let seg = 1; seg < path.length; seg++) {
          const a = path[seg - 1];
          const b = path[seg];
          const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
          if (travel <= len) {
            const p = travel / len;
            normal = { x: -(b.y - a.y) / len, y: (b.x - a.x) / len };
            point = { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p };
            break;
          }
          travel -= len;
        }
        ctx.beginPath();
        ctx.arc(point.x + normal.x * Math.sin(i + t) * 8, point.y + normal.y * Math.sin(i + t) * 8, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    async function toggleFullscreen() {
      const doc = document;
      const el = document.documentElement;
      const active = doc.fullscreenElement || doc.webkitFullscreenElement;
      try {
        if (active) {
          if (doc.exitFullscreen) await doc.exitFullscreen();
          else if (doc.webkitExitFullscreen) doc.webkitExitFullscreen();
          document.body.classList.remove("app-fullscreen");
          virtualFullscreen = false;
          resize();
          showGameToast("FULLSCREEN OFF");
          return;
        }
        if (el.requestFullscreen) {
          await el.requestFullscreen({ navigationUI: "hide" });
          hideBrowserChrome();
          showGameToast("FULLSCREEN ON");
          return;
        }
        if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
          hideBrowserChrome();
          showGameToast("FULLSCREEN ON");
          return;
        }
      } catch (err) {
        virtualFullscreen = !virtualFullscreen;
        document.body.classList.toggle("app-fullscreen", virtualFullscreen);
        resize();
        showGameToast(virtualFullscreen ? "FULLSCREEN ON" : "FULLSCREEN OFF");
        return;
      }
      virtualFullscreen = !virtualFullscreen;
      document.body.classList.toggle("app-fullscreen", virtualFullscreen);
      resize();
      if (virtualFullscreen) hideBrowserChrome();
      showGameToast(virtualFullscreen ? "FULLSCREEN ON" : "FULLSCREEN OFF");
    }

    function hideBrowserChrome() {
      document.body.classList.add("app-fullscreen");
      setTimeout(() => {

        resize();

      setTimeout(() => {
        window.scrollTo(0, 1);

        toast.style.cssText = [
          "position:fixed",
          "left:50%",
          "bottom:calc(96px + env(safe-area-inset-bottom, 0px))",
          "transform:translateX(-50%) translateY(8px)",
          "z-index:10050",
          "max-width:calc(100vw - 32px)",
          "padding:10px 14px",
          "border-radius:10px",
          "font:900 13px Arial,sans-serif",
          "letter-spacing:.4px",
          "pointer-events:none",
          "opacity:0",
          "transition:opacity .18s ease, transform .18s ease"
        ].join(";");
        document.body.appendChild(toast);
      }
      toast.textContent = text;
      toast.style.background = ok ? "rgba(24, 55, 82, .92)" : "rgba(90, 32, 28, .92)";
      toast.style.color = ok ? "#d9f2ff" : "#ffe2d8";
      toast.style.border = ok ? "1px solid rgba(120,190,255,.75)" : "1px solid rgba(255,150,130,.75)";
      toast.style.opacity = "1";

      clearTimeout(toast._timer);

    }
