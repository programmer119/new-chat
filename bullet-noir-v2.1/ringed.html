        const path = pvpLanePaths[lane];
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) ctx.lineTo(path[i].x, path[i].y);
        ctx.strokeStyle = lane === "mid" ? "rgba(210,220,225,.16)" : "rgba(210,220,225,.12)";
        ctx.lineWidth = lane === "mid" ? 84 : 72;
        ctx.stroke();
        ctx.strokeStyle = "rgba(240,246,255,.34)";
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      for (const base of pvpBases) {
        const g = ctx.createRadialGradient(base.x, base.y, 20, base.x, base.y, base.r);
        g.addColorStop(0, pvpTeamColor(base.team, 0.16));
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(base.x, base.y, base.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = pvpTeamColor(base.team, 0.52);
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(base.x, base.y, base.r * 0.78, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPvpHealth(x, y, w, value, max, team) {
      const pct = clamp((value || 0) / (max || 1), 0, 1);
      ctx.fillStyle = "rgba(0,0,0,.72)";
      ctx.fillRect(x - w / 2, y, w, 5);
      ctx.fillStyle = pvpTeamColor(team, 0.95);
      ctx.fillRect(x - w / 2, y, w * pct, 5);
    }

    function drawPvpEntities() {
      if (currentMapMode !== "pvp") return;
      ctx.save();
      for (const base of pvpBases) {
        ctx.fillStyle = pvpTeamColor(base.team, 0.22);
        ctx.strokeStyle = pvpTeamColor(base.team, 0.8);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(base.x, base.y, 44, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(245,245,235,.92)";
        ctx.font = "900 18px Arial";
        ctx.textAlign = "center";
        ctx.fillText(base.team === "blue" ? "BASE A" : "BASE B", base.x, base.y + 7);
        drawPvpHealth(base.x, base.y + 58, 118, base.hp, base.maxHp, base.team);
      }
      for (const tower of pvpTowers) {
        ctx.save();
        ctx.translate(tower.x, tower.y);
        if (tower.hitFlash > 0) ctx.shadowBlur = 18, ctx.shadowColor = "#fff";
        ctx.fillStyle = "rgba(12,14,18,.95)";
        ctx.strokeStyle = pvpTeamColor(tower.team, 0.95);
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, tower.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(245,245,235,.78)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-tower.r * 0.55, 0);
        ctx.lineTo(tower.r * 0.55, 0);
        ctx.moveTo(0, -tower.r * 0.55);
        ctx.lineTo(0, tower.r * 0.55);
        ctx.stroke();
        ctx.restore();
        drawPvpHealth(tower.x, tower.y + tower.r + 8, 72, tower.hp, tower.maxHp, tower.team);
      }
      for (const m of pvpMinions) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.angle || 0);
        ctx.fillStyle = pvpTeamColor(m.team, 0.82);
        ctx.strokeStyle = "rgba(255,255,255,.48)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, m.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.76)";
        ctx.fillRect(3, -3, 13, 6);
        ctx.restore();
        drawPvpHealth(m.x, m.y + 17, 34, m.hp, m.maxHp, m.team);
      }
      ctx.restore();
    }

    function drawFacility() {
      for (const wall of walls) drawWall(wall);
      for (const door of doors) drawDoor(door);
    }

    function drawWall(wall) {
      ctx.fillStyle = "#050607";
      ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
      ctx.strokeStyle = "#a6abb3";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(wall.x, wall.y);
      ctx.lineTo(wall.x + wall.w, wall.y);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.beginPath();
      ctx.moveTo(wall.x, wall.y + wall.h);
      ctx.lineTo(wall.x + wall.w, wall.y + wall.h);
      ctx.stroke();
    }

    function drawDoor(door) {
      if (door.open > 0.92) return;
      const cx = door.x + door.w / 2;
      const cy = door.y + door.h / 2;
      ctx.save();
      ctx.strokeStyle = door.open > 0.72 ? "rgba(210,230,245,0.18)" : (door.target ? "#d8e8ff" : "#75808b");
      ctx.lineWidth = 2;
      ctx.strokeRect(door.x + 1, door.y + 1, door.w - 2, door.h - 2);
      ctx.fillStyle = door.target ? "rgba(128, 210, 255, 0.75)" : "rgba(255, 255, 255, 0.16)";
      if (door.axis === "h") {
        if (door.open < 0.72) ctx.fillRect(cx - 22, door.y - 5, 44 * door.open, 3);
      } else {
        if (door.open < 0.72) ctx.fillRect(door.x - 5, cy - 22, 3, 44 * door.open);
      }
      drawSplitDoorPanels(door);
      if (door.open > 0.08 && door.open < 0.94) {
        ctx.fillStyle = "rgba(145, 203, 255, 0.22)";
        ctx.beginPath();
        ctx.arc(cx, cy, 18 + door.open * 12, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSplitDoorPanels(door) {
      if (door.open > 0.92) return;
      ctx.fillStyle = door.target ? "#313a47" : "#101318";
      ctx.strokeStyle = "rgba(230,235,242,0.65)";
      ctx.lineWidth = 1.5;
      const rects = doorCollisionRects(door);
      for (const rect of rects) {
        if (rect.w <= 0.5 || rect.h <= 0.5) continue;
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        ctx.fillStyle = "rgba(255,255,255,0.28)";
        if (door.axis === "h") {
          ctx.fillRect(rect.x + rect.w - 7, rect.y + 6, 2, Math.max(4, rect.h - 12));
        } else {
          ctx.fillRect(rect.x + 6, rect.y + rect.h - 7, Math.max(4, rect.w - 12), 2);
        }
        ctx.fillStyle = door.target ? "#313a47" : "#101318";
      }
    }

    function drawProps() {
      for (const p of props) {
        ensurePropHealth(p);
        const img = assets[p.type];
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        if (p.type === "barricade") {
          drawBarricadeProp(p);
        } else if (img) {
          const s = 48 * p.s;
          ctx.drawImage(img, -s / 2, -s / 2, s, s * img.height / img.width);
        } else if (p.type === "crate") {
          const s = 48 * p.s;
          drawCrateFallback(s);
        }
        ctx.restore();
      }
    }

    function drawBlockingPropOverlays() {
      for (const p of props) {
        if (!propBlocksMovement(p)) continue;
        if (p.type === "barricade") continue;
        ensurePropHealth(p);
        const img = assets[p.type];
        const s = 48 * p.s;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.globalAlpha = 0.88;
        if (img) ctx.drawImage(img, -s / 2, -s / 2, s, s * img.height / img.width);
        else drawCrateFallback(s);
        drawCrateDamage(p, s);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(235, 238, 230, 0.72)";
        ctx.lineWidth = 1.6;
        ctx.strokeRect(-s / 2 + 3, -s / 2 + 3, s - 6, s - 6);
        ctx.restore();
      }
    }

    function drawCrateFallback(s) {
      ctx.fillStyle = "#5b5146";
      ctx.fillRect(-s / 2, -s / 2, s, s);
      ctx.strokeStyle = "#c3b7a5";
      ctx.lineWidth = 2;
      ctx.strokeRect(-s / 2, -s / 2, s, s);
      ctx.beginPath();
      ctx.moveTo(-s * 0.34, -s * 0.34);
      ctx.lineTo(s * 0.34, s * 0.34);
      ctx.moveTo(s * 0.34, -s * 0.34);
      ctx.lineTo(-s * 0.34, s * 0.34);
      ctx.stroke();
    }

    function drawCrateDamage(prop, s) {
      ensurePropHealth(prop);
      const damage = 1 - prop.hp / prop.maxHp;
      if (damage <= 0.02 && !prop.hitFlash) return;
      ctx.save();
      ctx.globalAlpha = 0.35 + damage * 0.45 + (prop.hitFlash || 0) * 1.8;
      ctx.strokeStyle = "rgba(20, 12, 8, 0.95)";
      ctx.lineWidth = 1.5 + damage * 2;
      const cracks = Math.ceil(damage * 5);
      for (let i = 0; i < cracks; i++) {
        const x = -s * 0.32 + i * s * 0.16;
        ctx.beginPath();
        ctx.moveTo(x, -s * 0.36);
        ctx.lineTo(x + s * 0.12, -s * 0.1 + i * 3);
        ctx.lineTo(x - s * 0.02, s * 0.34);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBarricadeProp(prop) {
      ensurePropHealth(prop);
      const w = prop.w || 82;
      const h = prop.h || 24;
      const build = prop.buildTime > 0 ? 1 - prop.buildTime / 3 : 1;
      const damage = 1 - prop.hp / prop.maxHp;
      ctx.save();
      ctx.globalAlpha = 0.42 + build * 0.58;
      ctx.fillStyle = prop.hitFlash > 0 ? "rgba(255, 238, 190, 0.96)" : "rgba(76, 82, 86, 0.96)";
      ctx.strokeStyle = "rgba(226, 236, 240, 0.82)";
      ctx.lineWidth = 2;
      roundRect(-w / 2, -h / 2, w, h, 5);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(20,24,28,0.72)";
      ctx.lineWidth = 3;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(-w * 0.36, i * h * 0.22);
        ctx.lineTo(w * 0.36, i * h * 0.22);
        ctx.stroke();
      }
      if (damage > 0.05) {
        ctx.strokeStyle = "rgba(8, 10, 12, " + (0.55 + damage * 0.35) + ")";
        ctx.lineWidth = 1.3 + damage * 2;
        for (let i = 0; i < Math.ceil(damage * 5); i++) {
          ctx.beginPath();
          ctx.moveTo(-w * 0.35 + i * w * 0.16, -h * 0.34);
          ctx.lineTo(-w * 0.2 + i * w * 0.12, h * 0.28);
          ctx.stroke();
        }
      }
      if (prop.buildTime > 0) {
        const bang = Math.sin(performance.now() * 0.018) * 0.5 + 0.5;
        ctx.fillStyle = "rgba(255, 230, 140, " + (0.35 + bang * 0.35) + ")";
        ctx.beginPath();
        ctx.arc(-w * 0.38 + bang * w * 0.76, -h * 0.8, 5 + bang * 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawBarricadePreview() {
      if (selectedWeapon !== "barricade" || barricadeCount <= 0) return;
      if (isMobile && !mobileControls.shoot) return;
      const { prop, valid } = barricadePlacement();
      ctx.save();
      ctx.translate(prop.x, prop.y);
      ctx.rotate(prop.a);
      ctx.globalAlpha = valid ? 0.62 : 0.72;
      ctx.fillStyle = valid ? "rgba(190, 230, 245, 0.38)" : "rgba(255, 58, 48, 0.36)";
      ctx.strokeStyle = valid ? "rgba(225,245,255,0.9)" : "rgba(255, 95, 80, 0.95)";
      ctx.lineWidth = 2.2;
      roundRect(-prop.w / 2, -prop.h / 2, prop.w, prop.h, 5);
      ctx.fill();
      ctx.stroke();
      ctx.globalAlpha = 1;
      if (!valid) {
        ctx.beginPath();
        ctx.moveTo(-prop.w * 0.42, -prop.h * 0.42);
        ctx.lineTo(prop.w * 0.42, prop.h * 0.42);
        ctx.moveTo(prop.w * 0.42, -prop.h * 0.42);
        ctx.lineTo(-prop.w * 0.42, prop.h * 0.42);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawDashBursts() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const burstItem of dashBursts) {
        const alpha = Math.max(0, burstItem.life / burstItem.maxLife);
        ctx.save();
        ctx.translate(burstItem.x, burstItem.y);
        ctx.rotate(burstItem.angle);
        ctx.strokeStyle = "rgba(210, 242, 255, " + (0.66 * alpha) + ")";
        ctx.fillStyle = "rgba(145, 210, 255, " + (0.18 * alpha) + ")";
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const offset = (i - 1.5) * 12;
          ctx.beginPath();
          ctx.moveTo(-34 - i * 8, offset);
          ctx.lineTo(-4, offset * 0.35);
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.ellipse(0, 0, 34 + (1 - alpha) * 18, 18 + (1 - alpha) * 8, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawFixtureBodies() {
      for (const f of fixtures) {
        const boost = fixtureBoost;
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.fillStyle = "rgba(8, 9, 10, 0.82)";
        ctx.fillRect(-f.w / 2 - 5, -f.h / 2 - 4, f.w + 10, f.h + 8);
        ctx.fillStyle = "rgba(255, 248, 235, " + (0.86 + boost * 0.14) + ")";
        ctx.shadowColor = "rgba(255, 230, 210, " + (0.75 + boost * 0.25) + ")";
        ctx.shadowBlur = 10 + boost * 34;
        ctx.fillRect(-f.w / 2, -f.h / 2, f.w, f.h);
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(255,255,255," + (0.5 + boost * 0.42) + ")";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-f.w / 2 + 1, -f.h / 2 + 1, f.w - 2, f.h - 2);
        ctx.restore();
      }
    }

    function drawCorpses() {
      for (const c of corpses) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.angle);
        ctx.globalAlpha = 0.5;
        const stain = ctx.createRadialGradient(0, 8, 4, 0, 8, 42 * c.stain);
        stain.addColorStop(0, "rgba(70, 12, 13, 0.34)");
        stain.addColorStop(0.52, "rgba(48, 8, 8, 0.16)");
        stain.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = stain;
        ctx.beginPath();
        ctx.ellipse(0, 10, 34 * c.stain, 20 * c.stain, 0.18 * c.pose, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.82;
        ctx.fillStyle = "rgba(4, 5, 6, 0.96)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(0, 0, c.r * 0.82, c.r * 1.25, 0.12 * c.pose, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        drawLimb(-c.r * 0.55, -c.r * 0.1, -c.r * 1.28, c.r * 0.18, 7);
        drawLimb(c.r * 0.56, -c.r * 0.05, c.r * 1.18, c.r * 0.25, 7);
        drawLimb(-c.r * 0.32, c.r * 0.8, -c.r * 0.85, c.r * 1.62, 8);
        drawLimb(c.r * 0.34, c.r * 0.82, c.r * 1.02, c.r * 1.52, 8);
        ctx.beginPath();
        ctx.arc(0, -c.r * 1.08, c.r * 0.48, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawDeathTexts() {
      for (const text of deathTexts) {
        const t = 1 - Math.max(0, text.life / text.maxLife);
        const pop = t < 0.24 ? t / 0.24 : 1;
        const fade = t > 0.62 ? 1 - (t - 0.62) / 0.38 : 1;
        const scaleText = (0.45 + Math.sin(pop * Math.PI * 0.5) * 0.92) * Math.max(0, fade);
        ctx.save();
        ctx.translate(text.x, text.y - t * 22);
        ctx.rotate(text.angle);
        ctx.scale(scaleText, scaleText);
        ctx.globalAlpha = Math.max(0, fade);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "900 30px Arial Black, Arial";
        ctx.lineJoin = "round";
        ctx.lineWidth = 8;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.strokeText("DIE", 0, 0);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0,0,0,0.95)";
        ctx.strokeText("DIE", 0, 0);
        ctx.fillStyle = "rgba(8,8,10,0.98)";
        ctx.fillText("DIE", 0, 0);
        ctx.restore();
      }
    }

    function drawSpeechBubbles() {
      for (const bubble of speechBubbles) {
        if (bubble.delay > 0) continue;
        const alpha = Math.max(0, Math.min(1, bubble.life / bubble.maxLife));
        const pop = Math.min(1, (bubble.maxLife - bubble.life) / 0.16);
        ctx.save();
        if (bubble.screen) {
          ctx.setTransform(scale, 0, 0, scale, 0, 0);
          ctx.translate(width / 2, 132 - (1 - alpha) * 10);
        } else {
          const enemy = bubble.enemy;
          ctx.translate(enemy.x, enemy.y - enemy.r - 34 - (1 - alpha) * 12);
        }
        ctx.scale(0.72 + pop * 0.28, 0.72 + pop * 0.28);
        ctx.globalAlpha = alpha;
        ctx.font = bubble.screen ? "900 17px Arial" : "900 15px Arial";
        const w = Math.max(62, ctx.measureText(bubble.text).width + 22);
        const h = bubble.screen ? 34 : 28;
        ctx.fillStyle = bubble.screen ? "rgba(40, 12, 10, 0.92)" : "rgba(238, 242, 244, 0.94)";
        ctx.strokeStyle = bubble.screen ? "rgba(255, 210, 170, 0.92)" : "rgba(0, 0, 0, 0.82)";
        ctx.lineWidth = 3;
        roundRect(-w / 2, -h / 2, w, h, 7);
        ctx.fill();
        ctx.stroke();
        if (!bubble.screen) {
          ctx.beginPath();
          ctx.moveTo(-8, h / 2 - 2);
          ctx.lineTo(0, h / 2 + 10);
          ctx.lineTo(8, h / 2 - 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        ctx.fillStyle = bubble.screen ? "#ffe2c2" : "#111";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(bubble.text, 0, 1);
        ctx.restore();
      }
    }

    function drawPickups() {
      for (const p of pickups) {
        const pulse = 0.5 + Math.sin(p.pulse) * 0.5;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.globalCompositeOperation = "lighter";
        const color = pickupColor(p.type);
        const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 34 + pulse * 8);
        glow.addColorStop(0, color + "66");
        glow.addColorStop(1, color + "00");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = p.type === "heal" ? "rgba(24, 45, 32, 0.96)" : "rgba(28, 32, 38, 0.96)";
        ctx.strokeStyle = "rgba(210, 255, 218, 0.86)";
        ctx.lineWidth = 2;
        if (p.type === "barricade") {
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(-24, -10, 48, 20, 4) : ctx.rect(-24, -10, 48, 20);
          ctx.fill();
          ctx.strokeStyle = "rgba(230, 244, 250, 0.95)";
          ctx.stroke();
          ctx.strokeStyle = "rgba(160, 212, 230, 0.85)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(-16, -5);
          ctx.lineTo(-16, 5);
          ctx.moveTo(0, -6);
          ctx.lineTo(0, 6);
          ctx.moveTo(16, -5);
          ctx.lineTo(16, 5);
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.font = "900 10px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("BARR", 0, 17);
        } else {
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(-11, -14, 22, 28, 5) : ctx.rect(-11, -14, 22, 28);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = color;
          ctx.font = "900 16px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(pickupLabel(p.type), 0, 1);
        }
        ctx.restore();
      }
    }

    function drawLimb(x1, y1, x2, y2, widthSize) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(5, 6, 7, 0.98)";
      ctx.lineWidth = widthSize;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo((x1 + x2) / 2, (y1 + y2) / 2 + 6);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawPlayer() {
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);
      if (player.invuln > 0) ctx.globalAlpha = 0.65 + Math.sin(performance.now() * 0.04) * 0.25;
      const localWeaponKind = coop.role === "guest" && coop.guestClass === "healer" ? "healer" : selectedWeapon;
      drawTacticalHuman(24, true, localWeaponKind !== "barricade", localWeaponKind);
      ctx.restore();
    }

    function drawEnemy(e) {
      e.maxHp = Number(e.maxHp) || enemyMaxHp(e.kind || "shooter", !!e.fast);
      e.hp = Number.isFinite(Number(e.hp)) ? Number(e.hp) : e.maxHp;
      ctx.save();
      ctx.translate(e.x, e.y);
      if (e.dropTime > 0) {
        const t = Math.max(0, e.dropTime / e.dropMax);
        const height = e.dropHeight * t;
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = "#000";
        ctx.beginPath();
        ctx.ellipse(0, 14, e.r * (1.1 - t * 0.35), e.r * 0.42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        drawParachute(height, t);
        ctx.translate(0, -height);
      }
      ctx.rotate(Math.atan2(player.y - e.y, player.x - e.x));
      drawTacticalHuman(e.r, false, e.kind !== "melee", e.kind);
      if (e.raidAggressive) drawRaidUnitOverlay(e);
      if (e.freeze > 0) drawFrozenOverlay(e);
      ctx.restore();
      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(e.x - 18, e.y - e.r - 16, 36, 4);
      ctx.fillStyle = e.raidLeader ? "#ff4a32" : (e.raidAggressive ? "#51b8ff" : (e.kind === "melee" ? "#cf6b4e" : (e.kind === "flamer" ? "#ef8a3a" : (e.fast ? "#ddbb55" : "#9fd06d"))));
      ctx.fillRect(e.x - 18, e.y - e.r - 16, Math.max(0, 36 * e.hp / e.maxHp), 4);
    }

    function drawFrozenOverlay(e) {
      const crackPhase = e.freeze < 3 ? 1 - e.freeze / 3 : 0;
      ctx.save();
      ctx.globalAlpha = 0.48;
      ctx.fillStyle = "rgba(172, 232, 255, 0.78)";
      ctx.strokeStyle = "rgba(230, 252, 255, 0.9)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(0, 0, e.r * 0.82, e.r * 1.05, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      if (crackPhase > 0) {
        ctx.globalAlpha = 0.35 + crackPhase * 0.45;
        ctx.strokeStyle = "rgba(255,255,255,0.95)";
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const y = -e.r * 0.55 + i * e.r * 0.26;
          ctx.moveTo(-e.r * 0.42, y);
          ctx.lineTo(-e.r * 0.08 + crackPhase * e.r * 0.2, y + e.r * 0.14);
          ctx.lineTo(e.r * 0.38, y - e.r * 0.06);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawRaidUnitOverlay(e) {
      const r = e.r;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (e.raidLeader) {
        ctx.strokeStyle = "rgba(255, 72, 48, 0.92)";
        ctx.fillStyle = "rgba(52, 10, 9, 0.82)";
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-r * 0.38, -r * 0.64);
        ctx.lineTo(r * 0.12, -r * 0.76);
        ctx.lineTo(r * 0.56, -r * 0.42);
        ctx.lineTo(r * 0.2, -r * 0.28);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 188, 92, 0.95)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-r * 0.12, -r * 0.62);
        ctx.lineTo(r * 0.28, -r * 0.46);
        ctx.stroke();
      } else {
        ctx.strokeStyle = "rgba(86, 184, 255, 0.86)";
        ctx.fillStyle = "rgba(10, 22, 32, 0.72)";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(-r * 0.28, -r * 0.56);
        ctx.lineTo(r * 0.22, -r * 0.64);
        ctx.lineTo(r * 0.5, -r * 0.28);
        ctx.lineTo(-r * 0.04, -r * 0.22);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
      ctx.fillStyle = e.raidLeader ? "rgba(255, 220, 135, 0.95)" : "rgba(136, 216, 255, 0.94)";
      ctx.beginPath();
      ctx.ellipse(r * 0.48, -r * 0.05, r * 0.18, r * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = e.raidLeader ? "rgba(255, 70, 42, 0.88)" : "rgba(70, 180, 255, 0.72)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-r * 0.44, r * 0.02);
      ctx.lineTo(-r * 0.08, r * 0.02);
      ctx.moveTo(-r * 0.42, r * 0.2);
      ctx.lineTo(-r * 0.02, r * 0.2);
      ctx.stroke();
      ctx.restore();
    }

    function drawParachute(height, t) {
      ctx.save();
      ctx.translate(0, -height - 42);
      ctx.globalAlpha = 0.94;
      ctx.fillStyle = "rgba(226, 231, 232, 0.88)";
      ctx.strokeStyle = "rgba(20, 24, 28, 0.78)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-38, 0);
      ctx.quadraticCurveTo(-26, -30 - t * 10, 0, -34 - t * 12);
      ctx.quadraticCurveTo(26, -30 - t * 10, 38, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(230,235,238,0.72)";
      ctx.lineWidth = 1.2;
      for (const x of [-26, -10, 10, 26]) {
        ctx.beginPath();
        ctx.moveTo(x, -2);
        ctx.lineTo(0, height + 36);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBullet(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      drawImageStretched(assets.bullet, 0, 0, 22, 8);
      ctx.restore();
    }

    function drawBomb(b) {
      const t = 1 - Math.max(0, b.life / b.maxLife);
      const arcHeight = Math.sin(t * Math.PI) * 42;
      ctx.save();
      ctx.translate(b.x, b.y - arcHeight);
      ctx.rotate(t * Math.PI * 4);
      drawBombSprite();
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(b.x, b.y + 8, 16 * (1 - t * 0.2), 8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawTacticalHuman(r, isPlayer, hasGun = true, weaponKind = "shooter") {
      const suit = isPlayer ? "rgba(26, 28, 32, 0.98)" : "rgba(5, 6, 7, 0.98)";
      const skin = isPlayer ? "rgba(226, 218, 212, 0.96)" : "rgba(8, 9, 10, 0.98)";
      const accent = isPlayer ? "rgba(255, 205, 205, 0.82)" : "rgba(255,255,255,0.13)";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.save();
      ctx.globalAlpha = 0.34;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(-r * 0.18, r * 0.15, r * 0.85, r * 0.5, 0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      const unitScale = 0.82;
      ctx.scale(unitScale, unitScale);

      ctx.strokeStyle = suit;
      ctx.lineWidth = r * 0.22;
      ctx.beginPath();
      ctx.moveTo(-r * 0.32, -r * 0.22);
      ctx.lineTo(-r * 0.86, -r * 0.52);
      ctx.moveTo(-r * 0.34, r * 0.2);
      ctx.lineTo(-r * 0.9, r * 0.5);
      ctx.stroke();

      ctx.strokeStyle = suit;
      ctx.lineWidth = r * 0.2;
      ctx.beginPath();
      ctx.moveTo(r * 0.04, -r * 0.28);
      ctx.lineTo(r * 0.58, -r * 0.44);
      ctx.moveTo(r * 0.04, r * 0.24);
      ctx.lineTo(r * 0.58, r * 0.42);
      ctx.stroke();

      ctx.fillStyle = suit;
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(-r * 0.08, 0, r * 0.5, r * 0.44, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.save();
      ctx.translate(r * 0.42, 0);
      if (hasGun) drawWeapon(isPlayer, weaponKind);
      ctx.restore();

      ctx.fillStyle = skin;
      ctx.strokeStyle = isPlayer ? "rgba(255,255,255,0.74)" : "rgba(255,255,255,0.1)";
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.arc(r * 0.38, 0, r * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (isPlayer) {
        ctx.fillStyle = "rgba(218, 220, 225, 0.92)";
        ctx.beginPath();
        ctx.arc(r * 0.3, -r * 0.08, r * 0.3, Math.PI * 0.6, Math.PI * 1.9);
        ctx.fill();
        ctx.strokeStyle = "rgba(244, 190, 196, 0.8)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-r * 0.12, -r * 0.32);
        ctx.lineTo(-r * 0.42, -r * 0.58);
        ctx.stroke();
      }
    }

    function drawWeapon(isPlayer, weaponKind) {
      if (weaponKind === "healer") {
        ctx.save();
        ctx.strokeStyle = "rgba(150,255,205,0.94)";
        ctx.fillStyle = "rgba(190,255,225,0.9)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(18, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(21, 0, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.82)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(21, -8);
        ctx.lineTo(21, 8);
        ctx.moveTo(13, 0);
        ctx.lineTo(29, 0);
        ctx.stroke();
        ctx.restore();
        return;
      }
      if (weaponKind === "flamer") {
        drawFlamethrower(isPlayer);
        return;
      }
      if (weaponKind === "bomb") {
        drawHeldBomb();
        return;
      }
      if (weaponKind === "ice") {
        drawIceStormGun(isPlayer);
        return;
      }
      drawRifle(isPlayer);
    }

    function drawRifle(isPlayer) {
      ctx.fillStyle = isPlayer ? "rgba(238, 240, 242, 0.96)" : "rgba(225, 228, 232, 0.78)";
      ctx.strokeStyle = "rgba(0,0,0,0.72)";
      ctx.lineWidth = 1.4;
      ctx.fillRect(-4, -4, 34, 8);
      ctx.strokeRect(-4, -4, 34, 8);
      ctx.fillRect(28, -2, 16, 4);
      ctx.strokeRect(28, -2, 16, 4);
      ctx.beginPath();
      ctx.moveTo(7, 4);
      ctx.lineTo(13, 14);
      ctx.lineTo(20, 14);
      ctx.lineTo(16, 4);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function drawFlamethrower(isPlayer) {
      ctx.fillStyle = isPlayer ? "rgba(238, 240, 242, 0.96)" : "rgba(230, 224, 212, 0.82)";
      ctx.strokeStyle = "rgba(0,0,0,0.72)";
      ctx.lineWidth = 1.4;
      ctx.fillRect(-6, -5, 32, 10);
      ctx.strokeRect(-6, -5, 32, 10);
      ctx.fillStyle = "rgba(92, 98, 102, 0.9)";
      ctx.fillRect(23, -3, 21, 6);
      ctx.strokeRect(23, -3, 21, 6);
      ctx.fillStyle = "rgba(241, 119, 43, 0.9)";
      ctx.beginPath();
      ctx.ellipse(2, 11, 9, 5, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 169, 84, 0.85)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(42, 0);
      ctx.lineTo(50, 0);
      ctx.stroke();
    }

    function drawHeldBomb() {
      ctx.save();
      ctx.translate(18, 0);
      ctx.scale(0.86, 0.86);
      drawBombSprite();
      ctx.restore();
    }

    function drawIceStormGun(isPlayer) {
      ctx.fillStyle = isPlayer ? "rgba(226, 247, 255, 0.96)" : "rgba(180, 228, 244, 0.82)";
      ctx.strokeStyle = "rgba(5,18,25,0.78)";
      ctx.lineWidth = 1.4;
      ctx.fillRect(-5, -4, 30, 8);
      ctx.strokeRect(-5, -4, 30, 8);
      ctx.fillStyle = "rgba(122, 216, 255, 0.88)";
      ctx.beginPath();
      ctx.ellipse(24, 0, 10, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = "rgba(232, 252, 255, 0.94)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(33, -3);
      ctx.lineTo(44, -8);
      ctx.moveTo(33, 3);
      ctx.lineTo(44, 8);
      ctx.stroke();
    }

    function drawBombSprite() {
      ctx.fillStyle = "rgba(4, 5, 6, 0.98)";
      ctx.strokeStyle = "rgba(235,240,245,0.34)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.ellipse(0, 1, 9, 11, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "rgba(15, 18, 20, 0.95)";
      ctx.fillRect(-3, -12, 8, 5);
      ctx.strokeRect(-3, -12, 8, 5);
      ctx.strokeStyle = "rgba(255, 210, 120, 0.9)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(4, -12);
      ctx.quadraticCurveTo(13, -18, 17, -8);
      ctx.stroke();
    }

    function drawTracers() {
      ctx.save();
      ctx.lineCap = "round";
      for (const tr of tracers) {
        const alpha = Math.max(0, tr.life / tr.maxLife);
        ctx.strokeStyle = "rgba(255, 55, 46, " + (0.85 * alpha) + ")";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(tr.x1, tr.y1);
        ctx.lineTo(tr.x2, tr.y2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 235, 220, " + (0.45 * alpha) + ")";
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(tr.x1, tr.y1);
        ctx.lineTo(tr.x2, tr.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawEnemyTracers() {
      ctx.save();
      ctx.lineCap = "round";
      for (const tr of enemyTracers) {
        const alpha = Math.max(0, tr.life / tr.maxLife);
        ctx.strokeStyle = "rgba(255, 86, 54, " + (0.7 * alpha) + ")";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(tr.x1, tr.y1);
        ctx.lineTo(tr.x2, tr.y2);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255, 210, 185, " + (0.24 * alpha) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(tr.x1, tr.y1);
        ctx.lineTo(tr.x2, tr.y2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFlameBursts() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const flame of flameBursts) {
        const alpha = Math.max(0, flame.life / flame.maxLife);
        const age = 1 - alpha;
        const flicker = Math.sin(performance.now() * 0.05 + flame.x * 0.03) * 0.08;
        const len = flame.length * (0.72 + 0.28 * alpha + flicker);
        const spread = flame.spread * (1.05 + 0.42 * Math.sin(age * Math.PI));
        const a = flame.angle;
        const tipX = flame.x + Math.cos(a) * len;
        const tipY = flame.y + Math.sin(a) * len;
        const leftX = flame.x + Math.cos(a - spread) * len * 0.78;
        const leftY = flame.y + Math.sin(a - spread) * len * 0.78;
        const rightX = flame.x + Math.cos(a + spread) * len * 0.78;
        const rightY = flame.y + Math.sin(a + spread) * len * 0.78;
        const gradient = ctx.createLinearGradient(flame.x, flame.y, tipX, tipY);
        gradient.addColorStop(0, "rgba(255, 255, 232, " + (0.92 * alpha) + ")");
        gradient.addColorStop(0.18, "rgba(255, 214, 92, " + (0.84 * alpha) + ")");
        gradient.addColorStop(0.46, "rgba(255, 92, 24, " + (0.72 * alpha) + ")");
        gradient.addColorStop(0.78, "rgba(162, 32, 8, " + (0.36 * alpha) + ")");
        gradient.addColorStop(1, "rgba(60, 12, 5, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(flame.x, flame.y);
        ctx.quadraticCurveTo(
          flame.x + Math.cos(a - spread * 0.8) * len * 0.38,
          flame.y + Math.sin(a - spread * 0.8) * len * 0.38,
          leftX,
          leftY
        );
        ctx.quadraticCurveTo(tipX, tipY, rightX, rightY);
        ctx.quadraticCurveTo(
          flame.x + Math.cos(a + spread * 0.8) * len * 0.38,
          flame.y + Math.sin(a + spread * 0.8) * len * 0.38,
          flame.x,
          flame.y
        );
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(70, 15, 7, " + (0.16 * alpha) + ")";
        ctx.lineWidth = 18;
        ctx.beginPath();
        ctx.moveTo(flame.x - Math.cos(a) * 6, flame.y - Math.sin(a) * 6);
        ctx.lineTo(flame.x + Math.cos(a) * len * 0.82, flame.y + Math.sin(a) * len * 0.82);
        ctx.stroke();

        for (let i = 0; i < 7; i++) {
          const wave = Math.sin(performance.now() * 0.025 + i * 1.7 + flame.x * 0.01);
          const offset = (i - 3) * spread * 0.17 + wave * spread * 0.08;
          const tongueLen = len * (0.32 + i * 0.085);
          ctx.strokeStyle = i % 2 ? "rgba(255, 236, 142, " + (0.52 * alpha) + ")" : "rgba(255, 64, 18, " + (0.42 * alpha) + ")";
          ctx.lineWidth = Math.max(2, 9 - i * 0.75);
          ctx.beginPath();
          ctx.moveTo(flame.x, flame.y);
          ctx.quadraticCurveTo(
            flame.x + Math.cos(a + offset) * tongueLen * 0.5 + Math.cos(a + Math.PI / 2) * wave * 8,
            flame.y + Math.sin(a + offset) * tongueLen * 0.5 + Math.sin(a + Math.PI / 2) * wave * 8,
            flame.x + Math.cos(a + offset * 1.7) * tongueLen,
            flame.y + Math.sin(a + offset * 1.7) * tongueLen
          );
          ctx.stroke();
        }
        for (let i = 0; i < 14; i++) {
          const t = ((i * 0.071 + age * 1.8) % 1);
          const side = Math.sin(i * 12.989 + flame.x) * spread * len * 0.32 * t;
          const px = flame.x + Math.cos(a) * len * t + Math.cos(a + Math.PI / 2) * side;
          const py = flame.y + Math.sin(a) * len * t + Math.sin(a + Math.PI / 2) * side;
          const r = (5 + 13 * t) * alpha;
          const ember = ctx.createRadialGradient(px, py, 0, px, py, Math.max(1, r));
          ember.addColorStop(0, "rgba(255, 245, 178, " + (0.72 * alpha * (1 - t * 0.35)) + ")");
          ember.addColorStop(0.45, "rgba(255, 92, 18, " + (0.42 * alpha) + ")");
          ember.addColorStop(1, "rgba(80, 12, 5, 0)");
          ctx.fillStyle = ember;
          ctx.beginPath();
          ctx.arc(px, py, Math.max(1, r), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }

    function drawIceStorms() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const storm of iceStorms) {
        const alpha = Math.max(0, storm.life / storm.maxLife);
        const age = 1 - alpha;
        const shrink = storm.length / (storm.maxLength || storm.length || 1);
        const len = storm.length * (0.78 + 0.22 * alpha);
        const a = storm.angle;
        ctx.save();
        ctx.translate(storm.x, storm.y);
        ctx.rotate(a);
        const gradient = ctx.createLinearGradient(0, 0, len, 0);
        gradient.addColorStop(0, "rgba(245, 255, 255, " + (0.84 * alpha) + ")");
        gradient.addColorStop(0.18, "rgba(218, 246, 255, " + (0.62 * alpha) + ")");
        gradient.addColorStop(0.55, "rgba(138, 220, 255, " + (0.36 * alpha) + ")");
        gradient.addColorStop(1, "rgba(80, 180, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.34, -34 * shrink, len * 0.92, -66 * shrink);
        ctx.quadraticCurveTo(len * 0.84, -18 * shrink, len, 0);
        ctx.quadraticCurveTo(len * 0.84, 18 * shrink, len * 0.92, 66 * shrink);
        ctx.quadraticCurveTo(len * 0.34, 34 * shrink, 0, 0);
        ctx.fill();
        ctx.strokeStyle = "rgba(242, 255, 255, " + (0.5 * alpha) + ")";
        ctx.lineWidth = 2.3;
        for (let i = 0; i < 7; i++) {
          const t = (i + 1) / 8;
          const x = len * t;
          const wave = Math.sin(performance.now() * 0.018 + i * 1.8 + (storm.seed || 0));
          const r = (14 + 46 * t) * shrink * alpha;
          ctx.beginPath();
          ctx.arc(x, wave * 12 * t, r, -Math.PI * 0.18, Math.PI * 1.28);
          ctx.stroke();
        }
        for (let i = 0; i < 34; i++) {
          const seed = Math.sin((storm.seed || 0) + i * 19.17) * 10000;
          const t = (Math.abs(seed) + age * (0.75 + (i % 5) * 0.08)) % 1;
          const spread = (16 + t * 82) * shrink;
          const side = Math.sin(seed * 2.31 + age * 8) * spread;
          const x = len * t;
          const y = side;
          const size = (1.4 + (i % 4) * 0.8) * alpha;
          ctx.fillStyle = i % 3 === 0 ? "rgba(255,255,255," + (0.88 * alpha) + ")" : "rgba(165,232,255," + (0.68 * alpha) + ")";
          ctx.beginPath();
          ctx.moveTo(x, y - size * 2.4);
          ctx.lineTo(x + size * 1.6, y);
          ctx.lineTo(x, y + size * 2.4);
          ctx.lineTo(x - size * 1.6, y);
          ctx.closePath();
          ctx.fill();
        }
        ctx.strokeStyle = "rgba(250,255,255," + (0.42 * alpha) + ")";
        ctx.lineWidth = 1.2;
        for (let i = 0; i < 5; i++) {
          const y = (i - 2) * 18 * shrink;
          ctx.beginPath();
          ctx.moveTo(len * 0.06, y * 0.35);
          ctx.bezierCurveTo(len * 0.3, y - 20 * alpha, len * 0.62, y + 24 * alpha, len * 0.96, y * 1.8);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.restore();
    }

    function drawAimLaser() {
      if (!aimRay) return;
      if (!player.isMoving) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = aimRay.enemy ? "rgba(255, 45, 38, 0.72)" : "rgba(230, 34, 32, 0.52)";
      ctx.lineWidth = 1.15;
      ctx.beginPath();
      ctx.moveTo(aimRay.x1, aimRay.y1);
      ctx.lineTo(aimRay.x2, aimRay.y2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(255, 205, 205, 0.22)";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(aimRay.x1, aimRay.y1);
      ctx.lineTo(aimRay.x2, aimRay.y2);
      ctx.stroke();
      if (isMobile) {
        ctx.restore();
        return;
      }
      const marker = mobileAimMarkerWorld();
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = "rgba(255,255,255,0.86)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(marker.x - 11, marker.y);
      ctx.lineTo(marker.x - 3, marker.y);
      ctx.moveTo(marker.x + 3, marker.y);
      ctx.lineTo(marker.x + 11, marker.y);
      ctx.moveTo(marker.x, marker.y - 11);
      ctx.lineTo(marker.x, marker.y - 3);
      ctx.moveTo(marker.x, marker.y + 3);
      ctx.lineTo(marker.x, marker.y + 11);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(marker.x, marker.y, 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function mobileAimMarkerWorld() {
      if (isMobile && mobileControls.shoot && (mobileControls.aimScreenX || mobileControls.aimScreenY)) {
        return screenToWorld(mobileControls.aimScreenX, mobileControls.aimScreenY);
      }
      return { x: aimRay.x2, y: aimRay.y2 };
    }

    function drawMobileAimCursor() {
      if (!mobileControls.aimScreenX && !mobileControls.aimScreenY) initMobileAimCursor();
      const x = mobileControls.aimScreenX;
      const y = mobileControls.aimScreenY;
      ctx.save();
      ctx.globalCompositeOperation = "source-over";
      ctx.strokeStyle = mobileControls.shoot ? "rgba(255,255,255,0.96)" : "rgba(255,255,255,0.58)";
      ctx.lineWidth = mobileControls.shoot ? 2.2 : 1.6;
      ctx.beginPath();
      ctx.moveTo(x - 12, y);
      ctx.lineTo(x - 4, y);
      ctx.moveTo(x + 4, y);
      ctx.lineTo(x + 12, y);
      ctx.moveTo(x, y - 12);
      ctx.lineTo(x, y - 4);
      ctx.moveTo(x, y + 4);
      ctx.lineTo(x, y + 12);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 5.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 3));
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function addHealPlus(x, y, positive = true) {
      healPluses.push({
        x: x + (Math.random() - 0.5) * 18,
        y: y - 38 + (Math.random() - 0.5) * 6,
        life: 0.64,
        maxLife: 0.64,
        s: 0.9 + Math.random() * 0.25,
        positive
      });
      if (healPluses.length > 18) healPluses.shift();
    }

    function drawHealPluses() {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "900 24px Arial";
      for (const plus of healPluses) {
        const p = 1 - plus.life / plus.maxLife;
        const alpha = Math.max(0, Math.min(1, plus.life / plus.maxLife));
        const s = plus.s * (0.82 + Math.sin(p * Math.PI) * 0.34);
        ctx.save();
        ctx.translate(plus.x, plus.y);
        ctx.scale(s, s);
        ctx.globalAlpha = alpha;
        ctx.shadowColor = "rgba(115,255,190,0.9)";
        ctx.shadowBlur = 12;
        ctx.strokeStyle = plus.positive ? "rgba(14,60,42,0.9)" : "rgba(62,12,18,0.92)";
        ctx.lineWidth = 4;
        ctx.strokeText(plus.positive ? "+" : "-", 0, 0);
        ctx.fillStyle = plus.positive ? "rgba(170,255,214,0.96)" : "rgba(255,120,145,0.96)";
        ctx.fillText(plus.positive ? "+" : "-", 0, 0);
        ctx.restore();
      }
      ctx.restore();
    }

    function drawOriginalFlashlightLayer() {
      const z = camera.zoom;
      const px = screenX(player.x);
      const py = screenY(player.y);
      const forward = { x: Math.cos(player.angle), y: Math.sin(player.angle) };
      const healthEnergy = player.hp / 100;
      const mainEnergy = 0.98 * healthEnergy;

      lightCtx.setTransform(scale, 0, 0, scale, 0, 0);
      lightCtx.clearRect(0, 0, width, height);
      lightCtx.globalCompositeOperation = "source-over";
      lightCtx.fillStyle = "rgba(0, 0, 0, 0.68)";
      lightCtx.fillRect(0, 0, width, height);

      lightCtx.globalCompositeOperation = "destination-out";
      drawInstalledLights(lightCtx);
      drawKillLights(lightCtx);
      drawBlastLights(lightCtx);
      drawSoftConeLight(lightCtx, px, py, player.angle, 450 * z, PLAYER_VIEW_ANGLE * 0.5, mainEnergy * 0.92);
      const remoteLights = coopRemotePeers()
        .filter((actor) => (actor.hp || 0) > 0)
        .map((actor) => coopRemoteFlashlightParams(actor))
        .filter(Boolean);
      for (const remoteLight of remoteLights) {
        drawSoftConeLight(lightCtx, remoteLight.px, remoteLight.py, remoteLight.angle, 480 * z, PLAYER_VIEW_ANGLE * 0.5, remoteLight.energy * 1.22);
      }
      for (const flash of flashes) {
        const alpha = Math.max(0, flash.life / flash.maxLife);
        drawLightTexture(lightCtx, assets.shotLight, screenX(flash.x), screenY(flash.y), flash.angle + Math.PI / 2, 430 * z, 430 * z, alpha * 0.9);
      }
      for (const b of bullets) {
        drawLightTexture(lightCtx, assets.lightSmall, screenX(b.x), screenY(b.y), 0, 64 * z, 64 * z, 0.45);
      }

      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.drawImage(lightCanvas, 0, 0, width, height);
      drawVisibleKillBloom();
      drawVisibleBlastBloom();
      drawVisibleFizzles();
      ctx.save();
      ctx.scale(camera.zoom, camera.zoom);
      ctx.translate(-camera.x, -camera.y);
      drawFacility();
      ctx.restore();
    }

    function coopRemoteFlashlightParams(actor) {
      if (!actor) return null;
      const angle = Number(actor.angle) || 0;
      const px = screenX(actor.x);
      const py = screenY(actor.y);
      const energy = Math.max(0.32, Math.min(1, (actor.hp || 100) / 100)) * 0.98;
      return { px, py, angle, energy };
    }

    function drawInstalledLights(target) {
      const boost = fixtureBoost;
      const z = camera.zoom;
      for (const f of fixtures) {
        const x = screenX(f.x);
        const y = screenY(f.y);
        const energy = f.energy * (1 + boost * 2.4);
        const radius = f.radius * (1 + boost * 0.42) * z;
        if (x < -radius || y < -radius || x > width + radius || y > height + radius) continue;
        drawRadialLight(target, x, y, 12 * z, radius, energy);
        drawSoftRectLight(target, x, y, f.angle, f.w * 1.35 * z, radius * 0.7, energy * 0.48);
      }
    }

    function drawKillLights(target) {
      for (const k of killLights) {
        const age = 1 - k.life / k.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = k.radius * (0.62 + age * 0.55);
        const energy = 1.75 * pulse;
        drawRadialLight(target, screenX(k.x), screenY(k.y), 18 * camera.zoom, radius * camera.zoom, energy);
        drawRadialLight(target, screenX(k.x), screenY(k.y), 4 * camera.zoom, radius * 0.42 * camera.zoom, energy * 1.15);
      }
    }

    function drawBlastLights(target) {
      for (const b of blastLights) {
        const age = 1 - b.life / b.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = b.radius * (0.72 + age * 0.35);
        const energy = 1.8 * pulse;
        drawOccludedRadialLight(target, b.x, b.y, radius, energy);
      }
    }

    function drawOccludedRadialLight(target, x, y, radius, energy) {
      const points = visibilityPoints(x, y, radius, 96);
      if (!points.length) return;
      target.save();
      target.beginPath();
      target.moveTo(screenX(points[0].x), screenY(points[0].y));
      for (let i = 1; i < points.length; i++) {
        target.lineTo(screenX(points[i].x), screenY(points[i].y));
      }
      target.closePath();
      target.clip();
      drawRadialLight(target, screenX(x), screenY(y), 10 * camera.zoom, radius * camera.zoom, energy);
      drawRadialLight(target, screenX(x), screenY(y), 3 * camera.zoom, radius * 0.38 * camera.zoom, energy * 1.1);
      target.restore();
    }

    function drawVisibleKillBloom() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const k of killLights) {
        const age = 1 - k.life / k.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const x = screenX(k.x);
        const y = screenY(k.y);
        const radius = k.radius * (0.45 + age * 0.55) * camera.zoom;
        const gradient = ctx.createRadialGradient(x, y, 6, x, y, radius);
        gradient.addColorStop(0, "rgba(255,255,255," + (0.72 * pulse) + ")");
        gradient.addColorStop(0.18, "rgba(255,232,215," + (0.42 * pulse) + ")");
        gradient.addColorStop(0.55, "rgba(255,180,145," + (0.16 * pulse) + ")");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawVisibleBlastBloom() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const b of blastLights) {
        const age = 1 - b.life / b.maxLife;
        const pulse = Math.sin((1 - age) * Math.PI);
        const radius = b.radius * (0.58 + age * 0.28);
        const points = visibilityPoints(b.x, b.y, radius, 80);
        if (!points.length) continue;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(screenX(points[0].x), screenY(points[0].y));
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(screenX(points[i].x), screenY(points[i].y));
        }
        ctx.closePath();
        ctx.clip();
        const x = screenX(b.x);
        const y = screenY(b.y);
        const sr = radius * camera.zoom;
        const gradient = ctx.createRadialGradient(x, y, 5 * camera.zoom, x, y, sr);
        gradient.addColorStop(0, "rgba(255,250,230," + (0.78 * pulse) + ")");
        gradient.addColorStop(0.24, "rgba(255,194,130," + (0.34 * pulse) + ")");
        gradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, sr, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawVisibleFizzles() {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const f of fizzles) {
        const remain = Math.max(0, f.life / f.maxLife);
        const age = 1 - remain;
        const x = screenX(f.x);
        const y = screenY(f.y);
        const z = camera.zoom;

        const flash = Math.max(0, 1 - age * 9);
        const smoke = Math.sin(Math.min(1, age) * Math.PI) * remain;
        const flashGradient = ctx.createRadialGradient(x, y, 2 * z, x, y, 30 * z);
        flashGradient.addColorStop(0, "rgba(255,235,185," + (0.72 * flash) + ")");
        flashGradient.addColorStop(0.22, "rgba(255,150,80," + (0.34 * flash) + ")");
        flashGradient.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = flashGradient;
        ctx.beginPath();
        ctx.arc(x, y, 30 * z, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalCompositeOperation = "source-over";
        ctx.strokeStyle = "rgba(180, 178, 170," + (0.36 * smoke) + ")";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, (8 + age * 14) * z, f.angle, f.angle + Math.PI * 1.25);
        ctx.stroke();
        ctx.strokeStyle = "rgba(40, 38, 36," + (0.22 * smoke) + ")";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, (12 + age * 18) * z, f.angle + 1.4, f.angle + Math.PI * 1.9);
        ctx.stroke();

        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(255,205,120," + (0.8 * remain) + ")";
        ctx.lineWidth = 1.6;
        for (let i = 0; i < 6; i++) {
          const a = f.angle + i * 0.72 + age * 5;
          const inner = (7 + age * 8) * z;
          const outer = (16 + i * 1.2 + age * 8) * z;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * inner, y + Math.sin(a) * inner);
          ctx.lineTo(x + Math.cos(a) * outer, y + Math.sin(a) * outer);
          ctx.stroke();
        }
      }
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
    }

    function drawSoftRectLight(target, x, y, angle, widthSize, length, energy) {
      target.save();
      target.translate(x, y);
      target.rotate(angle);
      const gradient = target.createRadialGradient(0, 0, 8, 0, 0, length);
      gradient.addColorStop(0, "rgba(0,0,0," + (0.56 * energy) + ")");
      gradient.addColorStop(0.28, "rgba(0,0,0," + (0.32 * energy) + ")");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      target.fillStyle = gradient;
      target.beginPath();
      target.ellipse(0, 0, widthSize, length * 0.62, 0, 0, Math.PI * 2);
      target.fill();
      target.restore();
    }

    function drawSoftConeLight(target, x, y, angle, length, halfAngle, energy) {
      for (let i = 0; i < 7; i++) {
        const t = i / 6;
        const spread = halfAngle * (0.28 + t * 0.72);
        const alpha = energy * (0.34 - t * 0.036);
        const len = length * (0.82 + t * 0.2);
        const end = { x: x + Math.cos(angle) * len, y: y + Math.sin(angle) * len };
        const left = { x: x + Math.cos(angle - spread) * len, y: y + Math.sin(angle - spread) * len };
        const right = { x: x + Math.cos(angle + spread) * len, y: y + Math.sin(angle + spread) * len };
        const gradient = target.createLinearGradient(x, y, end.x, end.y);
        gradient.addColorStop(0, "rgba(0,0,0," + alpha + ")");
        gradient.addColorStop(0.28, "rgba(0,0,0," + (alpha * 0.82) + ")");
        gradient.addColorStop(0.72, "rgba(0,0,0," + (alpha * 0.32) + ")");
        gradient.addColorStop(1, "rgba(0,0,0,0)");
        target.fillStyle = gradient;
        target.beginPath();
        target.moveTo(x, y);
        target.lineTo(left.x, left.y);
        target.quadraticCurveTo(end.x + Math.cos(angle) * 28, end.y + Math.sin(angle) * 28, right.x, right.y);
        target.closePath();
        target.fill();
      }
    }

    function drawRadialLight(target, x, y, inner, outer, energy) {
      const gradient = target.createRadialGradient(x, y, inner, x, y, outer);
      gradient.addColorStop(0, "rgba(0,0,0," + (0.92 * energy) + ")");
      gradient.addColorStop(0.24, "rgba(0,0,0," + (0.62 * energy) + ")");
      gradient.addColorStop(0.58, "rgba(0,0,0," + (0.22 * energy) + ")");
      gradient.addColorStop(1, "rgba(0,0,0,0)");
      target.fillStyle = gradient;
      target.beginPath();
      target.arc(x, y, outer, 0, Math.PI * 2);
      target.fill();
    }

    function drawVisibleFlashlightGlow(px, py, x, y, angle, energy) {
      const z = camera.zoom;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const body = ctx.createRadialGradient(px, py, 12 * z, px, py, 130 * z);
      body.addColorStop(0, "rgba(255,240,225," + (0.16 * energy) + ")");
      body.addColorStop(0.35, "rgba(205,220,235," + (0.07 * energy) + ")");
      body.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = body;
      ctx.beginPath();
      ctx.arc(px, py, 130 * z, 0, Math.PI * 2);
      ctx.fill();
      if (!assets.flashlight) {
        ctx.restore();
        return;
      }
      ctx.globalAlpha = 0.055 * energy;
      ctx.translate(x, y);
      ctx.rotate(angle + Math.PI / 2);
      const w = 1024 * 0.3 * z;
      ctx.drawImage(assets.flashlight, -w / 2, -w / 2, w, w);
      ctx.restore();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }

    function drawLightTexture(target, img, x, y, angle, w, h, alpha) {
      if (!img || alpha <= 0) return;
      target.save();
      target.globalAlpha = Math.max(0, Math.min(1, alpha));
      target.translate(x, y);
      target.rotate(angle);
      target.drawImage(img, -w / 2, -h / 2, w, h);
      target.restore();
      target.globalAlpha = 1;
    }

    function drawHud() {
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(0,0,0,0.42)";
      ctx.fillRect(16, 16, 312, 104);
      hpBar(30, 32, 210, 14, player.hp / 100);
      bar(30, 58, 210, 12, player.stamina / 100, "#d8c35f", "#383015");
      ctx.fillStyle = "#eee5d2";
      ctx.font = "700 14px Arial";
      ctx.fillText("HP " + Math.max(0, Math.ceil(player.hp)), 246, 43);
      ctx.fillText("STA", 246, 68);
      ctx.font = "700 18px Arial";
      ctx.fillText("Kills " + kills + "   Wave " + wave, 30, 92);
      ctx.font = "700 12px Arial";
      ctx.fillStyle = "#cfe2ef";
      const ammoText = selectedWeapon === "rifle" ? (rifleReload > 0 ? "RELOAD " + rifleReload.toFixed(1) : rifleAmmo + "/60") :
        selectedWeapon === "bomb" ? "x" + bombCount :
        selectedWeapon === "flamer" ? flameAmmo + "/120+" :
        selectedWeapon === "ice" ? "x" + iceAmmo : "x" + barricadeCount;
      ctx.fillText("MODE " + (itemDropMode ? "ITEM" : "NORMAL") + "  " + weaponNames[selectedWeapon] + " " + ammoText, 30, 112);
      ctx.fillStyle = bombCooldown > 0 ? "#9aa1aa" : "#f4d89a";
      ctx.fillText("E Weapon / Q Bomb", 180, 92);
      drawGameMenuButton();
      drawSpecialForcesToggle();
      drawCoopButton();
      drawCameraButtons();
      drawMiniMap();
    }

    function gameMenuButtonRect() {
      return { x: Math.max(16, width - 86), y: 58, w: 70, h: 34 };
    }

    function handleGameMenuButtonClick(x, y) {
      const rect = gameMenuButtonRect();
      if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) {
        goMainMenu();
        return true;
      }
      return false;
    }

    function drawGameMenuButton() {
      drawMenuButton(gameMenuButtonRect(), "MAIN", false);
    }

    function specialForcesToggleRect() {
      return { x: 30, y: 126, w: 186, h: 30 };
    }

    function handleSpecialForcesToggleClick(x, y) {
      const rect = specialForcesToggleRect();
      if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) {
        const next = !specialForcesEnabled;
        setSpecialForcesEnabled(next, next ? "SPECIAL ON" : "SPECIAL OFF");
        if (coopIsHostWorldClient()) coopRememberSpecialForcesAction(next);
        return true;
      }
      return false;
    }

    function drawSpecialForcesToggle() {
      const rect = specialForcesToggleRect();
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.42)";
      ctx.strokeStyle = "rgba(255,255,255,0.24)";
      ctx.lineWidth = 1.4;
      roundRect(rect.x, rect.y, rect.w, rect.h, 6);
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = specialForcesEnabled ? "#f2d28c" : "#9aa1aa";
      ctx.strokeRect(rect.x + 9, rect.y + 8, 14, 14);
      if (specialForcesEnabled) {
        ctx.strokeStyle = "#f2d28c";
        ctx.lineWidth = 2.3;
        ctx.beginPath();
        ctx.moveTo(rect.x + 12, rect.y + 15);
        ctx.lineTo(rect.x + 16, rect.y + 19);
        ctx.lineTo(rect.x + 24, rect.y + 9);
        ctx.stroke();
      }
      ctx.fillStyle = "#e7decf";
      ctx.font = "700 12px Arial";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("SPECIAL FORCES", rect.x + 32, rect.y + rect.h / 2 + 1);
      if (voiceCommandStatusTimer > 0) {
        ctx.fillStyle = specialForcesEnabled ? "#f2d28c" : "#b8c0ca";
        ctx.font = "700 10px Arial";
        ctx.fillText(voiceCommandStatus, rect.x + rect.w + 10, rect.y + rect.h / 2 + 1);
      }
      ctx.restore();
    }

    function coopButtonRect() {
      return { x: 30, y: 164, w: 186, h: 30 };
    }

    function handleCoopButtonClick(x, y) {
      const rect = coopButtonRect();
      if (x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h) {
        ensureCoopPanel();
        coopPanel.style.display = coopPanel.style.display === "none" ? "block" : "none";
        return true;
      }
      return false;
    }

    function drawCoopButton() {
      const rect = coopButtonRect();
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.42)";
      ctx.strokeStyle = coop.connected ? "rgba(110,190,255,0.88)" : "rgba(255,255,255,0.24)";
      ctx.lineWidth = 1.4;
      roundRect(rect.x, rect.y, rect.w, rect.h, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = coop.connected ? "#9ed8ff" : "#e7decf";
      ctx.font = "700 12px Arial";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("WEBRTC COOP", rect.x + 12, rect.y + rect.h / 2 + 1);
      ctx.fillStyle = coop.connected ? "#9ed8ff" : "#9aa1aa";
      ctx.textAlign = "right";
      ctx.fillText(coop.connected ? "LINK" : coop.status, rect.x + rect.w - 10, rect.y + rect.h / 2 + 1);
      ctx.restore();
    }

    function coopStatusText() {
      return coop.busy ? coop.busyText + " 吏꾪뻾以?.." : coop.status;
    }

    function coopRenderStatus() {
      const node = document.getElementById("coop-status");
      if (node) node.textContent = coopStatusText();
    }

    function setCoopStatus(text) {
      coop.status = text;
      coopRenderStatus();
      coopRefreshPanel();
    }

    function coopSetBusy(text) {
      coop.busy = !!text;
      coop.busyText = text || "";
      coopRenderStatus();
      coopRefreshPanel();
    }

    async function coopRunBusy(label, task) {
      if (coop.busy) return false;
      coopSetBusy(label);
      try {
        await task();
        return true;
      } finally {
        coopSetBusy("");
      }
    }

    function coopChooseHost(forceRelay = false, hostMode = "coop") {
      coop.role = "host";
      coop.hostMode = hostMode === "pvp" ? "pvp" : "coop";
      coop.guestSlotCount = Math.max(1, coop.guestSlotCount || 1);
      coop.relayMode = !!forceRelay;
      coop.codeView = "local";
      coop.scannedOfferReady = false;
      if (coop.hostMode === "pvp") resetWorld();
      coopRefreshPanel();
      return coopStartHost();
    }

    function coopChooseGuest(forceRelay = false) {
      coopDisconnect(false);
      coop.relayMode = !!forceRelay;
      coop.role = "guest";
      coop.guestClass = coop.guestClass || "gunner";
      coop.codeView = "remote";
      coop.scannedOfferReady = false;
      coopSetVisibleCode("", false);
      setCoopStatus("SCAN HOST QR");
      coopRefreshPanel();
    }

    function coopChooseGuestClass() {
      coopDisconnect(false);
      coop.role = "guest-class";
      coop.codeView = "remote";
      setCoopStatus("SELECT GUEST CLASS");
      coopRefreshPanel();
    }

    function coopSelectGuestClass(kind) {
      coop.guestClass = kind === "healer" ? "healer" : "gunner";
      healerEnergy = 10;
      healerReserve = 0;
      healerReload = 0;
      healerActive = false;
      healerMode = "none";
      return coopChooseGuest();
    }

    function coopChooseHostMode() {
      coopDisconnect(false);
      coop.role = "host-mode";
      coop.hostMode = "";
      coop.guestSlotCount = 1;
      coop.codeView = "remote";
      setCoopStatus("SELECT HOST MODE");
      coopRefreshPanel();
    }

    async function coopAddGuestSlot() {
      if (coop.role !== "host" && coop.role !== "host-mode") return;
      coop.guestSlotCount = Math.min(4, Math.max(1, coop.guestSlotCount || 1) + 1);
      coopToast("GUEST " + coop.guestSlotCount + " SLOT ADDED");
      if (coop.role === "host") {
        await coopCreateExtraHostSlot(coop.guestSlotCount - 1);
      }
      coopRefreshPanel();
    }

    function coopRemoveGuestSlot() {
      if (Array.isArray(coop.hostSlots) && coop.guestSlotCount > 1) {
        const slot = coop.hostSlots[coop.guestSlotCount - 2];
        if (slot) {
          if (slot.channel) slot.channel.close();
          if (slot.pc) slot.pc.close();
        }
        coop.hostSlots.splice(coop.guestSlotCount - 2, 1);
        coop.extraRemotes = coop.hostSlots.map((s) => s && s.remote).filter(Boolean);
      }
      coop.guestSlotCount = Math.max(1, (coop.guestSlotCount || 1) - 1);
      coop.activeHostSlot = Math.min(coop.activeHostSlot || 0, coop.guestSlotCount - 1);
      coopRefreshPanel();
    }

    function coopPrimaryScanAction() {
      if (coop.role === "guest" && (coop.scannedOfferReady || !!coopGetRemoteSignal()) && !coopGetLocalSignal()) {
        return coopUseRemoteCode(coopGetRemoteSignal());
      }
      return coopStartQrScan();
    }

    function coopUseButtonAction() {
      if (coop.role === "host" && (/^FAILED\b/.test(coop.status) || /^TURN RELAY FAIL\b/.test(coop.status) || coop.lastError)) {
        return coopStartRelayRetry();
      }
      if (coop.role === "guest" && (/^FAILED\b/.test(coop.status) || /^TURN RELAY FAIL\b/.test(coop.status) || coop.lastError)) {
        coop.relayMode = true;
        coopToast("RELAY GUEST CODE CREATING");
        return coopUseRemoteCode(coopGetRemoteSignal());
      }
      return coopUseRemoteCode(document.getElementById("coop-code").value);
    }

    function coopStartRelayRetry() {
      coop.relayMode = true;
      coopToast("RELAY QR CREATING");
      return coopChooseHost(true);
    }

    function coopSetVisibleCode(text, readonly) {
      const codeNode = document.getElementById("coop-code");
      if (!codeNode) return;
      codeNode.value = text || "";
      codeNode.readOnly = !!readonly;
    }

    function coopShowLocalCode() {
      coop.codeView = "local";
      coopSetVisibleCode(coopGetLocalSignal(), true);
      coopRefreshPanel();
    }

    function coopShowRemoteCode() {
      const remoteNode = document.getElementById("coop-remote");
      const remoteCode = remoteNode ? remoteNode.value : "";
      coop.codeView = "remote";
      coopSetVisibleCode(remoteCode, false);
      const qrBox = document.getElementById("coop-qr-box");
      if (qrBox) qrBox.style.display = "none";
      coopRefreshPanel();
    }

    function coopSyncManualCodeInput() {
      if (!coopPanel || coop.codeView === "local") return;
      const codeNode = document.getElementById("coop-code");
      const remoteNode = document.getElementById("coop-remote");
      if (!codeNode || !remoteNode) return;
      const value = codeNode.value || "";
      if (remoteNode.value !== value) remoteNode.value = value;
      if (coop.role === "guest" && !coopGetLocalSignal()) {
        const ready = !!value.trim();
        if (coop.scannedOfferReady !== ready) coop.scannedOfferReady = ready;
      }
    }

    function coopPollPanelInput() {
      if (!coopPanel || coopPanel.style.display === "none") return;
      const prevReady = coop.scannedOfferReady;
      const prevRemote = document.getElementById("coop-remote") ? document.getElementById("coop-remote").value : "";
      coopSyncManualCodeInput();
      const nextRemote = document.getElementById("coop-remote") ? document.getElementById("coop-remote").value : "";
      if (prevReady !== coop.scannedOfferReady || prevRemote !== nextRemote) {
        if (coop.role === "guest" && !coopGetLocalSignal()) setCoopStatus(coop.scannedOfferReady ? "HOST CODE READY" : "SCAN HOST QR");
        else coopRefreshPanel();
      }
    }

    function coopRefreshPanel() {
      if (!coopPanel) return;
      coopSyncManualCodeInput();
      coopRenderStatus();
      const roleRow = document.getElementById("coop-role-row");
      const actionRow = document.getElementById("coop-action-row");
      const scanButton = document.getElementById("coop-scan");
      const useButton = document.getElementById("coop-use");
      const qrButton = document.getElementById("coop-qr-toggle");
      const hostButton = document.getElementById("coop-host");
      const guestButton = document.getElementById("coop-guest");
      const modeRow = document.getElementById("coop-mode-row");
      const guestClassRow = document.getElementById("coop-guest-class-row");
      const slots = document.getElementById("coop-slots");
      const resetButton = document.getElementById("coop-disconnect");
      const copyButton = document.getElementById("coop-copy");
      const copyQrButton = document.getElementById("coop-copy-qr");
      const copyRow = document.getElementById("coop-copy-row");
      const codeLabel = document.getElementById("coop-code-label");
      const help = document.getElementById("coop-help");
      const net = document.getElementById("coop-net");
      if (!roleRow || !actionRow || !scanButton || !useButton || !qrButton || !copyRow || !codeLabel || !help || !net) return;
      const hasLocal = !!coopGetLocalSignal();
      const hasRemote = !!coopGetRemoteSignal();
      const qrBox = document.getElementById("coop-qr-box");
      const qrOpen = !!qrBox && qrBox.style.display !== "none";
      const failed = /^FAILED\b/.test(coop.status) || /^TURN RELAY FAIL\b/.test(coop.status) || coop.lastError === "PC_FAILED" || coop.lastError === "ICE_FAILED" || /^NO_RELAY/.test(coop.lastError || "");
      roleRow.style.display = coop.role ? "none" : "grid";
      if (modeRow) modeRow.style.display = coop.role === "host-mode" ? "grid" : "none";
      if (guestClassRow) guestClassRow.style.display = coop.role === "guest-class" ? "grid" : "none";
      actionRow.style.display = coop.role && coop.role !== "host-mode" && coop.role !== "guest-class" ? "grid" : "none";
      scanButton.style.display = coop.role === "guest" && !hasLocal ? "" : "none";
      useButton.style.display = coop.role === "host" || (coop.role === "guest" && failed && hasRemote) ? "" : "none";
      qrButton.style.display = hasLocal && coop.codeView === "local" ? "" : "none";
      copyRow.style.display = hasLocal && coop.codeView === "local" ? "flex" : "none";
      if (slots) {
        const count = Math.max(1, coop.guestSlotCount || 1);
        slots.style.display = coop.role === "host" || coop.role === "host-mode" ? "block" : "none";
        slots.innerHTML = "";
        if (slots.style.display !== "none") {
          for (let i = 1; i <= count; i++) {
            const index = i - 1;
            const slot = index === 0 ? { connected: !!(coop.channel && coop.channel.readyState === "open"), localSignal: coopGetLocalSignal() } : (coop.hostSlots && coop.hostSlots[index - 1]);
            const selected = (coop.activeHostSlot || 0) === index;
            const state = slot && slot.connected ? "CONNECTED" : (slot && slot.localSignal ? "QR READY" : "READY");
            const removable = i > 1;
            slots.innerHTML += '<div style="display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:6px;margin:4px 0;padding:6px;border:1px solid ' + (selected ? 'rgba(130,210,255,.75)' : 'rgba(120,170,220,.28)') + ';border-radius:5px"><button class="coop-slot-show" type="button" data-slot="' + index + '">GUEST ' + i + ' ' + state + '</button>' + (removable ? '<button class="coop-slot-minus" type="button" data-slot="' + i + '">-</button>' : '<span style="color:#7f8fa3">required</span>') + '</div>';
          }
          slots.innerHTML += '<button id="coop-slot-plus" type="button" style="margin-top:4px;width:100%">+ GUEST SLOT</button>';
          const plus = document.getElementById("coop-slot-plus");
          if (plus) plus.onclick = () => coopAddGuestSlot();
          slots.querySelectorAll(".coop-slot-show").forEach((button) => {
            button.onclick = async () => {
              const index = Number(button.dataset.slot) || 0;
              if (coop.role === "host" && index > 0) await coopEnsureHostSlot(index);
              coopSelectHostSlot(index);
            };
          });
          slots.querySelectorAll(".coop-slot-minus").forEach((button) => {
            button.onclick = () => coopRemoveGuestSlot();
          });
        }
      }
      if (!coop.role) {
        codeLabel.textContent = "HOST OR GUEST";
        help.textContent = "PC uses HOST. Phone uses GUEST.";
      } else if (coop.role === "host-mode") {
        codeLabel.textContent = "HOST MODE";
        help.textContent = "COOP starts a two-player room. Use + to prepare one more guest slot.";
      } else if (coop.role === "guest-class") {
        codeLabel.textContent = "GUEST CLASS";
        help.textContent = "GUNNER fights. HEALER links to the host and heals at close range.";
      } else if (coop.role === "host") {
        useButton.textContent = failed ? "RETRY RELAY" : coop.codeView === "local" ? "ENTER GUEST CODE" : "CONNECT";
        qrButton.textContent = qrOpen ? "HIDE HOST QR" : "SHOW HOST QR";
        if (failed) {
          codeLabel.textContent = "CONNECTION FAILED";
          help.textContent = /^NO_RELAY/.test(coop.lastError || "") ? "TURN relay candidate was not created. This browser/network cannot reach the free relay server. Try RESET; if it repeats, a real TURN server is required." : hasRemote ? "Guest code was received, but WebRTC could not make a direct network path. Press RETRY RELAY to create a new host QR using TURN relay." : "Connection failed before the guest code was accepted. Try RESET.";
        } else if (coop.codeView === "local") {
          codeLabel.textContent = "HOST QR - SHOW TO GUEST";
          help.textContent = "Guest scans this. Then enter the guest code here to finish.";
        } else {
          codeLabel.textContent = hasRemote ? "GUEST CODE - PRESS CONNECT" : "PASTE GUEST CODE";
          help.textContent = "Paste the code from the guest phone, then press CONNECT.";
        }
      } else {
        qrButton.textContent = qrOpen ? "HIDE GUEST QR" : "SHOW GUEST QR";
        useButton.textContent = failed && hasRemote ? "RETRY RELAY" : "CONNECT";
        scanButton.textContent = (coop.scannedOfferReady || hasRemote) && !hasLocal ? "CONNECT" : "SCAN";
        if (failed) {
          codeLabel.textContent = "CONNECTION FAILED";
          help.textContent = /^NO_RELAY/.test(coop.lastError || "") ? "TURN relay candidate was not created. This browser/network cannot reach the free relay server. Try RESET; if it repeats, a real TURN server is required." : hasRemote ? "Direct network failed. Press RETRY RELAY, show the new guest QR to the host, then host presses CONNECT." : "Host code was read, but WebRTC could not make a network path. Try RESET.";
        } else if (coop.codeView === "local") {
          codeLabel.textContent = "GUEST CODE - ENTER ON HOST";
          help.textContent = "Send or type this code into the host PC.";
        } else {
          codeLabel.textContent = (coop.scannedOfferReady || hasRemote) ? "HOST CODE READY - PRESS CONNECT" : "SCAN HOST QR";
          help.textContent = (coop.scannedOfferReady || hasRemote) ? "Press CONNECT to create your guest code." : "Scan the host QR.";
        }
      }
      const types = " / TYPE " + (coop.localCandidateTypes || "-") + ":" + (coop.remoteCandidateTypes || "-");
      const path = coop.selectedPathType ? " / PATH " + coop.selectedPathType + (coop.selectedPathDetail ? ":" + coop.selectedPathDetail : "") : "";
      const error = coop.lastError ? " / ERR " + coop.lastError : "";
      const mode = "MODE " + (coop.relayMode ? "RELAY" : "DIRECT");
      const role = mode + " / ROLE " + (coop.role || "-") + " / HOSTMODE " + (coop.hostMode || "-") + " / VIEW " + (coop.codeView || "-");
      net.textContent = role + " / PC " + coop.pcState + " / ICE " + coop.iceState + " / GATHER " + coop.iceGathering + " / CAND " + coop.localCandidates + ":" + coop.remoteCandidates + types + path + error;
      const lockButtons = [hostButton, guestButton, useButton, scanButton, qrButton, copyButton, copyQrButton];
      lockButtons.forEach((button) => {
        if (!button) return;
        button.disabled = coop.busy;
        button.style.opacity = coop.busy ? "0.46" : "1";
        button.style.pointerEvents = coop.busy ? "none" : "auto";
      });
      if (resetButton) {
        resetButton.disabled = false;
        resetButton.style.opacity = "1";
        resetButton.style.pointerEvents = "auto";
      }
    }

    async function coopSetLocalDescriptionSignal(description) {
      coopSetCandidateInfo("local", description);
      const packed = await coopPackSignal(description);
      coopSetLocalSignal(packed);
    }

    function coopCountCandidates(description) {
      const sdp = description && description.sdp ? description.sdp : "";
      const matches = sdp.match(/^a=candidate:/gm);
      return matches ? matches.length : 0;
    }

    function coopCandidateTypes(description) {
      const sdp = description && description.sdp ? description.sdp : "";
      const types = [];
      const regex = / typ ([a-zA-Z0-9]+)/g;
      let match;
      while ((match = regex.exec(sdp))) {
        if (!types.includes(match[1])) types.push(match[1]);
      }
      return types.join("+");
    }

    function coopSetCandidateInfo(side, description) {
      const count = coopCountCandidates(description);
      const types = coopCandidateTypes(description);
      if (side === "local") {
        coop.localCandidates = count;
        coop.localCandidateTypes = types;
      } else {
        coop.remoteCandidates = count;
        coop.remoteCandidateTypes = types;
      }
    }

    function coopHasRelay(side) {
      const types = side === "local" ? coop.localCandidateTypes : coop.remoteCandidateTypes;
      return /(^|\+)relay($|\+)/.test(types || "");
    }

    async function coopPackSignal(description) {
      const json = JSON.stringify(description);
      if (window.CompressionStream) {
        try {
          const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
          const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
          return "BN1." + coopBase64UrlEncode(bytes);
        } catch (err) {
          console.warn("Signal compression failed", err);
        }
      }
      return "BNR." + coopBase64UrlEncode(new TextEncoder().encode(json));
    }

    async function coopUnpackSignal(text) {
      const code = (text || "").trim();
      if (!code) throw new Error("Empty code");
      if (code.startsWith("{")) return JSON.parse(code);
      if (code.startsWith("BN1.")) {
        if (!window.DecompressionStream) throw new Error("Compressed code unsupported");
        const bytes = coopBase64UrlDecode(code.slice(4));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
      }
      if (code.startsWith("BNR.")) {
        return JSON.parse(new TextDecoder().decode(coopBase64UrlDecode(code.slice(4))));
      }
      throw new Error("Unknown code");
    }

    function coopBase64UrlEncode(bytes) {
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
    }

    function coopBase64UrlDecode(text) {
      const normalized = text.replace(/-/g, "+").replace(/_/g, "/");
      const padded = normalized + "=".repeat((4 - normalized.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function coopCopyLocalSignal() {
      try {
        await navigator.clipboard.writeText(coopGetLocalSignal());
        setCoopStatus("COPIED");

        if (coopCopyTextFallback(coopGetLocalSignal())) {
          setCoopStatus("COPIED");
          coopToast("CODE COPIED");
        } else {
          setCoopStatus("COPY FAIL");
          coopToast("COPY FAILED", false);
        }
      }
    }

    function coopCopyTextFallback(text) {
      try {
        const area = document.createElement("textarea");
        area.value = text;
        area.setAttribute("readonly", "readonly");
        area.style.position = "fixed";
        area.style.left = "-9999px";
        area.style.top = "0";
        document.body.appendChild(area);
        area.focus();
        area.select();
        const ok = document.execCommand && document.execCommand("copy");
        document.body.removeChild(area);
        return !!ok;
      } catch {
        return false;
      }
    }

    function coopToggleQr() {
