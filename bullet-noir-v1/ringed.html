<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ringed</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050706;
      color: #d8d8d8;
      font-family: Arial, sans-serif;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
      outline: none;
    }

    #status {
      position: fixed;
      left: 14px;
      bottom: 12px;
      font-size: 13px;
      color: #d8d8d8;
      text-shadow: 0 1px 2px #000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="status">Loading Ringed...</div>

  <script>
    var statusElement = document.getElementById("status");
    var Module = {
      TOTAL_MEMORY: 268435456,
      arguments: ["-main_pack", "data.pck"],
      canvas: document.getElementById("canvas"),
      preRun: [function() {
        Module.setStatus("Loading game pack...");
        FS.createPreloadedFile("/", "data.pck", "data.pck", true, false);
      }],
      print: function(text) {
        console.log(text);
      },
      printErr: function(text) {
        console.warn(text);
      },
      setStatus: function(text) {
        statusElement.textContent = text || "";
        if (!text) statusElement.style.display = "none";
      },
      locateFile: function(path) {
        if (path === "godot.javascript.opt.html.mem") return "ringed.mem";
        if (path === "godot.javascript.opt.asm.js") return "ringed.asm.js";
        return path;
      }
    };

    Module.memoryInitializerRequest = new XMLHttpRequest();
    Module.memoryInitializerRequest.open("GET", "ringed.mem", true);
    Module.memoryInitializerRequest.responseType = "arraybuffer";
    Module.memoryInitializerRequest.send(null);

    window.addEventListener("load", function() {
      Module.canvas.focus();
    });
  </script>
  <script src="ringed.asm.js"></script>
  <script src="ringed.js"></script>
</body>
</html>
